name: Compilar Supernova (APK + AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: APK + AAB Android (firmados)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta web (www)
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp index.html music_map.json icon.png www/
          cp -r lib music sfx www/
          echo "--- www ---"
          ls -la www
          du -sh www

      - name: Crear y sincronizar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Bloquear orientacion vertical
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' "$MAN"
          grep -n "screenOrientation" "$MAN" || true

      - name: Aplicar icono de la app
        run: |
          set -e
          RES=android/app/src/main/res
          cp -rv android-icons/* "$RES"/
          echo "--- iconos instalados ---"
          ls -la "$RES"/mipmap-*/ic_launcher*.png

      - name: Preparar keystore para Play Store
        run: |
          set -e
          if [ -f keystore/supernova-upload.keystore ]; then
            echo "Usando keystore existente del repositorio"
            cp keystore/supernova-upload.keystore "$RUNNER_TEMP/supernova-upload.keystore"
          else
            echo "Generando keystore nuevo (solo la primera vez)"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/supernova-upload.keystore" \
              -alias supernova \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass supernova2026 -keypass supernova2026 \
              -dname "CN=Supernova, O=Sgborbolla, C=CU"
          fi

      - name: Guardar keystore como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Supernova-KEYSTORE-PRIVADO
          path: ${{ runner.temp }}/supernova-upload.keystore
          if-no-files-found: warn

      - name: Compilar APK y AAB firmados
        run: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/supernova-upload.keystore" \
            -Pandroid.injected.signing.store.password=supernova2026 \
            -Pandroid.injected.signing.key.alias=supernova \
            -Pandroid.injected.signing.key.password=supernova2026

      - name: Preparar artefactos
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "APK=$APK"
          echo "AAB=$AAB"
          cp "$APK" Supernova.apk
          cp "$AAB" Supernova.aab
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs Supernova.apk || true
          ls -la Supernova.apk Supernova.aab

      - name: Subir APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: Supernova-Android
          path: |
            Supernova.apk
            Supernova.aab

      - name: Publicar Release con APK y AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Supernova build ${{ github.run_number }}
          files: |
            Supernova.apk
            Supernova.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
