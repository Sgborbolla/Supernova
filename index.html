<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SUPERNOVA</title>
<script>
window.__errs=[];
function __showErr(msg){
  try{
    window.__errs.push(msg);
    var el=document.getElementById('err-overlay');
    if(!el){ el=document.createElement('div'); el.id='err-overlay';
      el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:rgba(120,0,0,0.94);color:#fff;font:11px monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto;border-bottom:2px solid #ff4444;';
      el.onclick=function(){ el.style.display='none'; };
      (document.body||document.documentElement).appendChild(el);
    }
    el.textContent='\u26a0 ERROR (toca para ocultar)\n'+window.__errs.slice(-3).join('\n---\n');
  }catch(e){}
}
window.addEventListener('error',function(e){ __showErr((e.message||'error')+' @ '+String(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno); });
window.addEventListener('unhandledrejection',function(e){ __showErr('Promise: '+((e.reason&&e.reason.message)||e.reason)); });
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;top:0;left:0;right:0;bottom:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#game-container{width:100%;height:100%;position:fixed;top:0;left:0;display:flex;align-items:center;justify-content:center;background:#000;}
#game-container canvas{display:block;touch-action:none;}
#menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(rgba(6,12,24,0.62),rgba(0,0,0,0.82));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:1000;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;color:#fff;}
#menu-overlay.hidden{display:none;}
.menu-title{font-size:clamp(30px,7vw,52px);color:#00d4ff;text-shadow:0 0 20px #00d4ff,0 0 40px #0088ff,0 0 60px #0044aa;letter-spacing:6px;margin:6px 0 2px;animation:titlePulse 2s ease-in-out infinite;font-weight:bold;}
@keyframes titlePulse{0%,100%{text-shadow:0 0 20px #00d4ff,0 0 40px #0088ff;}50%{text-shadow:0 0 30px #00ffff,0 0 60px #00aaff,0 0 80px #0066ff;}}
.menu-subtitle{font-size:clamp(9px,1.8vw,12px);color:#4488aa;letter-spacing:3px;margin-bottom:12px;}
.menu-section{margin:5px 0;text-align:center;width:100%;max-width:420px;}
.menu-label{font-size:clamp(9px,1.6vw,11px);color:#88ccdd;margin-bottom:4px;letter-spacing:2px;}
.diff-grid,.ship-select-grid{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
.diff-btn,.ship-btn{padding:7px 12px;background:rgba(0,100,150,0.2);border:1px solid #00aacc;color:#88ddee;font-family:'Courier New',monospace;font-size:clamp(9px,1.5vw,11px);cursor:pointer;border-radius:4px;transition:all 0.2s;letter-spacing:1px;animation:navIn 0.4s ease both;}
@keyframes navIn{from{opacity:0;transform:translateY(-16px) scale(0.82);}to{opacity:1;transform:translateY(0) scale(1);}}
.ship-btn.picked{animation:pickPop 0.45s ease;}
@keyframes pickPop{0%{transform:scale(1);}40%{transform:scale(1.22) rotate(-4deg);}70%{transform:scale(0.95) rotate(3deg);}100%{transform:scale(1);}}
#resume-info{font-size:10px;color:#ffdd44;letter-spacing:1px;margin-top:6px;min-height:12px;text-align:center;}
.coop-section,.menu-section,.user-section,.menu-title,.menu-subtitle,#start-btn{position:relative;z-index:1;}
.diff-btn:hover,.ship-btn:hover{background:rgba(0,180,220,0.3);border-color:#00ffff;color:#fff;}
.diff-btn.active,.ship-btn.active{background:rgba(0,200,255,0.4);border-color:#00ffff;color:#fff;box-shadow:0 0 10px rgba(0,200,255,0.5);}
.ship-btn canvas{display:block;margin:0 auto 3px;image-rendering:pixelated;}
.coop-section{margin-top:8px;padding:8px;background:rgba(0,50,80,0.3);border:1px solid #004466;border-radius:6px;width:100%;max-width:420px;}
.coop-row{display:flex;gap:5px;justify-content:center;align-items:center;margin:4px 0;flex-wrap:wrap;}
.coop-input{padding:5px 8px;background:rgba(0,30,50,0.8);border:1px solid #006688;color:#00ddff;font-family:'Courier New',monospace;font-size:11px;border-radius:3px;width:100px;text-align:center;letter-spacing:2px;}
.coop-btn{padding:5px 10px;background:rgba(0,100,150,0.3);border:1px solid #00aacc;color:#88ddee;font-family:'Courier New',monospace;font-size:10px;cursor:pointer;border-radius:3px;transition:all 0.2s;}
.coop-btn:hover{background:rgba(0,180,220,0.4);color:#fff;}
#room-code-display{font-size:13px;color:#ffdd44;letter-spacing:2px;margin:3px 0;}
#player-list,#coop-status{font-size:10px;color:#448888;margin-top:3px;min-height:12px;}
.user-section{margin-top:6px;padding:6px;background:rgba(0,50,80,0.2);border:1px solid #004466;border-radius:4px;width:100%;max-width:420px;font-size:10px;color:#88aacc;}
.user-section input{padding:3px 6px;background:rgba(0,30,50,0.8);border:1px solid #006688;color:#00ddff;font-family:monospace;font-size:10px;border-radius:2px;width:140px;}
.user-section button{padding:3px 8px;background:rgba(0,100,150,0.3);border:1px solid #00aacc;color:#88ddee;font-family:monospace;font-size:9px;cursor:pointer;border-radius:2px;margin-left:3px;}
#start-btn{margin-top:10px;padding:10px 36px;background:linear-gradient(180deg,#00cc88,#008855);border:2px solid #00ffaa;color:#fff;font-family:'Courier New',monospace;font-size:clamp(13px,2.3vw,17px);font-weight:bold;cursor:pointer;border-radius:6px;letter-spacing:3px;transition:all 0.2s;box-shadow:0 0 20px rgba(0,255,170,0.3);}
#start-btn:hover{background:linear-gradient(180deg,#00eebb,#00aa77);box-shadow:0 0 30px rgba(0,255,170,0.6);transform:scale(1.05);}
#continue-btn{margin-top:10px;padding:11px 36px;background:linear-gradient(180deg,#ffcc00,#cc8800);border:2px solid #ffee66;color:#1a1400;font-family:'Courier New',monospace;font-size:clamp(13px,2.3vw,17px);font-weight:bold;cursor:pointer;border-radius:6px;letter-spacing:2px;transition:all 0.2s;box-shadow:0 0 22px rgba(255,200,0,0.45);animation:titlePulse 2s ease-in-out infinite;}
#continue-btn:hover{background:linear-gradient(180deg,#ffe066,#ddaa00);transform:scale(1.05);}
#controls-hint{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;color:#446688;z-index:500;pointer-events:none;text-align:center;}
#mute-btn{position:absolute;top:calc(6px + env(safe-area-inset-top));right:10px;z-index:1200;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;background:rgba(0,60,90,0.55);border:1px solid #00aacc;border-radius:50%;color:#88ddee;-webkit-user-select:none;user-select:none;transition:all 0.2s;}
#mute-btn:active{transform:scale(0.92);}
#mute-btn.muted{background:rgba(90,0,0,0.55);border-color:#cc4444;color:#ff8888;}

/* ===== INTRO / PANTALLA DE APERTURA ===== */
#intro-overlay{position:fixed;inset:0;z-index:1500;background:radial-gradient(ellipse at center,#0a0520 0%,#000 100%);overflow:hidden;transition:opacity .6s ease,transform .6s ease;}
#intro-overlay.intro-hide{opacity:0;transform:scale(1.06);pointer-events:none;}
#intro-overlay .nebula{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(180,50,255,0.25) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(50,100,255,0.25) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(255,80,180,0.15) 0%,transparent 60%);animation:introNebulaShift 20s ease-in-out infinite alternate;filter:blur(20px);}
@keyframes introNebulaShift{0%{transform:scale(1) rotate(0deg);opacity:.8;}100%{transform:scale(1.15) rotate(5deg);opacity:1;}}
#intro-overlay .stars{position:absolute;inset:0;}
#intro-overlay .star{position:absolute;background:#fff;border-radius:50%;animation:introTwinkle 3s ease-in-out infinite;}
@keyframes introTwinkle{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
#intro-overlay .supernova{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(78vw,400px);height:min(78vw,400px);z-index:2;}
#intro-overlay .supernova-core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffee88 10%,#ffaa00 30%,#ff4400 60%,transparent 80%);animation:introCorePulse 2s ease-in-out infinite;filter:blur(2px);}
@keyframes introCorePulse{0%,100%{transform:scale(.9);opacity:.9;}50%{transform:scale(1.1);opacity:1;}}
#intro-overlay .supernova-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,200,100,.6);animation:introRingExpand 3s ease-out infinite;}
#intro-overlay .supernova-ring:nth-child(2){animation-delay:1s;}
#intro-overlay .supernova-ring:nth-child(3){animation-delay:2s;}
@keyframes introRingExpand{0%{transform:scale(.3);opacity:1;}100%{transform:scale(1.5);opacity:0;}}
#intro-overlay .supernova-rays{position:absolute;inset:0;animation:introRaysRotate 30s linear infinite;}
@keyframes introRaysRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
#intro-overlay .ship{position:absolute;z-index:5;filter:drop-shadow(0 0 8px currentColor);}
#intro-overlay .ship svg{width:100%;height:100%;overflow:visible;}
#intro-overlay .ship .flame{animation:introFlameFlicker .15s ease-in-out infinite alternate;transform-origin:center;}
@keyframes introFlameFlicker{0%{transform:scaleY(.9) scaleX(1.05);opacity:.8;}100%{transform:scaleY(1.1) scaleX(.95);opacity:1;}}
#intro-overlay .ship .trail{animation:introTrailPulse .3s ease-in-out infinite alternate;}
@keyframes introTrailPulse{0%{opacity:.3;transform:scaleX(.9);}100%{opacity:.7;transform:scaleX(1.1);}}
#intro-overlay .ship-1{top:18%;left:6%;width:120px;height:70px;color:#aaff44;animation:introFly1 12s ease-in-out infinite;}
#intro-overlay .ship-2{top:56%;left:3%;width:140px;height:80px;color:#44dd88;animation:introFly2 14s ease-in-out infinite;}
#intro-overlay .ship-3{top:30%;right:5%;width:120px;height:70px;color:#aa66ff;animation:introFly3 13s ease-in-out infinite;}
#intro-overlay .ship-4{top:60%;right:6%;width:130px;height:75px;color:#ff8844;animation:introFly4 15s ease-in-out infinite;}
#intro-overlay .ship-5{top:45%;left:50%;width:95px;height:56px;color:#88aaff;animation:introFly5 10s ease-in-out infinite;transform:translateX(-50%);}
@keyframes introFly1{0%,100%{transform:translate(0,0) rotate(-5deg);}50%{transform:translate(20px,-15px) rotate(0deg);}}
@keyframes introFly2{0%,100%{transform:translate(0,0) rotate(-8deg);}50%{transform:translate(25px,-20px) rotate(-3deg);}}
@keyframes introFly3{0%,100%{transform:translate(0,0) rotate(180deg) rotate(-5deg);}50%{transform:translate(-20px,-15px) rotate(180deg) rotate(0deg);}}
@keyframes introFly4{0%,100%{transform:translate(0,0) rotate(180deg) rotate(-8deg);}50%{transform:translate(-25px,-20px) rotate(180deg) rotate(-3deg);}}
@keyframes introFly5{0%,100%{transform:translateX(-50%) translateY(0) rotate(-5deg);}50%{transform:translateX(-50%) translateY(-25px) rotate(0deg);}}
#intro-overlay .asteroid{position:absolute;z-index:3;animation:introFloatAsteroid 20s ease-in-out infinite;}
@keyframes introFloatAsteroid{0%,100%{transform:translate(0,0) rotate(0deg);}25%{transform:translate(10px,-15px) rotate(5deg);}50%{transform:translate(-5px,-25px) rotate(-3deg);}75%{transform:translate(-15px,-10px) rotate(8deg);}}
#intro-overlay .laser{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#ff4444,#ff8888,#fff);box-shadow:0 0 8px #ff4444,0 0 16px #ff0000;z-index:4;animation:introLaserShoot 2s ease-in-out infinite;transform-origin:left center;}
@keyframes introLaserShoot{0%{opacity:0;transform:scaleX(0);}30%,70%{opacity:1;transform:scaleX(1);}100%{opacity:0;transform:scaleX(0);}}
#intro-overlay .title-container{position:absolute;top:8%;left:50%;transform:translateX(-50%);text-align:center;z-index:10;width:100%;padding:0 10px;}
#intro-overlay .title{font-size:clamp(44px,13vw,110px);font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#fff 0%,#e8e8e8 20%,#88aacc 40%,#4466aa 60%,#2244aa 80%,#001133 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px #00d4ff) drop-shadow(0 0 40px #0088ff) drop-shadow(0 4px 0 #001133);animation:introTitleGlow 2s ease-in-out infinite;font-family:'Arial Black',sans-serif;text-shadow:none;}
@keyframes introTitleGlow{0%,100%{filter:drop-shadow(0 0 20px #00d4ff) drop-shadow(0 0 40px #0088ff) drop-shadow(0 4px 0 #001133);}50%{filter:drop-shadow(0 0 30px #00ffff) drop-shadow(0 0 60px #00aaff) drop-shadow(0 0 80px #0066ff) drop-shadow(0 4px 0 #001133);}}
#intro-overlay .subtitle{font-size:clamp(12px,2.6vw,22px);color:#e0e8ff;letter-spacing:6px;margin-top:10px;text-shadow:0 0 10px #00d4ff,0 2px 0 #000;font-weight:bold;}
#intro-overlay .start-btn{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);z-index:20;padding:16px 46px;font-size:clamp(18px,4.4vw,34px);font-weight:bold;letter-spacing:4px;color:#fff;background:linear-gradient(180deg,#00ffcc 0%,#00aaff 100%);border:3px solid #00ffff;border-radius:8px;cursor:pointer;font-family:'Arial Black',sans-serif;text-shadow:0 0 10px #fff,0 2px 0 #005577;box-shadow:0 0 30px rgba(0,255,255,.6),inset 0 0 20px rgba(255,255,255,.3);animation:introBtnPulse 1.5s ease-in-out infinite;transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
#intro-overlay .start-btn:hover{transform:translateX(-50%) scale(1.06);box-shadow:0 0 50px rgba(0,255,255,.9),inset 0 0 30px rgba(255,255,255,.5);}
#intro-overlay .start-btn:active{transform:translateX(-50%) scale(.97);}
@keyframes introBtnPulse{0%,100%{box-shadow:0 0 30px rgba(0,255,255,.6),inset 0 0 20px rgba(255,255,255,.3);}50%{box-shadow:0 0 50px rgba(0,255,255,.9),0 0 80px rgba(0,200,255,.5),inset 0 0 30px rgba(255,255,255,.5);}}
#intro-overlay .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:8;}
#intro-overlay .spark{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff,0 0 12px #00d4ff;z-index:6;animation:introSparkFloat 8s linear infinite;}
@keyframes introSparkFloat{0%{transform:translate(0,0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}
</style>
</head>
<body>

  <div class="ship ship-3"><svg viewBox="0 0 140 80"><ellipse cx="70" cy="40" rx="15" ry="8" fill="#6600aa" opacity="0.8"/><path d="M 120,40 L 20,20 L 10,40 L 20,60 Z" fill="#aa44ff" stroke="#000" stroke-width="2"/><path d="M 100,40 L 70,10 L 60,40 Z" fill="#8822cc" stroke="#000" stroke-width="1.5"/><path d="M 100,40 L 70,70 L 60,40 Z" fill="#8822cc" stroke="#000" stroke-width="1.5"/><rect x="113" y="35" width="12" height="10" fill="#333"/><path class="flame" d="M 125,37 Q 135,40 125,43" fill="#ffaa00"/><path class="flame" d="M 128,38 Q 138,40 128,42" fill="#ff4400" opacity="0.7"/></svg></div>
  <div class="ship ship-4"><svg viewBox="0 0 150 85"><ellipse cx="75" cy="42" rx="16" ry="9" fill="#aa3300" opacity="0.8"/><path d="M 130,42 L 20,22 L 10,42 L 20,62 Z" fill="#ff8800" stroke="#000" stroke-width="2"/><path d="M 100,42 L 70,12 L 55,42 Z" fill="#cc5522" stroke="#000" stroke-width="1.5"/><path d="M 100,42 L 70,72 L 55,42 Z" fill="#cc5522" stroke="#000" stroke-width="1.5"/><rect x="120" y="36" width="14" height="12" fill="#333"/><path class="flame" d="M 135,39 Q 145,42 135,45" fill="#ffaa00"/><path class="flame" d="M 138,40 Q 148,42 138,44" fill="#ff4400" opacity="0.7"/></svg></div>
  <div class="ship ship-5"><svg viewBox="0 0 130 75"><ellipse cx="65" cy="37" rx="14" ry="8" fill="#0044aa" opacity="0.8"/><path d="M 15,37 L 110,19 L 120,37 L 110,55 Z" fill="#88aaff" stroke="#000" stroke-width="2"/><path d="M 40,37 L 65,8 L 75,37 Z" fill="#5577cc" stroke="#000" stroke-width="1.5"/><path d="M 40,37 L 65,66 L 75,37 Z" fill="#5577cc" stroke="#000" stroke-width="1.5"/><rect x="10" y="32" width="11" height="10" fill="#333"/><path class="flame" d="M 10,34 Q 1,37 10,40" fill="#ffaa00"/><path class="flame" d="M 7,35 Q -2,37 7,39" fill="#ff4400" opacity="0.7"/></svg></div>
  <svg class="asteroid" style="top:25%;left:22%;width:56px;height:56px;" viewBox="0 0 60 60"><path d="M 30,5 L 50,15 L 55,35 L 45,55 L 20,55 L 5,40 L 10,20 Z" fill="#666" stroke="#333" stroke-width="2"/><circle cx="25" cy="25" r="4" fill="#444"/><circle cx="40" cy="35" r="3" fill="#444"/><circle cx="20" cy="45" r="2" fill="#444"/></svg>

  <svg class="asteroid" style="bottom:18%;left:12%;width:64px;height:64px;animation-duration:22s;" viewBox="0 0 70 70"><path d="M 35,5 L 58,15 L 65,38 L 52,62 L 22,65 L 5,48 L 10,20 Z" fill="#666" stroke="#333" stroke-width="2"/><circle cx="28" cy="28" r="4" fill="#444"/><circle cx="48" cy="38" r="3" fill="#444"/></svg>
  <div class="laser" style="top:35%;left:28%;width:180px;transform:rotate(-15deg);animation-delay:0s;"></div>
  <div class="laser" style="top:50%;right:22%;width:160px;transform:rotate(165deg);animation-delay:.7s;"></div>
  <div class="laser" style="top:66%;left:38%;width:140px;transform:rotate(-25deg);animation-delay:1.3s;"></div>
  <div id="intro-sparks"></div>

// ===== HELPERS DE DIBUJO =====
const OUT = 0x050810;
function shade(c, f) {
  let r=(c>>16)&255, g=(c>>8)&255, b=c&255;
  r=Math.max(0,Math.min(255,(r*f)|0));
  g=Math.max(0,Math.min(255,(g*f)|0));
  b=Math.max(0,Math.min(255,(b*f)|0));
  return (r<<16)|(g<<8)|b;
}
function gPoly(g, pts, fill, stroke, sw) {
  if (fill!=null) { g.fillStyle(fill,1); g.fillPoints(pts,true); }
  if (stroke!=null) { g.lineStyle(sw||1,stroke,0.9); g.strokePoints(pts,true); }
}
function gPts(arr){ return arr.map(p=>({x:p[0],y:p[1]})); }

// ===== AUDIO =====
const AUDIO = (() => {
  let ctx=null, sfxGain=null, musicGain=null, enabled=true;
  let musicTimer=null, musicStep=0;
  try { enabled = localStorage.getItem('snova_audio') !== 'off'; } catch(e){}
  function init(){
    if (ctx) return ctx;
    try {
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      sfxGain = ctx.createGain(); sfxGain.gain.value=0.3; sfxGain.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value=0.15; musicGain.connect(ctx.destination);
      return ctx;
    } catch(e){ enabled=false; return null; }
  }
  function resume(){ if (ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type,vol,dest,slideTo){
    if (!enabled||!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
    g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(dest||sfxGain);
    o.start(t); o.stop(t+dur);
  }
  function noise(dur,vol,dest){
    if (!enabled||!ctx) return;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=buf;
    const g=ctx.createGain(); const t=ctx.currentTime;
    g.gain.setValueAtTime(vol||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(g); g.connect(dest||sfxGain); s.start();
  }
  function sfx(name){
    if (!enabled) return;
    init(); resume();
    switch(name){
      case 'shoot': tone(880,0.06,'square',0.12,null,440); break;
      case 'laser': tone(1200,0.1,'sawtooth',0.1,null,600); tone(800,0.08,'square',0.06); break;
      case 'plasma': tone(440,0.15,'sine',0.15); tone(550,0.12,'triangle',0.08); break;
      case 'lightning': noise(0.08,0.15); tone(2000,0.05,'sawtooth',0.1,null,500); break;
      case 'missile': tone(220,0.2,'sawtooth',0.12,null,110); tone(110,0.15,'square',0.08); break;
      case 'explosion': noise(0.3,0.25); tone(80,0.4,'sawtooth',0.2,null,30); tone(60,0.3,'square',0.15); break;
      case 'powerup': tone(523,0.08,'sine',0.15); setTimeout(()=>tone(659,0.08,'sine',0.15),60); setTimeout(()=>tone(784,0.12,'sine',0.15),120); break;
      case 'hit': noise(0.05,0.1); tone(200,0.08,'square',0.1); break;
      case 'bomb': noise(0.6,0.35); tone(40,0.8,'sawtooth',0.3,null,20); tone(30,0.6,'square',0.2); break;
      case 'levelup': [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sine',0.18),i*100)); break;
      case 'warning': tone(300,0.2,'square',0.16,null,150); setTimeout(()=>tone(300,0.2,'square',0.16,null,150),300); break;
      case 'click': tone(660,0.05,'square',0.1); break;
    }
  }
  function noiseAt(t,dur,vol,hpFreq){
    if (!enabled||!ctx) return;
    const buf=ctx.createBuffer(1,Math.max(1,(ctx.sampleRate*dur)|0),ctx.sampleRate);
    const d=buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    let tail=src;
    if (hpFreq){ const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hpFreq; src.connect(f); tail=f; }
    tail.connect(g); g.connect(musicGain); src.start(t);
  }
  // ===== MÚSICA CYBERPUNK / SYNTHWAVE =====
  function startMusic(){
    if (!enabled||musicTimer) return;
    init(); resume();
    const bpm=124, stepTime=60/bpm/4;          // 16avos
    const NOTE=m=>440*Math.pow(2,(m-69)/12);
    const bassRoot=[33,29,36,31];              // Am  F  C  G  (2 octabas abajo)
    const chords=[[57,60,64,69],[53,57,60,65],[60,64,67,72],[55,59,62,67]];
    const pads=[[45,57,64,69],[41,53,60,65],[48,60,64,67],[43,55,62,67]];
    musicStep=0;
    musicTimer=setInterval(()=>{
      if (!enabled||!ctx) return;
      const t=ctx.currentTime+0.01;
      const step=musicStep%64;
      const bar=Math.floor(step/16), s=step%16;
      // Bombo (4x4)
      if (s%4===0){
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.setValueAtTime(150,t);
        o.frequency.exponentialRampToValueAtTime(38,t+0.12);
        g.gain.setValueAtTime(0.9,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.2);
      }
      // Caja
      if (s===4||s===12){ noiseAt(t,0.14,0.22,1400); tone(190,0.08,'triangle',0.08,musicGain); }
      // Hi-hat
      if (s%2===1) noiseAt(t,0.04,0.09,7000);
      if (s===14) noiseAt(t,0.12,0.10,6000);
      // Bajo saw
      if (s%2===0){ const m=bassRoot[bar]+((s%8===6)?12:0); tone(NOTE(m),0.19,'sawtooth',0.15,musicGain); }
      // Arpegio
      { const ch=chords[bar]; tone(NOTE(ch[s%4]+12),0.09,'square',0.045,musicGain); }
      // Pad al inicio de compás
      if (s===0){ pads[bar].forEach(m=>tone(NOTE(m),stepTime*15,'sine',0.028,musicGain)); }
      musicStep++;
    }, stepTime*1000);
  }
  function stopMusic(){ if (musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
  function isPlaying(){ return !!musicTimer; }
  function isEnabled(){ return enabled; }
  function setEnabled(v){
    enabled=v;
    try { localStorage.setItem('snova_audio', v?'on':'off'); } catch(e){}
    if (!v) stopMusic();
    else { init(); resume(); startMusic(); }
  }
  return { init, resume, sfx, startMusic, stopMusic, isPlaying, isEnabled, setEnabled };
})();

const GOD_ID = 'sgborbolla';
let userId = localStorage.getItem('snova_uid') || '';
let godMode = false;
function isGodUser(){ return userId.trim().toLowerCase() === GOD_ID; }
function godChoice(){ try { return localStorage.getItem('snova_god')==='on'; } catch(e){ return false; } }
function refreshGodMode(){ godMode = isGodUser() && godChoice(); }
function refreshGodUI(){
  const row=document.getElementById('god-row');
  if (!row) return;
  if (isGodUser()){
    row.style.display='block';
    const t=document.getElementById('god-toggle');
    if (t) t.checked=godChoice();
  } else {
    row.style.display='none';
  }
}
function setGodChoice(v){
  try { localStorage.setItem('snova_god', v?'on':'off'); } catch(e){}
  refreshGodMode();
  if (v){ document.getElementById('user-id').disabled=true; }
}
function saveUserId(){
  const el=document.getElementById('user-id');
  const v=el.value.trim();
  if (!v) return;
  userId=v;
  localStorage.setItem('snova_uid',v);
  refreshGodMode();
  el.disabled=true;
  refreshGodUI();
  document.getElementById('status-msg').textContent = isGodUser() ? 'ID guardado: '+v : 'ID guardado: '+v;
}
function newUserId(){
  const el=document.getElementById('user-id');
  if (!el) return;
  el.value=''; el.disabled=false;
  userId=''; godMode=false;
  localStorage.removeItem('snova_uid');
  refreshGodUI();
  el.focus();
}
function delUserId(){
  if (!userId) return;
  localStorage.removeItem('snova_uid');
  userId=''; godMode=false;
  const el=document.getElementById('user-id');
  if (el){ el.value=''; el.disabled=false; }
  refreshGodUI();
  document.getElementById('status-msg').textContent='ID borrado';
}

const COOP = {
  peer: null,
  isHost: false,
  roomCode: '',
  hostConns: [],
  myConn: null,
  myId: null,
  worldSnapshot: null,
  remoteInputs: {},

  mode(){ return this.isHost ? 'host' : (this.myConn && this.myConn.open ? 'client' : 'solo'); },
  init(){
    const hostBtn=document.getElementById('host-btn');
    const joinBtn=document.getElementById('join-btn');
    hostBtn.onclick=()=>this.hostGame();
    joinBtn.onclick=()=>this.showJoin();
    // Selector de cantidad de jugadores (2 a 6)

    [2,3,4,5,6].forEach(n=>{

        this.maxPlayers=n;

        this.updatePlayerList();
      };

  hostGame(){
    if (this.peer) this.peer.destroy();
    this.roomCode='SN'+Math.random().toString(36).substr(2,5).toUpperCase();
    this.peer=new Peer('supernova-'+this.roomCode);
    this.isHost=true;
    this.myId='host';
    document.getElementById('room-code-display').textContent=t('roomIs')+this.roomCode;
    document.getElementById('coop-status').textContent=t('waitingPlayers');
    this.peer.on('open',id=>{
      document.getElementById('coop-status').textContent=t('roomReady');
    });
    this.peer.on('connection',conn=>{
      if (this.hostConns.length+1>=this.maxPlayers){ conn.close(); return; }
      this.hostConns.push(conn);
      conn.on('open',()=>{
        conn.send({t:'welcome',code:this.roomCode,id:conn.peer});
        document.getElementById('coop-status').textContent=t('roomReady');
        this.updatePlayerList();
        if (this.onClientJoin) this.onClientJoin(conn.peer);
      });
      conn.on('data',data=>{
        if (!data) return;
        if (data.t==='input') this.remoteInputs[conn.peer]=data;
      });
      conn.on('close',()=>{
        this.hostConns=this.hostConns.filter(c=>c!==conn);
        delete this.remoteInputs[conn.peer];
        this.updatePlayerList();
        if (this.onClientLeave) this.onClientLeave(conn.peer);
      });
    });
    this.peer.on('error',err=>{
      document.getElementById('coop-status').textContent=t('errorLbl')+err.type;
    });
  },
  showJoin(){
    const code=document.getElementById('join-code').value.trim().toUpperCase();
    if (!code){ document.getElementById('coop-status').textContent=t('enterCode'); return; }
    if (this.peer) this.peer.destroy();
    this.peer=new Peer();
    this.isHost=false;
    this.roomCode=code;
    document.getElementById('coop-status').textContent=t('connecting');
    this.peer.on('open',id=>{
      this.myId=id;
      this.myConn=this.peer.connect('supernova-'+code,{reliable:true});
      this.myConn.on('open',()=>{
        document.getElementById('coop-status').textContent=t('connected');
        document.getElementById('join-code').style.display='none';
      });
      this.myConn.on('data',data=>{
        if (!data) return;
        if (data.t==='world') this.worldSnapshot=data.s;
        else if (this.onNet) this.onNet(data);
      });
    });
    this.peer.on('error',err=>{
      document.getElementById('coop-status').textContent=t('errorLbl')+err.type;
    });
  },
  updatePlayerList(){
    const max=this.maxPlayers||6;
    document.getElementById('player-list').textContent=t('players')+': '+(this.hostConns.length+1)+'/'+max;
  },
  broadcastWorld(snap){
    if (!this.isHost) return;
    this.hostConns.forEach(c=>{
      if (c.open) try { c.send({t:'world',s:snap}); } catch(e){}
    });
  },
  broadcastEvent(obj){
    if (!this.isHost) return;
    this.hostConns.forEach(c=>{
      if (c.open) try { c.send({t:'evt',...obj}); } catch(e){}
    });
  },
  sendData(obj){
    if (this.isHost || !this.myConn || !this.myConn.open) return;
    try { this.myConn.send(obj); } catch(e){}
  },
  sendInput(inp){
    if (this.isHost||!this.myConn||!this.myConn.open) return;
    try { this.myConn.send({t:'input',...inp}); } catch(e){}
  },
  destroy(){
    if (this.peer){ this.peer.destroy(); this.peer=null; }
    this.hostConns=[];
    this.myConn=null;
    this.myId=null;
    this.worldSnapshot=null;
    this.remoteInputs={};
  }
};

class MenuScene extends Phaser.Scene {
  constructor(){ super('Menu'); }
  create(){
    const overlay=document.getElementById('menu-overlay');
    overlay.classList.remove('hidden');

    const el=id=>document.getElementById(id);

    // Naves cruzando el fondo (intro)
    const crossKeys=SHIPS.map(s=>s.key);
    for (let i=0;i<6;i++){
      const key=crossKeys[i%crossKeys.length];
      const dir=Math.random()<0.5?1:-1;
      const y=60+Math.random()*(H-120);
      const sc=0.45+Math.random()*0.5;
      const dur=6000+Math.random()*5000;
      const x0=dir>0?-70:W+70, x1=dir>0?W+70:-70;
      const sh=this.add.image(x0,y,'ship_'+key).setScale(sc).setAlpha(0.5).setDepth(0).setBlendMode(Phaser.BlendModes.ADD);
      sh.rotation=dir>0?Math.PI/2:-Math.PI/2;
      this.tweens.add({targets:sh,x:x1,duration:dur,repeat:-1,delay:Math.random()*4000,onRepeat:()=>{ sh.y=60+Math.random()*(H-120); }});
    }

    // User ID
    const uidEl=el('user-id');
    if (userId){ uidEl.value=userId; uidEl.disabled=true; }
    el('save-id').onclick=saveUserId;
    el('new-id').onclick=newUserId;
    el('del-id').onclick=delUserId;
    refreshGodUI();
    const gt=el('god-toggle');
    if (gt) gt.onchange=()=>{ setGodChoice(gt.checked); const s=el('status-msg'); if (s) s.textContent = gt.checked ? t('godOn') : t('godOff'); };

    let selectedDiff=1;
    let selectedShip=0;

    const applyTexts=()=>{
      el('txt-subtitle').textContent=t('subtitle');
      el('label-language').textContent=t('language');
      el('label-difficulty').textContent=t('difficulty');
      el('label-ship').textContent=t('ship');
      el('label-coop').textContent=t('coop');
      el('label-maxp').textContent=t('maxPlayers');
      el('label-userid').textContent=t('userId');
      el('label-level').textContent=t('chooseLevel');
      el('level-hint').textContent=t('unlockedHint');
      el('god-label').textContent=t('godMode');
      el('save-id').textContent=t('save');
      el('new-id').textContent=t('newId');
      el('del-id').textContent=t('delId');
      el('host-btn').textContent=t('createRoom');
      el('join-btn').textContent=t('join');
      el('join-code').placeholder=(LANG==='en')?'CODE':'CÓDIGO';
      const hint=el('controls-hint'); if (hint) hint.textContent=t('hint');
    };

    const buildLang=()=>{
      const grid=el('lang-grid'); grid.innerHTML='';
      [['es','ES 🇪🇸'],['en','EN 🇬🇧']].forEach(([code,label])=>{
        const b=document.createElement('button');
        b.className='diff-btn'+(LANG===code?' active':'');
        b.textContent=label;
        b.onclick=()=>{ if (LANG!==code){ setLang(code); rebuild(); } };
        grid.appendChild(b);
      });
    };

    const buildDiff=()=>{
      const grid=el('diff-grid'); grid.innerHTML='';
      DIFFS.forEach((d,i)=>{
        const b=document.createElement('button');
        b.className='diff-btn'+(i===selectedDiff?' active':'');
        b.style.animationDelay=(i*55)+'ms';
        b.textContent=d.name;
        b.onclick=()=>{ grid.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedDiff=i; };
        grid.appendChild(b);
      });
    };

    const buildShips=()=>{
      const grid=el('ship-select-grid'); grid.innerHTML='';
      SHIPS.forEach((s,i)=>{
        const b=document.createElement('button');
        b.className='ship-btn'+(i===selectedShip?' active':'');
        b.style.animationDelay=(i*70)+'ms';
        const canvas=document.createElement('canvas');
        canvas.width=44; canvas.height=62;
        try { canvas.getContext('2d').drawImage(this.textures.get('ship_'+s.key).getSourceImage(),0,0); } catch(e){}
        b.appendChild(canvas);
        const label=document.createElement('div');
        label.style.fontSize='9px'; label.textContent=s.name;
        b.appendChild(label);
        b.onclick=()=>{
          grid.querySelectorAll('.ship-btn').forEach(x=>x.classList.remove('active'));
          b.classList.add('active'); selectedShip=i;
          b.classList.remove('picked'); void b.offsetWidth; b.classList.add('picked');
        };
        grid.appendChild(b);
      });
    };

    const refreshResume=()=>{
      const saved=getSavedProgress();
      const cbtn=el('continue-btn');
      const sbtn=el('start-btn');
      const info=el('resume-info');
      const godInfo = isGodUser() ? '' : '';
      if (saved){
        cbtn.style.display='inline-block';
        cbtn.textContent=t('contBtn')+' · '+t('level')+' '+(saved.levelIdx+1);
        sbtn.textContent='▶ '+t('newGame');
        info.textContent=tf('resumeInfo',{n:saved.levelIdx+1});
        cbtn.onclick=()=>{
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{
            diffIdx:(typeof saved.diffIdx==='number')?saved.diffIdx:selectedDiff,
            shipIdx:(typeof saved.shipIdx==='number')?saved.shipIdx:selectedShip,
            continueData:{ nextLevel:saved.levelIdx, score:saved.score||0, lives:saved.lives||3, bombs:saved.bombs||2,
              shotsFired:saved.shotsFired||0, shotsHit:saved.shotsHit||0, weaponKey:saved.weaponKey||'normal', powerLevel:saved.powerLevel||0 }
          });
        };
        sbtn.onclick=()=>{
          clearProgress();
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{ diffIdx:selectedDiff, shipIdx:selectedShip });
        };
      } else {
        cbtn.style.display='none';
        sbtn.textContent=t('start');
        info.textContent='';
        sbtn.onclick=()=>{
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{ diffIdx:selectedDiff, shipIdx:selectedShip });
        };
      }
    };

    const startGame=(opts)=>{
      AUDIO.init(); AUDIO.resume();
      overlay.classList.add('hidden');
      this.scene.start('Game', opts);
    };

    const buildLevels=()=>{
      const section=el('level-section');
      const grid=el('level-grid');
      const unlocked=getUnlocked();
      if (unlocked<=0){ section.style.display='none'; return; }
      section.style.display='block';
      grid.innerHTML='';
      const top=Math.min(19, unlocked);
      for (let i=0;i<20;i++){
        const b=document.createElement('button');
        const locked=i>top;
        b.className='diff-btn'+(locked?'':'');
        b.textContent=locked?'🔒':String(i+1);
        b.style.animationDelay=(i*25)+'ms';
        b.style.minWidth='34px';
        if (locked){ b.disabled=true; b.style.opacity='0.35'; b.style.cursor='not-allowed'; }
        else {
          b.onclick=()=>{
            startGame({ diffIdx:selectedDiff, shipIdx:selectedShip,
              continueData:{ nextLevel:i, score:0, lives:3, bombs:2, shotsFired:0, shotsHit:0, weaponKey:'normal', powerLevel:0 } });
          };
        }
        grid.appendChild(b);
      }
    };

    const rebuild=()=>{ applyTexts(); buildLang(); buildDiff(); buildShips(); buildLevels(); refreshResume(); };

    rebuild();

    AUDIO.init(); AUDIO.startMusic();

    // Botón de silencio (audio + SFX)
    const mb=el('mute-btn');
    const paintMute=()=>{ const on=AUDIO.isEnabled(); mb.textContent=on?'🔊':'🔇'; mb.classList.toggle('muted',!on); };
    mb.onclick=()=>{ AUDIO.setEnabled(!AUDIO.isEnabled()); paintMute(); };
    paintMute();

    COOP.init();
  }
}

// ===== JUEGO =====
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }
  init(data){
    this.diffIdx=data.diffIdx||1;
    this.shipIdx=data.shipIdx||0;
    this.diff=DIFFS[this.diffIdx];
    this.shipKey=SHIPS[this.shipIdx].key;
    this.shipConfig=SHIPS[this.shipIdx];
    const c=data.continueData;
    if (c){
      this.levelIdx=c.nextLevel||0;
      this.score=c.score||0;
      this.lives=c.lives||3;
      this.bombs=c.bombs||2;
      this.shotsFired=c.shotsFired||0;
      this.shotsHit=c.shotsHit||0;
      this.weaponKey=c.weaponKey||'normal';
      this.powerLevel=c.powerLevel||0;
    } else {
      this.levelIdx=0;
      this.score=0;
      this.lives=3;
      this.bombs=2;
      this.shotsFired=0;
      this.shotsHit=0;
      this.weaponKey='normal';
      this.powerLevel=0;
    }
    this.levelKills=0;
    this.totalEnemies=0;
    this.paused=false;
    this.gameOver=false;
    this.fireRateBonus=0;
    this.netMode=COOP.mode();
    this.isClient=(this.netMode==='client');
    this.isNetHost=(this.netMode==='host');
    this.remotePlayers={};
    this.netTick=0;
  }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    this.loadLevel(this.levelIdx);
    AUDIO.startMusic();

    // Controles táctiles con arrastre relativo (disparo automático)
    this.dragging=false;
    this.lastPointer={x:0,y:0};
    this.input.on('pointerdown',p=>{
      if (p.y<80) return; // evitar HUD
      if (this.entering||this.exiting) return;
      this.dragging=true;
      this.lastPointer.x=p.x;
      this.lastPointer.y=p.y;
    });
    this.input.on('pointermove',p=>{
      if (!this.dragging||!this.ship||this.entering||this.exiting) return;
      const dx=p.x-this.lastPointer.x;
      const dy=p.y-this.lastPointer.y;
      this.ship.x=Phaser.Math.Clamp(this.ship.x+dx,20,W-20);
      this.ship.y=Phaser.Math.Clamp(this.ship.y+dy,60,H-40);
      this.lastPointer.x=p.x;
      this.lastPointer.y=p.y;
    });
    this.input.on('pointerup',()=>{ this.dragging=false; });

    // Teclado
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE,B,P');

    this.input.keyboard.on('keydown-P',()=>{
      this.paused=!this.paused;
      if (this.paused){ this.scene.pause(); AUDIO.stopMusic(); }
      else { this.scene.resume(); AUDIO.startMusic(); }
    });

    // Co-op: eventos de red
    COOP.onNet=null;
    COOP.onClientJoin=null;
    COOP.onClientLeave=null;
    if (this.isClient){
      COOP.onNet=(d)=>{
        if (!d || d.t!=='evt') return;
        if (d.e==='levelcomplete'){ this.scene.start('LevelComplete',{client:true, levelIdx:this.levelIdx, score:this.score, lives:this.lives, bombs:this.bombs, shotsFired:this.shotsFired, shotsHit:this.shotsHit, levelKills:this.levelKills, totalEnemies:this.totalEnemies, weaponKey:this.weaponKey, powerLevel:this.powerLevel, diffIdx:this.diffIdx, shipIdx:this.shipIdx}); }
        else if (d.e==='level'){ this.scene.start('Game',{ diffIdx:this.diffIdx, shipIdx:this.shipIdx, continueData:{ nextLevel:d.lvl||0, score:this.score, lives:this.lives, bombs:this.bombs, shotsFired:this.shotsFired, shotsHit:this.shotsHit, weaponKey:'normal', powerLevel:0 } }); }
        else if (d.e==='victory'){ this.scene.start('GameOver',{victory:true, score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, shipIdx:this.shipIdx, diffIdx:this.diffIdx}); }
        else if (d.e==='defeat'){ this.scene.start('GameOver',{defeat:true, score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, levelIdx:this.levelIdx, diffIdx:this.diffIdx, shipIdx:this.shipIdx, scoreAtLevelStart:this.score}); }
      };
    }
  }

  loadLevel(idx){
    this.levelIdx=idx;
    this.scoreAtLevelStart=this.score;
    const L=LEVELS[Math.min(idx,LEVELS.length-1)];
    this.levelConfig=L;
    this.cameras.main.setBackgroundColor(L.bg);
    this.levelKills=0;
    this.totalEnemies=L.count;
    this.spawnedEnemies=0;
    this.levelDone=false;
    this.bossSpawned=false;
    this.bossWarned=false;
    this.entering=true;
    this.exiting=false;

    // Desbloquea este nivel para poder rejugarlo
    setUnlocked(idx);

    // Guarda el progreso para continuar aquí si cierran el juego
    saveProgress({
      levelIdx:idx, score:this.score, lives:this.lives, bombs:this.bombs,
      weaponKey:this.weaponKey, powerLevel:this.powerLevel,
      shotsFired:this.shotsFired, shotsHit:this.shotsHit,
      diffIdx:this.diffIdx, shipIdx:this.shipIdx, ts:Date.now()
    });

    if (this.enemies) this.enemies.clear(true,true);
    if (this.ebullets) this.ebullets.clear(true,true);
    if (this.items) this.items.clear(true,true);
    if (this.shipBullets) this.shipBullets.clear(true,true);
    if (this.flames) this.flames.clear(true,true);
    if (this.engineFlame) { this.engineFlame.destroy(); this.engineFlame=null; }
    if (this.exhaust) { this.exhaust.destroy(); this.exhaust=null; }
    if (this.decorObjs) this.decorObjs.forEach(o=>o.destroy());

    this.enemies=this.add.group();
    this.ebullets=this.add.group();
    this.items=this.add.group();
    this.shipBullets=this.add.group();
    this.flames=this.add.group();
    this.decorObjs=[];

    // Co-op: limpiar naves remotas y estructuras de red
    if (this.remotePlayers){ for (const id in this.remotePlayers){ const rp=this.remotePlayers[id]; if (rp.ship) rp.ship.destroy(); if (rp.flame) rp.flame.destroy(); if (rp.label) rp.label.destroy(); } }
    this.remotePlayers={};
    this.netEnemies=[]; this.netEBullets=[]; this.netPBullets=[]; this.netItems=[]; this.netPlayers=[];
    if (this.isNetHost && idx>0) COOP.broadcastEvent({e:'level', lvl:idx});

    // Estrellas
    this.stars=[];
    for (let i=0;i<80;i++){
      const s=this.add.image(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),'star')
        .setAlpha(Phaser.Math.FloatBetween(0.3,1));
      s.setTint(L.sc);
      s.spd=Phaser.Math.Between(30,120);
      this.stars.push(s);
    }

    this.buildDecor(L.decor,L.sc);

    if (this.ship) this.ship.destroy();
    this.ship=this.add.image(W/2,H+95,'ship_'+this.shipKey).setDepth(10).setScale(1.15).setAlpha(0);
    // Entrada de la nave del jugador (vuela desde abajo)
    this.tweens.add({targets:this.ship, y:H-90, alpha:1, duration:750, ease:'Cubic.Out',
      onComplete:()=>{ this.entering=false; }});
    // Fuego de los motores (llama + partículas)
    this.engineFlame=this.add.image(this.ship.x,this.ship.y+30,'flame').setOrigin(0.5,0).setDepth(9).setBlendMode(Phaser.BlendModes.ADD).setScale(1.3,1.7);
    this.exhaust=this.add.particles(0,0,'spark',{
      follow:this.ship, followOffset:{x:0,y:30},
      speedY:{min:90,max:190}, speedX:{min:-30,max:30},
      scale:{start:1.3,end:0}, alpha:{start:0.9,end:0},
      lifespan:340, frequency:28, quantity:1,
      tint:[0xffee00,0xff9900,0xff4400], blendMode:'ADD'
    }).setDepth(9);
    this.shipSpeed=this.shipConfig.speed;
    this.baseFireRate=this.shipConfig.fireRate;

    // Timers de power-ups
    this.shieldActive=false;
    this.invincible=false;
    this.invincibleTimer=0;
    this.speedBoost=false;
    this.speedTimer=0;
    this.pierceShot=false;
    this.pierceTimer=0;
    this.scoreMultiplier=1;
    this.scoreMulTimer=0;
    this.magnetActive=false;
    this.magnetTimer=0;
    this.freezeActive=false;
    this.freezeTimer=0;
    this.droneActive=false;
    this.drone=null;
    this.reflectorActive=false;
    this.reflectorTimer=0;
    this.fireRateTimer=0;

    this.spawnTimer=0;

    // HUD
    if (this.hudText) this.hudText.destroy();
    if (this.levelText) this.levelText.destroy();
    if (this.progressText) this.progressText.destroy();
    if (this.weaponText) this.weaponText.destroy();

    this.levelText=this.add.text(W/2,8,t('level')+' '+(this.levelIdx+1)+'/20 · '+L.name,{fontSize:'11px',fontFamily:'monospace',color:'#00d4ff'}).setOrigin(0.5,0).setDepth(50);
    this.progressText=this.add.text(W/2,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#ffaa00'}).setOrigin(0.5,0).setDepth(50);
    this.weaponText=this.add.text(10,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#88bbff'}).setDepth(50);
    this.hudText=this.add.text(8,H-40,'',{fontSize:'11px',fontFamily:'monospace',color:'#88ccdd',stroke:'#000',strokeThickness:2}).setDepth(100).setScrollFactor(0);

    this.updateWeaponUI();
    this.updateProgressUI();
  }

  updateWeaponUI(){
    const w=WEAPONS[this.weaponKey]||WEAPONS.normal;
    if (this.weaponText) this.weaponText.setText(w.name+' · '+t('pot')+' '+(this.powerLevel+1));
  }
  updateProgressUI(){
    if (!this.progressText) return;
    const rem=Math.max(0,this.totalEnemies-this.levelKills);
    let tx=t('enemies')+' '+rem+'/'+this.totalEnemies;
    if (this.levelConfig.boss) tx+=' · '+(this.bossSpawned?t('bossNow'):t('bossLater'));
    this.progressText.setText(tx);
  }

  buildDecor(type,sc){
    const add=(key,x,y,scale,alpha,tint,vy,vx)=>{
      const obj=this.add.image(x,y,key).setScale(scale).setAlpha(alpha).setTint(tint||0xffffff).setDepth(0);
      obj.dvy=vy!==undefined?vy:Phaser.Math.Between(10,30);
      obj.dvx=vx||0;
      this.decorObjs.push(obj);
      return obj;
    };
    const rnd=(a,b)=>Phaser.Math.Between(a,b);
    switch(type){
      case 'nebula':
        for (let i=0;i<4;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.5,2.5),0.12,sc,rnd(5,12),0);
        break;
      case 'asteroids':
        for (let i=0;i<6;i++) add('asteroid',rnd(20,W-20),rnd(-50,H),Phaser.Math.FloatBetween(0.4,1.2),0.8,sc,rnd(15,40),rnd(-5,5));
        break;
      case 'toxic':
        add('planet',W*0.25,rnd(80,160),1.5,1,0x55dd66,3,0);
        for (let i=0;i<5;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1,1.8),0.15,0x44ff88,rnd(6,14),0);
        break;
      case 'wreck':
        for (let i=0;i<7;i++){
          const o=add('wreck',rnd(0,W),rnd(0,H),rnd(0.6,1.2),0.85,0x9a9a9a,rnd(12,28),rnd(-6,6));
          o.rotation=rnd(0,63)/10;
        }
        break;
      case 'sun': {
        const s=add('planet',W/2,-40,2.8,1,0xffcc33,0,0);
        s.setDepth(-1);
        const glow=this.add.circle(W/2,-30,180,0xffaa00,0.10).setDepth(-2);
        this.decorObjs.push(glow); glow.dvy=0;
        for (let i=0;i<6;i++) add('spark',rnd(0,W),rnd(0,H),rnd(0.5,1),0.5,0xffdd44,rnd(30,70),rnd(-10,10));
        break;
      }
      case 'trench':
        for (let i=0;i<5;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.6,2.6),0.12,0x2244aa,rnd(5,12),0);
        for (let i=0;i<10;i++) add('spark',rnd(0,W),rnd(0,H),0.35,0.5,0x4466cc,rnd(15,35),0);
        break;
      case 'galaxies':
        for (let i=0;i<4;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.6,2.6),0.10,[0x8f7fff,0xa06fff,0xd090ff,0x90c0ff][i%4],rnd(4,10),0);
        break;
      case 'alert': {
        const v=this.add.rectangle(W/2,H/2,W,H,0xff0000,0.06).setDepth(0);
        this.decorObjs.push(v); v.dvy=0;
        this.tweens.add({targets:v,alpha:0.14,duration:600,yoyo:true,repeat:-1});
        break;
      }
      case 'ringed': {
        const p=add('planet',W*0.7,rnd(90,170),1.5,1,sc,2,0);
        const ring=this.add.image(p.x,p.y+6,'ring').setScale(1.5).setAlpha(0.7).setDepth(1);
        ring.rotation=0.5;
        this.decorObjs.push(ring); ring.dvy=2; ring.dvx=0;
        break;
      }
      case 'collision':
        add('cloud',W*0.5,H*0.3,2.8,0.13,0xdd88ff,6,0);
        add('cloud',W*0.5,H*0.6,2.6,0.11,0x88bbff,5,0);
        break;
      case 'rift':
        for (let i=0;i<3;i++) add('rift',rnd(0,W),rnd(-100,H),rnd(0.8,1.5),0.7,0xffee00,rnd(20,40),rnd(-10,10));
        break;
      case 'fortress':
        for (let i=0;i<4;i++) add('fortress',rnd(0,W),rnd(-100,H),rnd(0.8,1.4),0.6,0xff88ff,rnd(10,25),0);
        break;
      case 'supernova': {
        const sn=add('supernova',W/2,H/2,3,0.8,0xffee88,0,0);
        this.tweens.add({targets:sn,scale:3.5,alpha:0.5,duration:2000,yoyo:true,repeat:-1});
        break;
      }
    }
  }

  spawnEnemy(){
    const L=this.levelConfig;
    const type=L.enemies[Phaser.Math.Between(0,L.enemies.length-1)];
    const x=Phaser.Math.Between(40,W-40);
    const e=this.add.image(x,-40,'enemy_'+type).setDepth(5);
    e.type=type;
    const hpTable={drone:2,hunter:4,elite:8};
    e.hp=(hpTable[type]||2)*this.diff.hpMul;
    e.maxHp=e.hp;
    e.speed=({drone:80,hunter:100,elite:60}[type]||80)*this.diff.spdMul;
    e.setData('shootTimer',Phaser.Math.Between(500,2000));
    e.setData('phase',Math.random()*Math.PI*2);
    e.setData('dir',Math.random()<0.5?1:-1);
    const fl=this.add.image(x,-40-16,'flame').setDepth(4).setBlendMode(Phaser.BlendModes.ADD).setScale(0.7).setFlipY(true);
    e.flameRef=fl; this.flames.add(fl);
    // Entrada animada del enemigo
    e.setScale(0.25).setAlpha(0.25);
    this.tweens.add({targets:e, scale:1, alpha:1, duration:330, ease:'Back.Out'});
    this.enemies.add(e);
    this.spawnedEnemies++;
  }

  spawnBoss(){
    const type=this.levelConfig.bossType||'boss';
    const e=this.add.image(W/2,-160,'enemy_'+type).setDepth(5);
    e.type=type;
    e.hp=(type==='boss'?200:120)*this.diff.hpMul;
    e.maxHp=e.hp;
    e.speed=30*this.diff.spdMul;
    e.setData('shootTimer',0);
    e.setData('dir',1);
    e.setData('phase',0);
    e.entering=true;
    e.setScale(0.6).setAlpha(0.4);
    const fl=this.add.image(W/2,-160-28,'flame').setDepth(4).setBlendMode(Phaser.BlendModes.ADD).setScale(1.4,1.8).setFlipY(true);
    e.flameRef=fl; this.flames.add(fl);
    // Entrada del jefe (vuela desde arriba)
    this.tweens.add({targets:e, y:80, scale:1, alpha:1, duration:1000, ease:'Cubic.Out',
      onComplete:()=>{ e.entering=false; }});
    this.enemies.add(e);
    this.bossSpawned=true;
  }

  showBossWarning(onDone){
    const c=this.add.container(W/2,H/2).setDepth(80);
    const bar=this.add.rectangle(0,0,W,70,0xff0000,0.18);
    const t1=this.add.text(0,-14,'⚠ ¡JEFE A LA VISTA! ⚠',{fontSize:'20px',fontFamily:'monospace',color:'#ff3333',stroke:'#000',strokeThickness:3}).setOrigin(0.5);
    const t2=this.add.text(0,14,'PREPÁRATE PARA EL COMBATE',{fontSize:'11px',fontFamily:'monospace',color:'#ffcccc'}).setOrigin(0.5);
    c.add([bar,t1,t2]);
    AUDIO.sfx('warning');
    vib([80,60,80]);
    this.tweens.add({targets:c, alpha:0.25, duration:180, yoyo:true, repeat:6,
      onComplete:()=>{ c.destroy(); if (onDone) onDone(); }});
  }

  fireBullet(){
    const now=this.time.now;
    const rate=Math.max(60,this.baseFireRate-this.fireRateBonus);
    if (now-this.lastFire<rate) return;
    this.lastFire=now;
    this.shotsFired++;

    const w=WEAPONS[this.weaponKey]||WEAPONS.normal;
    const spd=500;
    const addBullet=(bx,by,angle,speed)=>{
      const b=this.add.image(bx,by,w.tex).setDepth(8);
      b.speed=-speed;
      b.dmg=w.damage;
      b.angle=angle||0;
      b.weapon=this.weaponKey;
      b.pierce=this.pierceShot;
      b.setTint(w.color);
      this.shipBullets.add(b);
    };
    w.fire(this.ship.x,this.ship.y,spd,this.powerLevel,addBullet);

    const sfxName={normal:'shoot',laser:'laser',plasma:'plasma',lightning:'lightning',missile:'missile',spread:'shoot'}[this.weaponKey]||'shoot';
    AUDIO.sfx(sfxName);
  }

  fireBomb(){
    if (this.bombs<=0) return;
    this.bombs--;
    AUDIO.sfx('bomb');
    vib(200);
    this.ebullets.children.iterate(b=>{ if (b) b.destroy(); });
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      this.add.circle(e.x,e.y,20,0xffaa00,0.7).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
      e.hp-=15;
      if (e.hp<=0) this.killEnemy(e);
    });
    this.cameras.main.shake(300,0.015);
  }

  fireSuperBomb(){
    AUDIO.sfx('bomb');
    vib(400);
    this.ebullets.children.iterate(b=>{ if (b) b.destroy(); });
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      this.add.circle(e.x,e.y,30,0xff4400,0.8).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
      e.hp-=60;
      if (e.hp<=0) this.killEnemy(e);
    });
    this.cameras.main.shake(500,0.025);
  }

  collectItem(item){
    AUDIO.sfx('powerup');
    vib(50);
    const key=item.itemType;
    if (key==='item_power'){ this.powerLevel=Math.min(this.powerLevel+1,2); }
    else if (key==='item_firerate'){ this.fireRateBonus+=30; this.fireRateTimer=15000; }
    else if (key==='item_w_normal'){ this.weaponKey='normal'; }
    else if (key==='item_w_spread'){ this.weaponKey='spread'; }
    else if (key==='item_w_laser'){ this.weaponKey='laser'; }
    else if (key==='item_w_missile'){ this.weaponKey='missile'; }
    else if (key==='item_w_plasma'){ this.weaponKey='plasma'; }
    else if (key==='item_w_lightning'){ this.weaponKey='lightning'; }
    else if (key==='item_shield'){ this.shieldActive=true; }
    else if (key==='item_life'){ this.lives=Math.min(this.lives+1,9); }
    else if (key==='item_bomb'){ this.bombs=Math.min(this.bombs+1,9); }
    else if (key==='item_superbomb'){ this.fireSuperBomb(); }
    else if (key==='item_freeze'){ this.freezeActive=true; this.freezeTimer=8000; }
    else if (key==='item_magnet'){ this.magnetActive=true; this.magnetTimer=10000; }
    else if (key==='item_triple'){ this.weaponKey='spread'; this.powerLevel=Math.max(this.powerLevel,1); }
    else if (key==='item_invinc'){ this.invincible=true; this.invincibleTimer=6000; }
    else if (key==='item_speed'){ this.speedBoost=true; this.speedTimer=8000; }
    else if (key==='item_pierce'){ this.pierceShot=true; this.pierceTimer=10000; }
    else if (key==='item_x2'){ this.scoreMultiplier=2; this.scoreMulTimer=15000; }
    else if (key==='item_drone'){
      this.droneActive=true;
      if (!this.drone) this.drone=this.add.image(this.ship.x-30,this.ship.y,'ally').setDepth(9);
    }
    else if (key==='item_reflect'){ this.reflectorActive=true; this.reflectorTimer=10000; }
    this.updateWeaponUI();
    item.destroy();
  }

  hitPlayer(){
    if (godMode) return;
    if (this.invincible||this.shieldActive) return;
    this.lives--;
    AUDIO.sfx('explosion');
    vib(300);
    this.cameras.main.shake(200,0.015);
    if (this.lives<=0){
      this.gameOver=true;
      AUDIO.stopMusic();
      if (this.isNetHost) COOP.broadcastEvent({e:'defeat'});
      this.time.delayedCall(800,()=>this.scene.start('GameOver',{
        score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, lives:0,
        defeat:true, levelIdx:this.levelIdx, scoreAtLevelStart:this.scoreAtLevelStart||0,
        diffIdx:this.diffIdx, shipIdx:this.shipIdx
      }));
    } else {
      this.invincible=true;
      this.invincibleTimer=2000;
    }
  }

  checkLevelProgress(){
    if (this.levelDone) return;
    if (this.spawnedEnemies<this.totalEnemies) return;
    if (this.levelKills<this.totalEnemies) return;
    if (this.levelConfig.boss && !this.bossSpawned){
      if (!this.bossWarned){
        this.bossWarned=true;
        this.showBossWarning(()=>this.spawnBoss());
      }
      return;
    }
    if (this.enemies.countActive()>0) return;

    this.levelDone=true;
    this.exiting=true;
    this.dragging=false;
    AUDIO.sfx('levelup');
    if (this.isNetHost) COOP.broadcastEvent({e:'levelcomplete'});
    // Salida de la nave del jugador (se aleja volando hacia arriba)
    saveProgress({
      levelIdx:Math.min(this.levelIdx+1,LEVELS.length-1), score:this.score, lives:this.lives, bombs:this.bombs,
      weaponKey:this.weaponKey, powerLevel:this.powerLevel,
      shotsFired:this.shotsFired, shotsHit:this.shotsHit,
      diffIdx:this.diffIdx, shipIdx:this.shipIdx, ts:Date.now()
    });
    if (this.engineFlame) this.engineFlame.visible=false;
    if (this.exhaust) this.exhaust.visible=false;
    this.tweens.add({targets:this.ship, y:-140, duration:850, ease:'Cubic.In', onComplete:()=>{
      this.scene.start('LevelComplete',{
        levelIdx:this.levelIdx,
        score:this.score,
        lives:this.lives,
        bombs:this.bombs,
        shotsFired:this.shotsFired,
        shotsHit:this.shotsHit,
        levelKills:this.levelKills,
        totalEnemies:this.totalEnemies,
        weaponKey:this.weaponKey,
        powerLevel:this.powerLevel,
        diffIdx:this.diffIdx,
        shipIdx:this.shipIdx
      });
    }});
  }

  update(time,delta){
    if (this.paused||this.gameOver) return;
    if (!this.ship) return;

    // Movimiento teclado (bloqueado durante entrada/salida de la nave)
    if (!this.entering && !this.exiting){
      const spd=(this.speedBoost?this.shipSpeed*1.5:this.shipSpeed)*(delta/1000);
      let vx=0, vy=0;
      if (this.cursors.left.isDown||this.keys.A.isDown) vx=-1;
      else if (this.cursors.right.isDown||this.keys.D.isDown) vx=1;
      if (this.cursors.up.isDown||this.keys.W.isDown) vy=-1;
      else if (this.cursors.down.isDown||this.keys.S.isDown) vy=1;
      this.ship.x=Phaser.Math.Clamp(this.ship.x+vx*spd,20,W-20);
      this.ship.y=Phaser.Math.Clamp(this.ship.y+vy*spd,60,H-40);
    }

    // Fuego del motor del jugador (sigue a la nave y parpadea)
    if (this.engineFlame){
      this.engineFlame.x=this.ship.x;
      this.engineFlame.y=this.ship.y+30;
      const boost=this.speedBoost?1.25:1;
      this.engineFlame.setScale(1.2*boost+Math.sin(time/40)*0.25, 1.6*boost+Math.sin(time/30)*0.4);
      this.engineFlame.visible=(!this.paused && !this.gameOver && !this.exiting);
    }
    if (this.exhaust) this.exhaust.visible=(!this.paused && !this.gameOver && !this.exiting);

    // ===== CLIENTE: control local + enviar entrada + render del mundo del host =====
    if (this.isClient){
      const firing=(this.dragging || this.cursors.space.isDown || this.keys.SPACE.isDown)?1:0;
      this.netTick+=delta;
      if (this.netTick>=50){
        this.netTick=0;
        COOP.sendInput({x:Math.round(this.ship.x), y:Math.round(this.ship.y), key:this.shipKey, name:this.myName(), firing:firing});
      }
      if (!this.entering && !this.exiting && Phaser.Input.Keyboard.JustDown(this.keys.B)) COOP.sendInput({bomb:1, x:Math.round(this.ship.x), y:Math.round(this.ship.y)});
      this.renderNet(time);
      this.updateHUD();
      this.updateProgressUI();
      return;
    }

    // Disparo automático al arrastrar o con SPACE
    if (!this.entering && !this.exiting && (this.dragging || this.cursors.space.isDown || this.keys.SPACE.isDown)) this.fireBullet();
    if (!this.entering && !this.exiting && Phaser.Input.Keyboard.JustDown(this.keys.B)) this.fireBomb();

    // Timers
    if (this.invincibleTimer>0){ this.invincibleTimer-=delta; if (this.invincibleTimer<=0){ this.invincible=false; this.ship.setAlpha(1); } else this.ship.setAlpha(0.5+Math.sin(time/50)*0.3); }
    if (this.speedTimer>0){ this.speedTimer-=delta; if (this.speedTimer<=0) this.speedBoost=false; }
    if (this.pierceTimer>0){ this.pierceTimer-=delta; if (this.pierceTimer<=0) this.pierceShot=false; }
    if (this.scoreMulTimer>0){ this.scoreMulTimer-=delta; if (this.scoreMulTimer<=0) this.scoreMultiplier=1; }
    if (this.magnetTimer>0){ this.magnetTimer-=delta; if (this.magnetTimer<=0) this.magnetActive=false; }
    if (this.freezeTimer>0){ this.freezeTimer-=delta; if (this.freezeTimer<=0) this.freezeActive=false; }
    if (this.reflectorTimer>0){ this.reflectorTimer-=delta; if (this.reflectorTimer<=0) this.reflectorActive=false; }
    if (this.fireRateTimer>0){ this.fireRateTimer-=delta; if (this.fireRateTimer<=0) this.fireRateBonus=0; }

    // Estrellas
    this.stars.forEach(s=>{
      s.y+=s.spd*(delta/1000);
      if (s.y>H){ s.y=-5; s.x=Phaser.Math.Between(0,W); }
    });

    // Decor
    this.decorObjs.forEach(o=>{
      o.y+=(o.dvy||0)*(delta/1000);
      o.x+=(o.dvx||0)*(delta/1000);
      if (o.y>H+100) o.y=-100;
      if (o.x<-100) o.x=W+100;
      if (o.x>W+100) o.x=-100;
    });

    // Spawn
    if (!this.bossSpawned && this.spawnedEnemies<this.totalEnemies){
      this.spawnTimer-=delta;
      if (this.spawnTimer<=0){
        this.spawnEnemy();
        this.spawnTimer=this.levelConfig.spawn;
      }
    }

    // Enemigos
    this.enemies.getChildren().forEach(e=>{
      if (!e.active) return;
      if (!this.freezeActive && !e.entering) e.y+=e.speed*delta/1000;
      if (e.type==='drone') e.x+=Math.sin(time/300+e.getData('phase'))*1.5;
      if (e.type==='mothership'||e.type==='boss'){
        if (e.entering){ /* volando hacia su posición */ }
        else if (e.y<80) e.y+=e.speed*delta/1000;
        else {
          const dir=e.getData('dir');
          e.x+=dir*60*delta/1000;
          if (e.x>W-40) e.setData('dir',-1);
          if (e.x<40) e.setData('dir',1);
        }
        let st=e.getData('shootTimer')+delta;
        const sd=(e.type==='boss'?700:1600)*this.diff.efire;
        if (st>=sd){
          this.enemyFire(e);
          st=0;
        }
        e.setData('shootTimer',st);
      } else {
        let st=e.getData('shootTimer')+delta;
        const sd=(1500+Math.random()*1500)*this.diff.efire;
        if (st>=sd && e.y>0 && e.y<H-100){
          this.enemyFire(e);
          st=0;
        }
        e.setData('shootTimer',st);
      }
      if (e.flameRef){
        const off=(e.type==='boss')?36:(e.type==='mothership')?28:18;
        e.flameRef.x=e.x;
        e.flameRef.y=e.y-off;
        e.flameRef.setScale(0.6+Math.sin(time/40+e.getData('phase'))*0.15);
      }
      if (e.y>H+60){ if (e.flameRef) e.flameRef.destroy(); e.destroy(); this.levelKills++; }
    });

    // Balas jugador
    this.shipBullets.getChildren().forEach(b=>{
      if (!b.active) return;
      b.y+=b.speed*(delta/1000);
      if (b.angle) b.x+=Math.sin(b.angle*Math.PI/180)*Math.abs(b.speed)*(delta/1000);
      if (b.y<-30||b.y>H+30) b.destroy();
    });

    // Balas enemigas
    this.ebullets.getChildren().forEach(b=>{
      if (!b.active) return;
      b.y+=b.speed*(delta/1000);
      if (b.vx) b.x+=b.vx*(delta/1000);
      if (b.y>H+30||b.y<-30||b.x<-30||b.x>W+30) b.destroy();
    });

    // Items
    this.items.getChildren().forEach(it=>{
      if (!it.active) return;
      it.y+=80*(delta/1000);
      if (this.magnetActive){
        const d=Phaser.Math.Distance.Between(it.x,it.y,this.ship.x,this.ship.y);
        if (d<220){
          const a=Phaser.Math.Angle.Between(it.x,it.y,this.ship.x,this.ship.y);
          it.x+=Math.cos(a)*4; it.y+=Math.sin(a)*4;
        }
      }
      if (it.y>H+30) it.destroy();
    });

    // Colisiones balas-enemigos
    this.shipBullets.getChildren().forEach(b=>{
      if (!b||!b.active) return;
      this.enemies.getChildren().forEach(e=>{
        if (!e||!e.active) return;
        const dx=b.x-e.x, dy=b.y-e.y;
        const r=(e.type==='boss'?50:e.type==='mothership'?40:e.type==='elite'?20:e.type==='hunter'?20:15);
        if (dx*dx+dy*dy<r*r){
          e.hp-=b.dmg;
          this.shotsHit++;
          AUDIO.sfx('hit');
          this.add.circle(e.x,e.y,5,0xffff00,0.8).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
          if (!b.pierce) b.destroy();
          if (e.hp<=0) this.killEnemy(e);
        }
      });
    });

    // Colisiones balas enemigas-jugador
    this.ebullets.getChildren().forEach(b=>{
      if (!b||!b.active) return;
      const dx=b.x-this.ship.x, dy=b.y-this.ship.y;
      if (dx*dx+dy*dy<20*20){
        if (this.reflectorActive){
          b.speed=-b.speed;
          b.setTint(0x00ffff);
        } else {
          b.destroy();
          this.hitPlayer();
        }
      }
    });

    // Colisiones enemigos-jugador
    this.enemies.getChildren().forEach(e=>{
      if (!e||!e.active) return;
      const dx=e.x-this.ship.x, dy=e.y-this.ship.y;
      const r=(e.type==='boss'?50:e.type==='mothership'?40:20);
      if (dx*dx+dy*dy<r*r){
        this.hitPlayer();
        this.killEnemy(e);
      }
    });

    // Colisiones items-jugador
    this.items.getChildren().forEach(it=>{
      if (!it||!it.active) return;
      const dx=it.x-this.ship.x, dy=it.y-this.ship.y;
      if (dx*dx+dy*dy<24*24) this.collectItem(it);
    });

    // Dron aliado
    if (this.droneActive && this.drone){
      this.drone.x+=(this.ship.x-30-this.drone.x)*0.1;
      this.drone.y+=(this.ship.y-this.drone.y)*0.1;
    }

    // HUD
    this.updateHUD();

    this.updateProgressUI();
    this.checkLevelProgress();

    // Co-op host: jugadores remotos + broadcast del mundo
    if (this.isNetHost){
      this.updateRemotePlayers(time,delta);
      this.netTick+=delta;
      if (this.netTick>=66){ this.netTick=0; COOP.broadcastWorld(this.buildSnapshot()); }
    }
  }

  myName(){
    if (typeof userId!=='undefined' && userId) return userId.slice(0,12);
    if (COOP.myId) return ('P'+COOP.myId.slice(-3)).toUpperCase();
    return 'P?';
  }

  updateHUD(){
    if (!this.hudText) return;
    this.hudText.setText(
      'PUNTOS: '+Math.floor(this.score)+'\n'+
      'VIDAS: '+'♥'.repeat(Math.max(0,this.lives))+'  BOMBAS: '+this.bombs
    );
  }

  buildSnapshot(){
    const enemies=this.enemies.getChildren().filter(e=>e.active).map(e=>[Math.round(e.x),Math.round(e.y),e.type]);
    const eb=this.ebullets.getChildren().filter(b=>b.active).map(b=>[Math.round(b.x),Math.round(b.y)]);
    const pb=this.shipBullets.getChildren().filter(b=>b.active).map(b=>[Math.round(b.x),Math.round(b.y)]);
    const it=this.items.getChildren().filter(o=>o.active).map(o=>[Math.round(o.x),Math.round(o.y),o.itemType]);
    const pl=[[COOP.myId||'host',Math.round(this.ship.x),Math.round(this.ship.y),this.shipKey,this.lives,this.myName()]];
    for (const id in this.remotePlayers){ const rp=this.remotePlayers[id]; pl.push([id,Math.round(rp.ship.x),Math.round(rp.ship.y),rp.key,this.lives,rp.name||'']); }
    return { le:enemies, eb, pb, it, pl, meta:{ lvl:this.levelIdx, kills:this.levelKills, total:this.totalEnemies, boss:this.bossSpawned?1:0, score:Math.floor(this.score), lives:this.lives } };
  }

  updateRemotePlayers(time,delta){
    const seen={};
    for (const id in COOP.remoteInputs){
      const d=COOP.remoteInputs[id];
      seen[id]=true;
      let rp=this.remotePlayers[id];
      if (!rp){
        const ship=this.add.image((typeof d.x==='number')?d.x:W/2,(typeof d.y==='number')?d.y:H-100,'ship_'+(d.key||'viper')).setDepth(10).setScale(0.62).setTint(0xaaffcc);
        const flame=this.add.image(ship.x,ship.y+20,'flame').setOrigin(0.5,0).setDepth(9).setBlendMode(Phaser.BlendModes.ADD).setScale(0.7,0.9);
        const name=(d.name||('P'+id.slice(-3))).toString().slice(0,12);
        const label=this.add.text(ship.x,ship.y-30,name,{fontSize:'9px',fontFamily:'monospace',color:'#aaffcc',stroke:'#002200',strokeThickness:3}).setOrigin(0.5).setDepth(12);
        rp=this.remotePlayers[id]={ship,flame,label,name,key:d.key||'viper',fireCd:0,firing:0};
      }
      if (d.name && rp.label && rp.label.text!==d.name.slice(0,12)){ rp.name=d.name.slice(0,12); rp.label.setText(rp.name); }
      const tx=(typeof d.x==='number')?d.x:rp.ship.x;
      const ty=(typeof d.y==='number')?d.y:rp.ship.y;
      rp.ship.x+=(tx-rp.ship.x)*Math.min(1,delta/1000*12);
      rp.ship.y+=(ty-rp.ship.y)*Math.min(1,delta/1000*12);
      rp.ship.x=Phaser.Math.Clamp(rp.ship.x,20,W-20);
      rp.ship.y=Phaser.Math.Clamp(rp.ship.y,60,H-40);
      rp.flame.x=rp.ship.x; rp.flame.y=rp.ship.y+20;
      rp.flame.setScale(0.6+Math.sin(time/40)*0.1,0.8+Math.sin(time/30)*0.15);
      rp.label.x=rp.ship.x; rp.label.y=rp.ship.y-30;
      rp.firing=d.firing?1:0;
      if (d.bomb){ this.remoteBomb(rp.ship.x,rp.ship.y); delete d.bomb; }
      rp.fireCd-=delta;
      if (rp.firing && rp.fireCd<=0){
        rp.fireCd=165;
        const b=this.add.image(rp.ship.x,rp.ship.y-18,'bullet').setDepth(8).setTint(0x88ffcc);
        b.speed=-500; b.dmg=1; b.weapon='normal'; b.pierce=false;
        this.shipBullets.add(b);
      }
    }
    for (const id in this.remotePlayers){
      if (!seen[id]){ const rp=this.remotePlayers[id]; if(rp.ship)rp.ship.destroy(); if(rp.flame)rp.flame.destroy(); if(rp.label)rp.label.destroy(); delete this.remotePlayers[id]; }
    }
  }

  remoteBomb(x,y){
    AUDIO.sfx('bomb'); vib(150);
    const c=this.add.circle(x,y,140,0xffaa00,0.5).setDepth(6);
    this.tweens.add({targets:c,scale:1.6,alpha:0,duration:350,onComplete:()=>c.destroy()});
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      const dx=e.x-x, dy=e.y-y;
      if (dx*dx+dy*dy<160*160){ e.hp-=40; if (e.hp<=0) this.killEnemy(e); }
    });
  }

  renderNet(time){
    const s=COOP.worldSnapshot; if (!s) return;
    if (s.meta){
      if (typeof s.meta.score==='number') this.score=s.meta.score;
      if (typeof s.meta.lives==='number') this.lives=s.meta.lives;
      this.levelKills=s.meta.kills||0; this.totalEnemies=s.meta.total||0; this.bossSpawned=!!s.meta.boss;
      if (typeof s.meta.lvl==='number' && s.meta.lvl!==this.levelIdx){ this.loadLevel(s.meta.lvl); return; }
    }
    this.syncNet(this.netEnemies, s.le, (d)=>this.add.image(d[0],d[1],'enemy_'+d[2]).setDepth(5), (o,d)=>{ if (o.getData('kt')!==d[2]){ o.setTexture('enemy_'+d[2]); o.setData('kt',d[2]); } o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netEBullets, s.eb, (d)=>this.add.image(d[0],d[1],'ebullet').setDepth(7), (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netPBullets, s.pb, (d)=>this.add.image(d[0],d[1],'bullet').setDepth(8).setTint(0x88bbff), (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netItems, s.it, (d)=>{ const im=this.add.image(d[0],d[1],d[2]).setDepth(6); im.itemType=d[2]; return im; }, (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    const others=(s.pl||[]).filter(p=>p[0]!==COOP.myId);
    this.syncNet(this.netPlayers, others, (p)=>{ const im=this.add.image(p[1],p[2],'ship_'+p[3]).setDepth(10).setScale(0.62).setTint(0xaaffcc); const lb=this.add.text(p[1],p[2]-30,(p[5]||'').slice(0,12),{fontSize:'9px',fontFamily:'monospace',color:'#aaffcc',stroke:'#002200',strokeThickness:3}).setOrigin(0.5).setDepth(12); im.lbl=lb; return im; }, (o,p)=>{ if (o.getData('kk')!==p[3]){ o.setTexture('ship_'+p[3]); o.setData('kk',p[3]); } o.x=p[1]; o.y=p[2]; if (o.lbl){ o.lbl.x=p[1]; o.lbl.y=p[2]-30; const nm=(p[5]||'').slice(0,12); if (o.lbl.text!==nm) o.lbl.setText(nm); } });
  }

  syncNet(list, arr, mk, up){
    arr=arr||[];
    while (list.length<arr.length){ try { list.push(mk(arr[list.length])); } catch(e){ list.push(null); } }
    while (list.length>arr.length){ const o=list.pop(); if (o){ if (o.lbl) o.lbl.destroy(); o.destroy(); } }
    for (let i=0;i<arr.length;i++){ if (list[i]) up(list[i],arr[i],i); }
  }

  enemyFire(e){
    const b=this.add.image(e.x,e.y+20,'ebullet').setDepth(7);
    b.speed=200*this.diff.spdMul;
    b.vx=(this.ship.x-e.x)*0.3;
    this.ebullets.add(b);
  }

  killEnemy(e){
    const scoreTable={drone:10,hunter:25,elite:50,mothership:200,boss:500};
    this.score+=(scoreTable[e.type]||10)*this.diff.scoreMul*this.scoreMultiplier;
    this.levelKills++;
    AUDIO.sfx('explosion');
    vib(80);
    const exp=this.add.circle(e.x,e.y,15,0xffaa00,0.8).setDepth(6);
    this.tweens.add({targets:exp,scale:2,alpha:0,duration:300,onComplete:()=>exp.destroy()});
    if (Math.random()<0.25){
      const keys=ITEM_TYPES.map(i=>i.key);
      const chosen=keys[Phaser.Math.Between(0,keys.length-1)];
      const it=this.add.image(e.x,e.y,chosen).setDepth(6);
      it.itemType=chosen;
      this.items.add(it);
    }
    if (e.flameRef) e.flameRef.destroy();
    e.destroy();
  }
}

// ===== NIVEL COMPLETADO =====
class LevelCompleteScene extends Phaser.Scene {
  constructor(){ super('LevelComplete'); }
  init(data){ this.summary=data; this.advanced=false; }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    const d=this.summary;
    if (d && d.client){
      this.add.text(W/2,H/2,t('level')+' '+(d.levelIdx+1)+' '+t('levelComplete'),{fontSize:'18px',fontFamily:'monospace',color:'#ffdd44',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5).setDepth(91);
      this.add.text(W/2,H/2+40,t('waitingPlayers'),{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5).setDepth(91);
      return;
    }
    const acc=d.shotsFired>0?Math.floor((d.shotsHit/d.shotsFired)*100):0;
    this.add.rectangle(W/2,H/2,W,H,0x000000,0.9).setDepth(90);
    const cx=W/2, cy=H/2-40;
    const mk=(dy,txt,color,size,bold)=>this.add.text(cx,cy+dy,txt,{fontSize:(size||14)+'px',fontFamily:'monospace',color:color,fontStyle:bold?'bold':'normal',stroke:'#000',strokeThickness:bold?4:2}).setOrigin(0.5).setDepth(91);
    mk(-130,t('level')+' '+(d.levelIdx+1)+' '+t('levelComplete'),'#ffdd44',22,true);
    mk(-80,t('enemies')+': '+d.levelKills+'/'+d.totalEnemies,'#ffffff');
    mk(-50,t('accuracy')+': '+acc+'%','#88bbff');
    mk(-20,t('points')+': '+Math.floor(d.score),'#00d4ff');
    mk(10,t('lives')+': '+d.lives+'   '+t('bombs')+': '+d.bombs,'#ff4466');
    const last=d.levelIdx>=LEVELS.length-1;
    const b=this.add.text(cx,cy+90,'[ '+(last?t('victoryBtn'):t('nextLevel'))+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#44ff88',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(91);
    this.tweens.add({targets:b,alpha:0.3,duration:500,yoyo:true,repeat:-1});
    b.setInteractive({useHandCursor:true});
    b.on('pointerdown',()=>this.advance());
    this.countdown=6;
    this.cdText=this.add.text(cx,cy+125,tf('autoAdvance',{s:this.countdown}),{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5).setDepth(91);
    this.cdTimer=this.time.addEvent({delay:1000,repeat:this.countdown-1,callback:()=>{
      this.countdown--;
      if (this.countdown<=0) this.advance();
      else if (this.cdText) this.cdText.setText(tf('autoAdvance',{s:this.countdown}));
    }});
  }
  advance(){
    if (this.advanced) return;
    this.advanced=true;
    if (this.cdTimer) this.cdTimer.remove();
    const d=this.summary;
    if (d.levelIdx>=LEVELS.length-1){
      if (COOP.mode()==='host') COOP.broadcastEvent({e:'victory'});
      COOP.destroy();
      clearProgress();
      this.scene.start('GameOver',{score:d.score, victory:true, shotsFired:d.shotsFired, shotsHit:d.shotsHit, shipIdx:d.shipIdx, diffIdx:d.diffIdx});
      return;
    }
    if (COOP.mode()!=='client'){
      this.scene.start('Game',{ diffIdx:d.diffIdx, shipIdx:d.shipIdx, continueData:{ score:d.score, lives:d.lives, bombs:d.bombs, shotsFired:d.shotsFired, shotsHit:d.shotsHit, weaponKey:d.weaponKey, powerLevel:d.powerLevel, nextLevel:d.levelIdx+1 } });
    }
  }
}

// ===== GAME OVER =====
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }
  init(data){
    this.finalScore=data.score||0; this.shotsFired=data.shotsFired||0; this.shotsHit=data.shotsHit||0;
    this.victory=!!data.victory; this.defeat=!!data.defeat;
    this.levelIdx=data.levelIdx; this.diffIdx=data.diffIdx; this.shipIdx=data.shipIdx;
    this.scoreAtLevelStart=data.scoreAtLevelStart||0;
  }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    if (this.victory) {
      // Outró: nave se aleja volando
      const ship=this.add.image(W/2,H/2,'ship_'+SHIPS[this.shipIdx||0].key).setScale(1.3).setDepth(80);
      this.add.particles(ship.x,ship.y,'spark',{
        follow:ship, followOffset:{x:0,y:10},
        speedY:{min:50,max:120}, speedX:{min:-20,max:20},
        scale:{start:1.2,end:0}, alpha:{start:0.8,end:0},
        lifespan:300, frequency:40, quantity:1, tint:[0xffee00,0xff9900], blendMode:'ADD'
      }).setDepth(79);
      this.tweens.add({targets:ship, y:-160, duration:1600, ease:'Cubic.In',
        onComplete:()=>this.showCredits()
      });
      return;
    }
    // Derrota o normal
    const cx=W/2, cy=H/2-60;
    this.add.text(cx,cy-40,this.defeat? t('gameOver') : t('gameOver'),{fontSize:'36px',fontFamily:'monospace',color:'#ff4444',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.add.text(cx,cy,t('points')+': '+Math.floor(this.finalScore),{fontSize:'22px',fontFamily:'monospace',color:'#ffaa00'}).setOrigin(0.5);
    const acc=this.shotsFired>0?Math.floor((this.shotsHit/this.shotsFired)*100):0;
    this.add.text(cx,cy+30,t('accuracy')+': '+acc+'%',{fontSize:'14px',fontFamily:'monospace',color:'#88bbff'}).setOrigin(0.5);
    if (this.defeat){
      const r=this.add.text(cx,cy+70,'[ '+t('retry')+' — '+t('level')+' '+(this.levelIdx+1)+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#44ff88',stroke:'#000',strokeThickness:3}).setOrigin(0.5);
      r.setInteractive({useHandCursor:true});
      r.on('pointerdown',()=>{
        const sd=this.scoreAtLevelStart||0;
        this.scene.start('Game',{ diffIdx:this.diffIdx||1, shipIdx:this.shipIdx||0,
          continueData:{ nextLevel:this.levelIdx||0, score:sd, lives:3, bombs:2, shotsFired:0, shotsHit:0, weaponKey:'normal', powerLevel:0 } });
      });
    }
    const m=this.add.text(cx,cy+110,'[ '+t('menu')+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#00d4ff'}).setOrigin(0.5);
    m.setInteractive({useHandCursor:true});
    m.on('pointerdown',()=>{ COOP.destroy(); this.scene.start('Menu'); });
    const cr=this.add.text(cx,cy+140,'[ '+t('seeCredits')+' ]',{fontSize:'13px',fontFamily:'monospace',color:'#666'}).setOrigin(0.5);
    cr.setInteractive({useHandCursor:true});
    cr.on('pointerdown',()=>this.showCredits());
  }
  showCredits(){
    this.scene.start('Credits');
  }
}

// ===== CRÉDITOS =====
class CreditsScene extends Phaser.Scene {
  constructor(){ super('Credits'); }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    const cx=W/2;
    const c=this.add.container(cx,H+40).setDepth(90);
    const mk=(y,tg,sz,clr,bld)=>{ const o=this.add.text(0,y,tg,{fontSize:sz+'px',fontFamily:'monospace',color:clr||'#fff',fontStyle:bld?'bold':'normal',align:'center',stroke:'#000',strokeThickness:bld?3:1}).setOrigin(0.5); c.add(o); return o; };
    let y=0;
    y+=40; mk(y,t('storyTitle'),16,'#00d4ff',true);
    y+=40; const st=this.add.text(0,y,t('story'),{fontSize:'11px',fontFamily:'monospace',color:'#88ddee',align:'center',wordWrap:{width:W-40},stroke:'#000',strokeThickness:1}).setOrigin(0.5); c.add(st); y+=st.getBounds().height+20;
    y+=20; mk(y,t('credits'),14,'#ffdd44',true);
    y+=30; mk(y,t('madeBy'),10,'#666');
    y+=18; mk(y,'Sergio Gabriel Borbolla Verdecia',13,'#ffaa00',true);
    y+=30; mk(y,t('codeDesign'),10,'#666'); y+=16; mk(y,'opencode / agent',12,'#88bbff');
    y+=28; mk(y,t('engine'),10,'#666'); y+=16; mk(y,'Phaser 3 + Web Audio',12,'#88bbff');
    y+=28; mk(y,t('musicSfx'),10,'#666'); y+=16; mk(y,'Procedural synthwave',12,'#88bbff');
    y+=36; mk(y,t('thanksPlaying'),12,'#44ff88',true);
    y+=40; mk(y,t('soon'),10,'#888');
    y+=60;
    c.setY(H+y+20);
    this.tweens.add({targets:c, y:-y-40, duration:9000, ease:'Linear', onComplete:()=>this.backToMenu()});
    const sk=this.add.text(W/2,H-30,'[ '+t('skip')+' ]',{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5).setDepth(91);
    sk.setInteractive({useHandCursor:true});
    sk.on('pointerdown',()=>this.backToMenu());
  }
  backToMenu(){
    COOP.destroy(); this.scene.start('Menu');
  }
}
