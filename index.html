const OUT=0x080c16;
function shade(c,f){let r=(c>>16)&255,g=(c>>8)&255,b=c&255;r=Math.max(0,Math.min(255,(r*f)|0));g=Math.max(0,Math.min(255,(g*f)|0));b=Math.max(0,Math.min(255,(b*f)|0));return (r<<16)|(g<<8)|b;}
function gPoly(g,pts,fill,stroke,sw){if(fill!=null){g.fillStyle(fill,1);g.fillPoints(pts,true);}if(stroke!=null){g.lineStyle(sw||1.5,stroke,0.85);g.strokePoints(pts,true,true);}}
function gLine(g,x1,y1,x2,y2,c,sw){const gr=g;gr.lineStyle(sw||1,c);gr.beginPath();gr.moveTo(x1,y1);gr.lineTo(x2,y2);gr.strokePath();}
function gPts(a){return a.map(p=>({x:p[0],y:p[1]}));}

 } else if(key==='titan'){

 }
 else { // specter

 }
 else if(key==='mothership'){
  gPoly(g,gPts([[46,4],[82,14],[88,30],[72,44],[20,44],[4,30],[10,14]]),shade(0xff0044,0.55),OUT,2);
  gPoly(g,gPts([[46,9],[76,17],[80,30],[68,39],[24,39],[12,30],[16,17]]),0xff0044,null);
  g.fillStyle(0x2a0010,1);g.fillRoundedRect(34,10,24,12,3);
  for(let i=0;i<4;i++){g.fillStyle(0x66ddff,1);g.fillRect(36+i*6,14,4,5);}
  g.fillStyle(0x1a0010,1);g.fillCircle(22,27,7);g.fillCircle(70,27,7);
  g.fillStyle(0xff4466,1);g.fillCircle(22,27,4);g.fillCircle(70,27,4);
  g.fillStyle(0xff4400,0.4);g.fillCircle(46,28,16);
  g.fillStyle(0xffcc00,1);g.fillCircle(46,28,9);
  g.fillStyle(0xffffff,1);g.fillCircle(46,28,4);
 }
 else { // boss
  gPoly(g,gPts([[65,2],[114,16],[124,42],[98,62],[32,62],[6,42],[16,16]]),shade(0xff2200,0.5),OUT,2.4);
  gPoly(g,gPts([[65,10],[104,22],[112,42],[92,55],[38,55],[18,42],[26,22]]),0xff2200,null);
  gPoly(g,gPts([[40,20],[90,20],[96,44],[34,44]]),shade(0xff2200,0.35),null);
  g.fillStyle(0x2a0000,1);g.fillRoundedRect(52,8,26,13,3);
  for(let i=0;i<4;i++){g.fillStyle(0xffcc33,1);g.fillRect(55+i*6,12,4,5);}
  g.fillStyle(0x140000,1);g.fillCircle(20,34,12);g.fillCircle(110,34,12);
  g.fillStyle(0xff5500,1);g.fillCircle(20,34,8);g.fillCircle(110,34,8);

 }

 g.fillStyle(0x0a1a24,1);g.fillRect(9,25,5,5);g.fillRect(15,25,5,5);

// ===== AUDIO compartido (Web Audio, sin archivos externos) =====
const AUDIO=(()=>{
 let ctx=null,sfxGain=null,musicGain=null,enabled=true;
 function init(){
  if(ctx){if(ctx.state==='suspended')ctx.resume();return ctx;}
  try{ctx=new (window.AudioContext||window.webkitAudioContext)();
   sfxGain=ctx.createGain();sfxGain.gain.value=0.30;sfxGain.connect(ctx.destination);
   musicGain=ctx.createGain();musicGain.gain.value=0.15;musicGain.connect(ctx.destination);
  }catch(e){ctx=null;}
  return ctx;
 }
 function toggle(){enabled=!enabled;if(sfxGain)sfxGain.gain.value=enabled?0.30:0;if(musicGain)musicGain.gain.value=enabled?0.15:0;return enabled;}
 return{init,toggle,isEnabled:()=>enabled,get ctx(){return ctx;},get sfx(){return sfxGain;},get music(){return musicGain;}};
})();

function vib(pattern){try{if('vibrate' in navigator)navigator.vibrate(pattern);}catch(e){}}

// ===== SFX =====
const SFX=(()=>{
 let lastShot=0;
 function tone(freq,dur,type,vol,slideTo){
  const ctx=AUDIO.init();if(!ctx||!AUDIO.isEnabled())return;
  const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AUDIO.sfx);o.start(t);o.stop(t+dur);
 }
 function noise(dur,vol,ff){
  const ctx=AUDIO.init();if(!ctx||!AUDIO.isEnabled())return;
  const n=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=ctx.createBufferSource();src.buffer=buf;
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=ff||1200;
  const g=ctx.createGain();g.gain.value=vol||0.3;
  src.connect(f);f.connect(g);g.connect(AUDIO.sfx);src.start();
 }
 return {
  init:AUDIO.init,
  toggle(){const on=AUDIO.toggle();return on;},
  isEnabled:AUDIO.isEnabled,
  shoot(w){AUDIO.init();const now=performance.now();if(now-lastShot<55)return;lastShot=now;
   if(w==='laser')tone(950,0.10,'sawtooth',0.10,1500);
   else if(w==='plasma')tone(320,0.14,'sine',0.16,120);
   else if(w==='lightning')tone(1300,0.07,'square',0.09,650);
   else if(w==='missile')noise(0.18,0.16,2200);
   else tone(720,0.06,'square',0.10,420);},
  explode(big){AUDIO.init();noise(big?0.5:0.26,big?0.5:0.28,big?700:1500);tone(big?90:150,big?0.4:0.18,'sine',big?0.34:0.18,big?40:70);},
  hit(){AUDIO.init();tone(220,0.05,'square',0.10,130);},
  enemyShoot(big){AUDIO.init();if(big)tone(200,0.18,'sawtooth',0.14,90);else tone(300,0.08,'sawtooth',0.09,180);},
  playerHit(){AUDIO.init();noise(0.4,0.5,600);tone(170,0.4,'sawtooth',0.3,50);},
  powerup(){AUDIO.init();tone(620,0.08,'square',0.14);setTimeout(()=>tone(900,0.1,'square',0.15),70);},
  levelUp(){AUDIO.init();[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.16,'triangle',0.17),i*110));},
  bossWarn(){AUDIO.init();tone(120,0.6,'sawtooth',0.24,90);},
  warp(){AUDIO.init();tone(220,0.5,'sawtooth',0.16,2200);},
  over(){AUDIO.init();[440,392,349,294].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.18),i*200));}
 };
})();

// ===== MUSIC (secuenciador procedural, darksynth cyberpunk) =====
const MUSIC=(()=>{
 function hz(m){return 440*Math.pow(2,(m-69)/12);}
 function tr(bpm,wave,chords,lead,style){return{bpm,wave,chords,lead,style:style||'chip',stepDur:60/bpm/4};}
 const TR={
  menu:tr(104,'sawtooth',[[57,60,64],[53,57,60],[55,59,62],[52,55,59]],[69,72,76,72,67,71,74,71,65,69,72,69,64,67,71,67],'cyber'),
  select:tr(112,'sawtooth',[[57,60,64],[62,65,69],[53,57,60],[55,59,62]],[72,76,79,84,81,79,76,72,69,72,76,79,74,76,79,83],'cyber'),
  level:tr(128,'sawtooth',[[57,60,64],[57,60,64],[53,57,60],[55,59,62]],[76,79,83,79,72,76,79,76,67,72,76,72,74,79,81,79],'cyber'),
  boss:tr(150,'sawtooth',[[50,53,57],[50,53,57],[48,51,55],[49,52,56]],[74,77,81,74,70,74,77,70,67,70,74,67,69,73,76,81],'cyber'),
  win:tr(108,'sawtooth',[[57,60,64],[53,57,60],[55,59,62],[60,64,67]],[72,72,76,79,77,77,81,84,79,79,81,74,76,79,84,88],'cyber'),
  over:tr(84,'sawtooth',[[57,60,64],[55,59,62],[53,57,60],[52,55,59]],[69,72,76,72,67,71,74,71,65,69,72,69,64,67,71,67],'cyber')
 };
 let on=false,name=null,cur=null,step=0,nextTime=0,timer=null;
 function env(g,t,vol,a,d){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(a||0.02));g.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.3));}
 function sNote(t,freq,dur,type,vol,detune){
  const ctx=AUDIO.ctx;if(!ctx)return;
  const mk=(dtn)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(dtn)o.detune.value=dtn;env(g,t,vol,0.015,dur);o.connect(g);g.connect(AUDIO.music);o.start(t);o.stop(t+dur+0.03);};
  mk(0);if(detune)mk(detune);
 }
 function kick(t){
  const ctx=AUDIO.ctx;const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+0.11);
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g);g.connect(AUDIO.music);o.start(t);o.stop(t+0.24);
 }
 function snare(t){
  const ctx=AUDIO.ctx;const n=Math.floor(ctx.sampleRate*0.16),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=ctx.createBufferSource();src.buffer=buf;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=1400;
  const g=ctx.createGain();g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);

 }

  const ctx=AUDIO.ctx;const dur=open?0.14:0.05,n=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);

  const g=ctx.createGain();g.gain.setValueAtTime(open?0.12:0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(AUDIO.music);src.start(t);
 }
 function tickStep(t){
  const n=cur.chords.length*16,s=step%n,bar=Math.floor(s/16),beat=s%16,ch=cur.chords[bar];
  if(cur.style==='cyber'){
   if(beat%4===0)kick(t);
   if(beat===4||beat===12)snare(t);
   hat(t,beat%4===2);
   // bajo pulsante 8vos (con octava alterna)
   if(beat%2===0)sNote(t,hz(ch[0]-12),cur.stepDur*1.7,'sawtooth',0.22,0);
   if(beat%4===2)sNote(t,hz(ch[0]-24),cur.stepDur*1.6,'square',0.14,0);
   // arpegio saw 16th con desafinado
   const seq=[ch[0],ch[2],ch[1],ch[2]];
   sNote(t,hz(chordNote(seq,beat)),cur.stepDur*0.9,'sawtooth',0.07,12);
   // pad de acorde cada 2 beats
   if(beat%8===0){sNote(t,hz(ch[0]),cur.stepDur*8,'sawtooth',0.05,8);sNote(t,hz(ch[2]),cur.stepDur*8,'sawtooth',0.05,-8);}
  }else{
   if(step%8===0)return;
  }
  if(beat%4===0&&cur.lead){const ln=cur.lead[(Math.floor(step/4))%cur.lead.length];if(ln)sNote(t,hz(ln),cur.stepDur*3,'square',0.12,7);}
  if(!cur.style||cur.style!=='cyber'){}
  function noop(){}
 }
 function arpNote(t,ch,beat){const seq=[ch[0],ch[1],ch[2],ch[1]];sNote(t,hz(seq[(beat/2)%4]+12),cur.stepDur*1.6,cur.wave,0.08);}

  const ctx=AUDIO.ctx;if(!ctx||!cur)return;

 }
 function play(trName){
  const ctx=AUDIO.init();if(!ctx)return;
  if(name===trName&&on)return;

 function stop(){on=false;name=null;cur=null;}

 constructor(){super('Game');}

  this.levelIdx=data.level||0;this.score=data.score||0;
  this.carryLives=data.lives;this.lives=data.lives||5;
  this.carryPower=data.power;this.powerLevel=data.power||0;
  this.carryFire=data.fireDelay;this.fireDelay=data.fireDelay||0;
  this.carrySpeed=data.shipSpeed;this.shipSpeedBase=data.shipSpeed||0;
  this.shipKey=data.shipKey||SHIPS[0].key;
  this.weaponKey=data.weaponKey||null;
 }

  const def=SHIPS.find(s=>s.key===this.shipKey)||SHIPS[0];
  this.shipDef=def;
  this.isHost=(netRole==='host'); this.isClient=(netRole==='client');
  this.isCoop=(netRole!=='single');
  this.fireDelay=this.carryFire||def.fireDelay;
  this.shipSpeedBase=this.carrySpeed||def.speed;
  this.powerLevel=this.carryPower!==undefined?this.carryPower:Math.max(0,def.power-1);
  this.weaponKey=this.weaponKey||def.weapon||'normal';
  this.lives=this.carryLives!==undefined?this.carryLives:def.lives;

  this.alive=true;this.frozen=false;this.tripleShot=false;this.invincible=false;
  this.magnet=false;this.pierce=false;this.x2=false;this.reflect=false;this.allyActive=false;
  MUSIC.play('level');

  // dificultad
  const D=curDiff();this.diff=D;
  if(this.carryLives===undefined)this.lives=godMode?5:Math.max(1,(this.lives||5)+D.lives);
  if(godMode){
   this.powerLevel=Math.max(4,this.powerLevel);
   this.fireDelay=Math.min(this.fireDelay,130);
   this.tripleShot=true;this.pierce=true;this.magnet=true;this.x2=true;this.invincible=true;
   this.hasShield=true;
  }

  // estadísticas del nivel
  this.levelStartScore=this.score;this.shotsFired=0;this.shotsHit=0;this.itemsCollected=0;this.levelKills=0;

  const L=LEVELS[Math.min(this.levelIdx,LEVELS.length-1)];
  this.levelConfig=L;
  this.cameras.main.setBackgroundColor(L.bg);
  this.decorObjs=[];

  // estrellas parallax
  this.stars=[];
  for(let i=0;i<70;i++){
   const s=this.add.image(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),'star').setAlpha(Phaser.Math.FloatBetween(0.3,1));
   s.tint=L.sc;s.spd=Phaser.Math.Between(30,120);this.stars.push(s);
  }
  this.buildDecor(L.decor,L.sc);

  // nave local (vista normal, un poco más grande)
  this.ship=this.add.image(W/2,H-90,'ship_'+this.shipKey).setDepth(12).setScale(1.15);
  this.shieldImg=this.add.image(this.ship.x,this.ship.y,'shield').setVisible(godMode?true:(this.shipKey==='specter')).setScale(1.0).setDepth(13);
  this.hasShield=godMode?true:(this.shipKey==='specter');

  // aliado
  this.ally=this.add.image(W/2,H-130,'ally').setVisible(false).setDepth(9);

  // UI
  this.scoreText=this.add.text(10,8,'PUNTOS '+this.score,{fontSize:'13px',fontFamily:'monospace',color:'#ffffff'}).setDepth(50);
  this.livesText=this.add.text(W-10,8,'VIDAS '+this.lives,{fontSize:'13px',fontFamily:'monospace',color:'#ff4466'}).setOrigin(1,0).setDepth(50);
  this.levelText=this.add.text(W/2,8,'NIVEL '+(this.levelIdx+1)+'/20 · '+L.name,{fontSize:'11px',fontFamily:'monospace',color:'#00d4ff'}).setOrigin(0.5,0).setDepth(50);
  this.progressText=this.add.text(W/2,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#ffaa00'}).setOrigin(0.5,0).setDepth(50);
  this.weaponText=this.add.text(10,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#88bbff'}).setDepth(50);
  this.updateWeaponUI();

  // controles: arrastre relativo (disparo automático)
  this.dragging=false;
  this.input.on('pointerdown',p=>{if(!this.alive||this.arriving)return;this.dragging=true;this.dragStartX=p.x;this.dragStartY=p.y;this.shipStartX=this.ship.x;this.shipStartY=this.ship.y;});
  this.input.on('pointermove',p=>{if(!this.dragging||!this.alive||this.arriving)return;this.ship.x=this.shipStartX+(p.x-this.dragStartX)*DRAG_SENS;this.ship.y=this.shipStartY+(p.y-this.dragStartY)*DRAG_SENS;});
  this.input.on('pointerup',()=>{this.dragging=false;});
  this.input.on('pointerupoutside',()=>{this.dragging=false;});

  if(this.isClient){
   // El cliente NO simula: solo dibuja el mundo del host
   this.netGfx=this.add.graphics().setDepth(5);
   this.remoteShips={};
   this.netSend=this.time.addEvent({delay:60,callback:this.clientSend,callbackScope:this,loop:true});
  } else {
   // single / host => simulación completa
   this.bullets=this.physics.add.group();
   this.ebullets=this.physics.add.group();
   this.enemies=this.physics.add.group();
   this.items=this.physics.add.group();
   this.mines=this.physics.add.group();

   this.remoteSprites={}; // host: naves remotas

   this.timerShoot=this.time.addEvent({delay:this.fireDelay,callback:this.shoot,callbackScope:this,loop:true});
   this.timerSpawn=this.time.addEvent({delay:Math.round(L.spawn*D.spawn),callback:this.spawnEnemy,callbackScope:this,loop:true});
   this.timerItem=this.time.addEvent({delay:5200,callback:()=>this.spawnItem(),callbackScope:this,loop:true});
   this.time.delayedCall(9000,()=>this.spawnMothership());

   this.totalEnemies=L.count;this.spawnedEnemies=0;this.killedEnemies=0;
   this.bossSpawned=false;this.bossAlive=false;this.levelDone=false;
   this.updateProgressUI();

   this.physics.add.collider(this.bullets,this.enemies,this.hitEnemy,null,this);
   this.physics.add.collider(this.ebullets,this.ship,this.hitPlayer,null,this);
   this.physics.add.collider(this.enemies,this.ship,this.hitPlayer,null,this);
   this.physics.add.overlap(this.items,this.ship,this.collectItem,null,this);
   this.physics.add.collider(this.mines,this.enemies,this.mineHit,null,this);
  }

  // controles táctiles (ya registrados arriba)

  this.cameras.main.fadeIn(500,0,0,0);
  const banner=this.add.text(W/2,H/2-40,'NIVEL '+(this.levelIdx+1)+'\n'+L.name,{fontSize:'26px',fontFamily:'monospace',color:'#ffaa00',align:'center',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5).setDepth(60).setAlpha(0);
  this.tweens.add({targets:banner,alpha:1,duration:400,yoyo:true,hold:900,onComplete:()=>banner.destroy()});

  // cinemática de llegada: la nave entra volando desde abajo

  this.ship.y=H+90;
  this.arrivalTrail=this.time.addEvent({delay:28,loop:true,callback:()=>{
   const t=this.add.circle(this.ship.x+Phaser.Math.Between(-4,4),this.ship.y+18,Phaser.Math.Between(3,6),0x66ccff,0.9).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
   this.tweens.add({targets:t,alpha:0,scale:2.2,y:t.y+60,duration:360,onComplete:()=>t.destroy()});
  }});
  this.tweens.add({targets:this.ship,y:H-90,duration:1300,ease:'Sine.easeOut',
   onComplete:()=>{if(this.arrivalTrail)this.arrivalTrail.remove();this.arriving=false;
    const go=this.add.text(W/2,H*0.5,'¡A LUCHAR!',{fontSize:'30px',fontFamily:'monospace',color:'#00ffcc',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5).setDepth(60).setAlpha(0);
    this.tweens.add({targets:go,alpha:1,duration:250,hold:500,yoyo:true,onComplete:()=>go.destroy()});
   }
  });

  if(this.isHost){ this.time.addEvent({delay:50,callback:this.broadcastWorld,callbackScope:this,loop:true}); }
 }

 // ---------- SHOOT ----------
 shoot(){
  if(!this.alive||this.levelDone||this.arriving)return;
  SFX.shoot(this.weaponKey);
  const wp=WEAPONS[this.weaponKey]||WEAPONS.normal;
  const spd=this.shipDef.bulletSpeed;const px=this.ship.x,py=this.ship.y;
  const dmg=wp.damage||1;
  const add=(x,y,vx,vy,missile)=>{
   const tex=missile?(wp.tex||'bullet'):(wp.tex||'bullet');
   const b=this.bullets.create(x,y,missile?'missile':tex);b.setDepth(5);
   b.setVelocity(vx,vy);b.damage=dmg;
   b.pierceCount=(wp.pierce&&!missile)?4:((this.pierce&&!missile)?5:0);
    if(wp.homing&&missile)b.homing=true; if(wp.zigzag)b.zigzag=true;
    this.shotsFired++;
    return b;
  };
  wp.fire(px,py,-spd,this.powerLevel,add);
  if(this.tripleShot){add(px-18,py-8,-190,-spd);add(px+18,py-8,190,-spd);}
  // fogonazo de disparo
  const fl=this.add.circle(px,py-18,9,(wp.color||0x66ccff),0.7).setBlendMode(Phaser.BlendModes.ADD).setDepth(4);
  this.tweens.add({targets:fl,alpha:0,scale:0.2,duration:110,onComplete:()=>fl.destroy()});
 }

 // ---------- SPAWN ----------
 spawnEnemy(){
  if(!this.alive||this.levelDone||this.arriving)return;
  if(this.spawnedEnemies>=this.totalEnemies){this.timerSpawn.remove();return;}
  const type=Phaser.Utils.Array.GetRandom(this.levelConfig.enemies);
  const e=this.enemies.create(Phaser.Math.Between(24,W-24),-30,type);
  e.type=type;e.isWave=true;
  e.speed=((type==='drone'?120:type==='hunter'?80:100)+this.levelIdx*6)*this.diff.speed;
  e.hp=Math.max(1,Math.round((type==='drone'?1:type==='hunter'?3:5)*this.diff.hp));e.maxHp=e.hp;
  this.spawnedEnemies++;this.updateProgressUI();
  if(type==='drone')e.setData('phase',Math.random()*6.28);
  if(type==='hunter'||type==='elite'){
   this.time.addEvent({delay:Math.round((type==='elite'?900:1400)*this.diff.efire),callback:()=>{
    if(e.active){const b=this.ebullets.create(e.x,e.y+20,'ebullet');const a=Phaser.Math.Angle.Between(e.x,e.y,this.ship.x,this.ship.y);b.setVelocity(Math.cos(a)*220*this.diff.ebullet,Math.sin(a)*220*this.diff.ebullet);SFX.enemyShoot();}
   },loop:false});
  }
 }
 spawnMothership(){
  if(!this.alive||this.levelDone||this.isClient)return;
  const e=this.enemies.create(W/2,-50,'mothership');e.hp=Math.round((16+this.levelIdx*4)*this.diff.hp);e.type='mothership';e.speed=38;e.setData('dir',1);e.setData('shootTimer',0);
 }
 spawnBoss(){
  if(!this.alive||this.levelDone)return;
  const e=this.enemies.create(W/2,-60,'boss');e.hp=Math.round((40+this.levelIdx*10)*this.diff.hp);e.type='boss';e.speed=30;e.setData('dir',1);e.setData('shootTimer',0);
  SFX.bossWarn();MUSIC.play('boss');
  const warn=this.add.text(W/2,60,'⚠ JEFE FINAL ⚠',{fontSize:'16px',fontFamily:'monospace',color:'#ff4444',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5).setDepth(60);
  this.tweens.add({targets:warn,alpha:0,duration:3000,onComplete:()=>warn.destroy()});
 }
 spawnItem(x,y){
  if(this.isClient)return;
  const keys=ITEM_TYPES.map(t=>t.key);
  const weights=ITEM_TYPES.map(t=>{ if(t.key==='item_superbomb'||t.key==='item_invinc')return 3; if(t.key.startsWith('item_w_'))return 7; return 10;});
  let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,chosen=keys[0];
  for(let i=0;i<keys.length;i++){r-=weights[i];if(r<=0){chosen=keys[i];break;}}
  const item=this.items.create(x||Phaser.Math.Between(30,W-30),y||-20,chosen);item.setVelocityY(80);item.itemType=chosen;
 }

 // ---------- COLISIONES ----------
 hitEnemy(bullet,enemy){
  const dmg=bullet.damage||1;
  if(bullet.pierceCount>0){bullet.pierceCount--;if(bullet.pierceCount<=0)bullet.destroy();}else bullet.destroy();
  enemy.hp-=dmg;
  this.shotsHit++;
  SFX.hit();
  this.add.circle(enemy.x,enemy.y,5,0xffff00,0.8).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
  if(enemy.active){enemy.setTintFill(0xffffff);this.time.delayedCall(50,()=>{if(enemy.active&&!this.frozen)enemy.clearTint();});}
  if(enemy.hp<=0)this.killEnemy(enemy);
 }
   killEnemy(enemy){
    const pts=enemy.type==='boss'?1000:enemy.type==='mothership'?500:enemy.type==='elite'?80:enemy.type==='hunter'?50:10;
    this.explode(enemy.x,enemy.y,enemy.type==='boss'?0xff2200:0xff8800);
    SFX.explode(enemy.type==='boss'||enemy.type==='mothership'||enemy.type==='elite');
    if(enemy.type==='boss'){this.cameras.main.shake(400,0.014);vib([0,60,40,120]);}
    else if(enemy.type==='mothership'||enemy.type==='elite'){this.cameras.main.shake(160,0.007);vib(35);}
    else{this.cameras.main.shake(70,0.003);vib(12);}
  this.score+=Math.round(pts*(this.x2?2:1)*this.diff.score);this.scoreText.setText('PUNTOS '+this.score);
  if(enemy.type==='mothership'||enemy.type==='boss'||Math.random()<0.18)this.spawnItem(enemy.x,enemy.y);
  const wasBoss=enemy.type==='boss',wasWave=enemy.isWave;enemy.destroy();
  if(wasWave){this.killedEnemies++;this.levelKills++;this.updateProgressUI();}
  if(wasBoss){this.bossAlive=false;this.finishLevel();return;}
  this.checkLevelProgress();
 }
 mineHit(mine,enemy){mine.destroy();this.explode(mine.x,mine.y,0xff8800);enemy.hp-=3;if(enemy.hp<=0)this.killEnemy(enemy);}
 hitPlayer(ship,obj){
  if(!this.alive||this.invincible)return;
  if(this.reflect&&obj.texture&&obj.texture.key==='ebullet'){obj.destroy();const b=this.bullets.create(ship.x,ship.y-20,'bullet');b.setVelocityY(-420);return;}
  if(this.hasShield){  this.cameras.main.shake(200,0.01);
  this.cameras.main.flash(180,140,0,0);
  this.hasShield=false;this.shieldImg.setVisible(false);this.explode(obj.x,obj.y,0x00ffff);if(obj.texture&&obj.texture.key!=='ship')obj.destroy();return;}
  if(obj.texture&&obj.texture.key==='ebullet')obj.destroy();
  this.explode(this.ship.x,this.ship.y,0x00d4ff);
  SFX.playerHit();
  vib([0,120,60,120]);
  this.cameras.main.shake(260,0.014);
  this.cameras.main.flash(220,160,0,0);

 // ---------- LOOP ----------
 update(time,delta){
  this.stars.forEach(s=>{if(!s.warp){s.y+=s.spd*delta/1000;if(s.y>H){s.y=-4;s.x=Phaser.Math.Between(0,W);}}});
  this.decorObjs.forEach(o=>{
   if(o.isComet){o.y+=o.speed*delta/1000;o.x+=o.speed*0.5*delta/1000;if(o.y>H+40||o.x>W+60){o.y=Phaser.Math.Between(-120,-20);o.x=Phaser.Math.Between(-40,W);}}
   else{o.y+=(o.dvy||0)*delta/1000;o.x+=(o.dvx||0)*delta/1000;if(o.drot)o.rotation+=o.drot*delta/1000;
    if(o.y>H+120){o.y=-120;o.x=Phaser.Math.Between(0,W);} if(o.y<-260){o.y=H+120;}}
  });

  if(this.isClient){ this.clientUpdate(time,delta); return; }
  if(!this.alive)return;

  if(this.alive){
   this.ship.x=Phaser.Math.Clamp(this.ship.x,20,W-20);
   this.ship.y=Phaser.Math.Clamp(this.ship.y,40,H-20);
  }
  this.shieldImg.setPosition(this.ship.x,this.ship.y);
  this.ship.setAlpha(this.invincible?0.5+Math.sin(time/80)*0.5:1);

  // aliado
  if(this.allyActive&&this.ally.visible){
   this.ally.x+=(this.ship.x-46-this.ally.x)*0.06;this.ally.y+=(this.ship.y-16-this.ally.y)*0.06;
   this.allyShootTimer=(this.allyShootTimer||0)+delta;
   if(this.allyShootTimer>320){this.allyShootTimer=0;const b=this.bullets.create(this.ally.x,this.ally.y-10,'bullet').setVelocityY(-500);b.scale=0.7;}
  }

  // enemigos
  this.enemies.getChildren().forEach(e=>{
   if(!e.active)return;
   if(!this.frozen)e.y+=e.speed*delta/1000;
   if(e.type==='drone')e.x+=Math.sin(time/300+e.getData('phase'))*1.5;
   if(e.type==='mothership'||e.type==='boss'){
    const dir=e.getData('dir');e.x+=dir*60*delta/1000;
    if(e.x>W-40)e.setData('dir',-1);if(e.x<40)e.setData('dir',1);
    let st=e.getData('shootTimer')+delta;    const sd=(e.type==='boss'?700:1600)*this.diff.efire;
    if(st>sd){st=0;if(e.type==='boss'){    for(let k=-2;k<=2;k++){const b=this.ebullets.create(e.x,e.y+20,'ebullet');b.setVelocity(k*80*this.diff.ebullet,260*this.diff.ebullet);}}else{    const b=this.ebullets.create(e.x,e.y+20,'ebullet');b.setVelocityY(180*this.diff.ebullet);}SFX.enemyShoot(e.type==='boss');}
    e.setData('shootTimer',st);
   }
   if(e.y>H+50){if(e.isWave){this.killedEnemies++;this.updateProgressUI();this.checkLevelProgress();}e.destroy();}
  });

  // balas teledirigidas / zigzag
  this.bullets.getChildren().forEach(b=>{
   if(!b.active)return;
   if(b.homing){let nearest=null,nd2=1e9;this.enemies.getChildren().forEach(e=>{const d=Phaser.Math.Distance.Between(b.x,b.y,e.x,e.y);if(d<nd2){nd2=d;nearest=e;}});
    if(nearest&&nd2<320){const a=Phaser.Math.Angle.Between(b.x,b.y,nearest.x,nearest.y);const cur=Phaser.Math.Angle.Between(0,0,b.body.velocity.x,b.body.velocity.y);const na=Phaser.Math.Angle.RotateTo(cur,a,0.07);const sp=b.body.velocity.length();b.setVelocity(Math.cos(na)*sp,Math.sin(na)*sp);}
   }
   if(b.zigzag)b.x+=Math.sin(time/60+b.y/40)*3;
  });

  // imán
  if(this.magnet){this.items.getChildren().forEach(i=>{const d=Phaser.Math.Distance.Between(i.x,i.y,this.ship.x,this.ship.y);if(d<220){const a=Phaser.Math.Angle.Between(i.x,i.y,this.ship.x,this.ship.y);i.x+=Math.cos(a)*4;i.y+=Math.sin(a)*4;}});}

  // limpieza
  this.bullets.getChildren().forEach(b=>{if(b.y<-30)b.destroy();});
  this.ebullets.getChildren().forEach(b=>{if(b.y>H+30||b.y<-30||b.x<-30||b.x>W+30)b.destroy();});
  this.items.getChildren().forEach(i=>{if(i.y>H+30)i.destroy();});

  // dibujar aliados remotos (host) + fuego automático
  if(this.isHost){
   this.remoteFireTimer=(this.remoteFireTimer||0)+delta;
   const shouldFire=this.remoteFireTimer>190;
   if(shouldFire)this.remoteFireTimer=0;
   Object.keys(remoteInputs).forEach(pid=>{
    const r=remoteInputs[pid];
    if(!r.sprite){r.sprite=this.add.image(r.x,r.y,'ship_'+(r.ship||'viper')).setScale(0.8).setDepth(11).setAlpha(0.95);}
    r.sprite.x+=(r.x-r.sprite.x)*0.3;r.sprite.y+=(r.y-r.sprite.y)*0.3;
    r.sprite.setVisible(r.alive!==false);
    // El compañero dispara automáticamente
    if(shouldFire && r.alive!==false && !this.levelDone){
     const b=this.bullets.create(r.x,r.y-18,'bullet');b.setDepth(5);b.setVelocityY(-480);b.damage=1;
    }
   });
  }
 }

 // ---------- RED ----------
 broadcastWorld(){
  if(!hostConns.length)return;
  const snap={score:this.score,level:this.levelIdx,lives:this.lives,
   total:this.totalEnemies,killed:this.killedEnemies,boss:this.bossSpawned,
   enemies:[],ebullets:[],items:[],pbullets:[],players:{}};
  this.enemies.getChildren().forEach(e=>snap.enemies.push([Math.round(e.x),Math.round(e.y),e.type,e.hp]));
  this.ebullets.getChildren().forEach(b=>snap.ebullets.push([Math.round(b.x),Math.round(b.y)]));
  this.bullets.getChildren().forEach(b=>snap.pbullets.push([Math.round(b.x),Math.round(b.y)]));
  this.items.getChildren().forEach(i=>snap.items.push([Math.round(i.x),Math.round(i.y),i.texture.key]));
  snap.players[myPeerId]=[Math.round(this.ship.x),Math.round(this.ship.y),this.shipKey,this.lives];
  Object.keys(remoteInputs).forEach(pid=>{const r=remoteInputs[pid];snap.players[pid]=[Math.round(r.x),Math.round(r.y),r.ship,r.lives];});
  hostConns.forEach(c=>{if(c.open){try{c.send({t:'world',s:snap});}catch(e){}}});
 }
 clientSend(){
  if(myConn&&myConn.open){try{myConn.send({t:'input',x:Math.round(this.ship.x),y:Math.round(this.ship.y),ship:this.shipKey,alive:this.alive,lives:this.lives});}catch(e){}}
 }
 clientUpdate(time,delta){
  if(this.alive&&!this.arriving){
   this.ship.x=Phaser.Math.Clamp(this.ship.x,20,W-20);
   this.ship.y=Phaser.Math.Clamp(this.ship.y,40,H-20);
  }
  if(!this.netGfx)return;
  const g=this.netGfx;g.clear();
  const snap=worldSnapshot;if(!snap)return;
  // enemigos
  const col={drone:0xff6600,hunter:0xaa00ff,elite:0xff0088,mothership:0xff0044,boss:0xff2200};
  snap.enemies.forEach(e=>{
   const sz=e[2]==='boss'?26:e[2]==='mothership'?20:e[2]==='elite'?14:e[2]==='hunter'?16:12;
   g.fillStyle(col[e[2]]||0xff8800,1);g.fillRect(e[0]-sz/2,e[1]-sz/2,sz,sz);
   g.lineStyle(1,0xffffff,0.4);g.strokeRect(e[0]-sz/2,e[1]-sz/2,sz,sz);
  });
  // balas enemigas
  g.fillStyle(0xff4444,1);snap.ebullets.forEach(b=>{g.fillCircle(b[0],b[1],4);});
  // balas de jugadores (compañeros disparando en vivo)
  g.fillStyle(0x66ffcc,1);(snap.pbullets||[]).forEach(b=>{g.fillRect(b[0]-1.5,b[1]-7,3,14);});
  snap.items.forEach(it=>{const d=ITEM_TYPES.find(x=>x.key===it[2]);g.fillStyle(d?d.color:0xffffff,1);g.fillRect(it[0]-9,it[1]-9,18,18);});
  // jugadores remotos como naves reales, más pequeñas
  if(!this.clientShips)this.clientShips={};
  const seen={};
  Object.keys(snap.players).forEach(pid=>{
   if(pid===myPeerId)return;const p=snap.players[pid];seen[pid]=1;
   let sp=this.clientShips[pid];
   if(!sp){sp=this.add.image(p[0],p[1],'ship_'+(p[2]||'viper')).setScale(0.6).setDepth(11).setAlpha(0.95);this.clientShips[pid]=sp;}
   sp.setTexture('ship_'+(p[2]||'viper'));
   sp.x+=(p[0]-sp.x)*0.35;sp.y+=(p[1]-sp.y)*0.35;
  });
  Object.keys(this.clientShips).forEach(pid=>{if(!seen[pid]){this.clientShips[pid].destroy();delete this.clientShips[pid];}});
  // HUD
  this.scoreText.setText('PUNTOS '+snap.score);this.livesText.setText('VIDAS '+snap.lives);
  const L=LEVELS[Math.min(snap.level,LEVELS.length-1)];
  this.levelText.setText('NIVEL '+(snap.level+1)+'/20 · '+L.name);
  this.progressText.setText('Enemigos '+Math.max(0,snap.total-snap.killed)+'/'+snap.total+(snap.boss?' · ¡JEFE!':''));
 }
}

function newUserId(){const el=document.getElementById('user-id');if(!el)return;el.value='';el.disabled=false;userId='';godMode=false;localStorage.removeItem('snova_uid');el.focus();}
function delUserId(){if(!userId)return;localStorage.removeItem('snova_uid');userId='';godMode=false;const el=document.getElementById('user-id');if(el){el.value='';el.disabled=false;}document.getElementById('status-msg').textContent='ID borrado';}
const su=localStorage.getItem('snova_uid');if(su){userId=su.toUpperCase();const el2=document.getElementById('user-id');if(el2){el2.value=userId;el2.disabled=true;}  godMode=(userId==='SGBORBOLLA');}

// ===== MENU HTML =====
function renderShipGrid(id){ const grid=document.getElementById(id);if(!grid)return;grid.innerHTML='';
 SHIPS.forEach((s,i)=>{
  const c=document.createElement('div');c.className='ship-card'+(i===selectedShipIdx?' selected':'');
  c.innerHTML='<div class="icon" style="color:#'+s.color.toString(16).padStart(6,'0')+'">'+s.icon+'</div><div>'+s.name+'</div><div class="stat">POT '+s.power+'</div><div class="stat">VEL '+Math.floor(s.speed/10)+'</div>';
  c.onclick=()=>{selectedShipIdx=i;Array.from(grid.children).forEach(x=>x.classList.remove('selected'));c.classList.add('selected');};
  grid.appendChild(c);
 });
}
function showShipSelect(role){
 netRole=role;
 MUSIC.play('select');
 document.getElementById('menu-buttons').style.display='none';
 document.getElementById('coop-wait').style.display='none';
 document.getElementById('join-input').style.display='none';
 document.getElementById('ship-select').style.display='block';
 renderShipGrid('ship-grid');
}
function confirmShip(){
  if(!userId){const el=document.getElementById('user-id');if(el)el.focus();document.getElementById('status-msg').textContent='Ingresa tu ID primero';return;}
  MUSIC.play('level');
  document.getElementById('menu-overlay').style.display='none';
  game.scene.stop('Menu');
  game.scene.start('Game',{level:0,score:0,lives:5,shipKey:SHIPS[selectedShipIdx].key});
}
function hostGame(){
 netRole='host';
 const code=Math.random().toString(36).substring(2,8).toUpperCase();
 document.getElementById('menu-buttons').style.display='none';
 const rd=document.getElementById('room-code-display');
 rd.style.display='block';rd.textContent='CÓDIGO: '+code;
 document.getElementById('coop-wait').style.display='block';
 document.getElementById('status-msg').textContent='Esperando jugadores... comparte el código';
 myPeerId='HOST';
 peer=new Peer('supernova-'+code,{debug:0});
 peer.on('connection',conn=>{
  conn.on('data',data=>{ if(data.t==='input'){remoteInputs[conn.peer]=remoteInputs[conn.peer]||{x:200,y:600,ship:'viper',alive:true,lives:5};Object.assign(remoteInputs[conn.peer],{x:data.x,y:data.y,ship:data.ship,alive:data.alive,lives:data.lives});} });
  conn.on('open',()=>{ if(hostConns.length<5){hostConns.push(conn);updatePlayerList();} });
  conn.on('close',()=>{hostConns=hostConns.filter(c=>c!==conn);delete remoteInputs[conn.peer];updatePlayerList();});
 });
 peer.on('error',err=>{document.getElementById('status-msg').textContent='Error: '+err.type;});
}
function showJoin(){
 document.getElementById('menu-buttons').style.display='none';
 const inp=document.getElementById('join-input');inp.style.display='block';inp.focus();
 document.getElementById('status-msg').textContent='Ingresa el código del anfitrión';
 inp.onkeydown=e=>{ if(e.key==='Enter'){
  const code=e.target.value.toUpperCase().trim();if(code.length<4)return;
  document.getElementById('status-msg').textContent='Conectando...';
  peer=new Peer({debug:0});
  peer.on('open',()=>{ myPeerId=peer.id;
   myConn=peer.connect('supernova-'+code,{reliable:true});
   myConn.on('open',()=>{ netRole='client';
    document.getElementById('status-msg').textContent='¡Conectado! Elige tu nave';
    inp.style.display='none';
    showShipSelect('client');
   });
   myConn.on('data',data=>{ if(data.t==='world')worldSnapshot=data.s; });
  });
  peer.on('error',err=>{document.getElementById('status-msg').textContent='Error: '+err.type;});
 }};
}
function updatePlayerList(){document.getElementById('player-list').textContent='Jugadores: '+(hostConns.length+1)+'/6';}
</script>
