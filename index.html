<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SUPERNOVA</title>
<script>
window.__errs=[];
function __showErr(msg){
  try{
    window.__errs.push(msg);
    try{ (new Image()).src='/__err?m='+encodeURIComponent(String(msg).slice(0,300))+'&_='+Date.now(); }catch(e){}
    var el=document.getElementById('err-overlay');
    if(!el){ el=document.createElement('div'); el.id='err-overlay';
      el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:rgba(120,0,0,0.94);color:#fff;font:11px monospace;padding:8px;white-space:pre-wrap;max-height:45%;overflow:auto;border-bottom:2px solid #ff4444;';
      el.onclick=function(){ el.style.display='none'; };
      (document.body||document.documentElement).appendChild(el);
    }
    el.textContent='\u26a0 ERROR (toca para ocultar)\n'+window.__errs.slice(-3).join('\n---\n');
  }catch(e){}
}
window.addEventListener('error',function(e){ __showErr((e.message||'error')+' @ '+String(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno); });
window.addEventListener('unhandledrejection',function(e){ __showErr('Promise: '+((e.reason&&e.reason.message)||e.reason)); });
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:fixed;top:0;left:0;right:0;bottom:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#game-container{width:100%;height:100%;position:fixed;top:0;left:0;display:flex;align-items:center;justify-content:center;background:#000;}
#game-container canvas{display:block;touch-action:none;}
#menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(rgba(6,12,24,0.62),rgba(0,0,0,0.82));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:1000;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;color:#fff;}
#menu-overlay.hidden{display:none;}
.menu-title{font-size:clamp(30px,7vw,52px);color:#00d4ff;text-shadow:0 0 20px #00d4ff,0 0 40px #0088ff,0 0 60px #0044aa;letter-spacing:6px;margin:6px 0 2px;animation:titlePulse 2s ease-in-out infinite;font-weight:bold;}
@keyframes titlePulse{0%,100%{text-shadow:0 0 20px #00d4ff,0 0 40px #0088ff;}50%{text-shadow:0 0 30px #00ffff,0 0 60px #00aaff,0 0 80px #0066ff;}}
.menu-subtitle{font-size:clamp(9px,1.8vw,12px);color:#4488aa;letter-spacing:3px;margin-bottom:12px;}
.menu-section{margin:5px 0;text-align:center;width:100%;max-width:420px;}
.menu-label{font-size:clamp(9px,1.6vw,11px);color:#88ccdd;margin-bottom:4px;letter-spacing:2px;}
.diff-grid,.ship-select-grid{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
.diff-btn,.ship-btn{padding:7px 12px;background:rgba(0,100,150,0.2);border:1px solid #00aacc;color:#88ddee;font-family:'Courier New',monospace;font-size:clamp(9px,1.5vw,11px);cursor:pointer;border-radius:4px;transition:all 0.2s;letter-spacing:1px;animation:navIn 0.4s ease both;}
@keyframes navIn{from{opacity:0;transform:translateY(-16px) scale(0.82);}to{opacity:1;transform:translateY(0) scale(1);}}
.ship-btn.picked{animation:pickPop 0.45s ease;}
@keyframes pickPop{0%{transform:scale(1);}40%{transform:scale(1.22) rotate(-4deg);}70%{transform:scale(0.95) rotate(3deg);}100%{transform:scale(1);}}
#resume-info{font-size:10px;color:#ffdd44;letter-spacing:1px;margin-top:6px;min-height:12px;text-align:center;}
.coop-section,.menu-section,.user-section,.menu-title,.menu-subtitle,#start-btn{position:relative;z-index:1;}
.diff-btn:hover,.ship-btn:hover{background:rgba(0,180,220,0.3);border-color:#00ffff;color:#fff;}
.diff-btn.active,.ship-btn.active{background:rgba(0,200,255,0.4);border-color:#00ffff;color:#fff;box-shadow:0 0 10px rgba(0,200,255,0.5);}
.ship-btn canvas{display:block;margin:0 auto 3px;image-rendering:pixelated;}
.coop-section{margin-top:8px;padding:8px;background:rgba(0,50,80,0.3);border:1px solid #004466;border-radius:6px;width:100%;max-width:420px;}
.coop-row{display:flex;gap:5px;justify-content:center;align-items:center;margin:4px 0;flex-wrap:wrap;}
.coop-input{padding:5px 8px;background:rgba(0,30,50,0.8);border:1px solid #006688;color:#00ddff;font-family:'Courier New',monospace;font-size:11px;border-radius:3px;width:100px;text-align:center;letter-spacing:2px;}
.coop-btn{padding:5px 10px;background:rgba(0,100,150,0.3);border:1px solid #00aacc;color:#88ddee;font-family:'Courier New',monospace;font-size:10px;cursor:pointer;border-radius:3px;transition:all 0.2s;}
.coop-btn:hover{background:rgba(0,180,220,0.4);color:#fff;}
#room-code-display{font-size:13px;color:#ffdd44;letter-spacing:2px;margin:3px 0;}
#player-list,#coop-status{font-size:10px;color:#448888;margin-top:3px;min-height:12px;}
.user-section{margin-top:6px;padding:6px;background:rgba(0,50,80,0.2);border:1px solid #004466;border-radius:4px;width:100%;max-width:420px;font-size:10px;color:#88aacc;}
.user-section input{padding:3px 6px;background:rgba(0,30,50,0.8);border:1px solid #006688;color:#00ddff;font-family:monospace;font-size:10px;border-radius:2px;width:140px;}
.user-section button{padding:3px 8px;background:rgba(0,100,150,0.3);border:1px solid #00aacc;color:#88ddee;font-family:monospace;font-size:9px;cursor:pointer;border-radius:2px;margin-left:3px;}
#start-btn{margin-top:10px;padding:10px 36px;background:linear-gradient(180deg,#00cc88,#008855);border:2px solid #00ffaa;color:#fff;font-family:'Courier New',monospace;font-size:clamp(13px,2.3vw,17px);font-weight:bold;cursor:pointer;border-radius:6px;letter-spacing:3px;transition:all 0.2s;box-shadow:0 0 20px rgba(0,255,170,0.3);}
#start-btn:hover{background:linear-gradient(180deg,#00eebb,#00aa77);box-shadow:0 0 30px rgba(0,255,170,0.6);transform:scale(1.05);}
#credits-btn{margin-top:10px;padding:8px 26px;background:linear-gradient(180deg,#5566cc,#3344aa);border:2px solid #88aaff;color:#fff;font-family:'Courier New',monospace;font-size:clamp(12px,2.1vw,15px);font-weight:bold;cursor:pointer;border-radius:6px;letter-spacing:2px;transition:all 0.2s;box-shadow:0 0 16px rgba(120,150,255,0.3);position:relative;z-index:1;}
#credits-btn:hover{background:linear-gradient(180deg,#6677dd,#4455bb);transform:scale(1.05);}
#continue-btn{margin-top:10px;padding:11px 36px;background:linear-gradient(180deg,#ffcc00,#cc8800);border:2px solid #ffee66;color:#1a1400;font-family:'Courier New',monospace;font-size:clamp(13px,2.3vw,17px);font-weight:bold;cursor:pointer;border-radius:6px;letter-spacing:2px;transition:all 0.2s;box-shadow:0 0 22px rgba(255,200,0,0.45);animation:titlePulse 2s ease-in-out infinite;}
#continue-btn:hover{background:linear-gradient(180deg,#ffe066,#ddaa00);transform:scale(1.05);}
#controls-hint{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:9px;color:#446688;z-index:500;pointer-events:none;text-align:center;}
#mute-btn{position:absolute;top:calc(6px + env(safe-area-inset-top));right:10px;z-index:1200;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;background:rgba(0,60,90,0.55);border:1px solid #00aacc;border-radius:50%;color:#88ddee;-webkit-user-select:none;user-select:none;transition:all 0.2s;}
#mute-btn:active{transform:scale(0.92);}
#mute-btn.muted{background:rgba(90,0,0,0.55);border-color:#cc4444;color:#ff8888;}
#pause-btn{position:fixed;top:calc(6px + env(safe-area-inset-top));right:10px;z-index:900;width:40px;height:40px;padding:0;display:none;align-items:center;justify-content:center;font-size:14px;line-height:1;letter-spacing:1px;cursor:pointer;background:rgba(0,60,90,0.55);border:1px solid #00aacc;border-radius:50%;color:#88ddee;-webkit-user-select:none;user-select:none;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
#pause-btn.show{display:flex;}
#pause-btn:active{transform:scale(0.9);}
#bomb-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;z-index:900;width:62px;height:62px;padding:0;display:none;align-items:center;justify-content:center;font-size:28px;line-height:1;cursor:pointer;background:rgba(90,30,10,0.6);border:2px solid #ff8844;border-radius:50%;color:#ffddaa;-webkit-user-select:none;user-select:none;transition:all 0.15s;-webkit-tap-highlight-color:transparent;box-shadow:0 0 14px rgba(255,120,40,0.4);}
#bomb-btn.show{display:flex;}
#bomb-btn:active{transform:scale(0.9);background:rgba(150,60,20,0.8);}
#bomb-btn.empty{opacity:0.35;border-color:#885555;color:#aa8888;box-shadow:none;}
#bomb-btn .bc{position:absolute;right:-2px;bottom:-2px;background:#ff5500;color:#fff;font-size:12px;font-weight:bold;font-family:monospace;border-radius:50%;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 3px;border:1px solid #fff;}
#pause-overlay{position:fixed;inset:0;z-index:1400;background:radial-gradient(ellipse at center,rgba(6,12,24,0.9),rgba(0,0,0,0.95));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;color:#fff;font-family:'Courier New',monospace;}
#pause-overlay.hidden{display:none;}
#pause-overlay .pause-title{font-size:clamp(30px,7vw,52px);color:#00d4ff;letter-spacing:8px;text-shadow:0 0 20px #00d4ff,0 0 40px #0088ff;font-weight:bold;margin-bottom:14px;}
#pause-overlay .pause-item{width:min(78vw,300px);padding:14px 20px;font-size:clamp(14px,3.4vw,19px);font-family:inherit;font-weight:bold;letter-spacing:2px;color:#88ddee;background:rgba(0,100,150,0.25);border:2px solid #00aacc;border-radius:8px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
#pause-overlay .pause-item:active{transform:scale(0.96);background:rgba(0,150,200,0.4);}
#pause-overlay #pause-resume{border-color:#00ffaa;color:#aaffdd;background:rgba(0,120,80,0.3);}

/* ===== INTRO / PANTALLA DE APERTURA ===== */
#intro-overlay{position:fixed;inset:0;z-index:1500;background:radial-gradient(ellipse at center,#0a0520 0%,#000 100%);overflow:hidden;transition:opacity .6s ease,transform .6s ease;}
#intro-overlay.intro-hide{opacity:0;transform:scale(1.06);pointer-events:none;}
#intro-overlay .nebula{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(180,50,255,0.25) 0%,transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(50,100,255,0.25) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(255,80,180,0.15) 0%,transparent 60%);animation:introNebulaShift 20s ease-in-out infinite alternate;filter:blur(20px);}
@keyframes introNebulaShift{0%{transform:scale(1) rotate(0deg);opacity:.8;}100%{transform:scale(1.15) rotate(5deg);opacity:1;}}
#intro-overlay .stars{position:absolute;inset:0;}
#intro-overlay .star{position:absolute;background:#fff;border-radius:50%;animation:introTwinkle 3s ease-in-out infinite;}
@keyframes introTwinkle{0%,100%{opacity:.3;transform:scale(1);}50%{opacity:1;transform:scale(1.3);}}
#intro-overlay .supernova{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(78vw,400px);height:min(78vw,400px);z-index:2;}
#intro-overlay .supernova-core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,#ffee88 10%,#ffaa00 30%,#ff4400 60%,transparent 80%);animation:introCorePulse 2s ease-in-out infinite;filter:blur(2px);}
@keyframes introCorePulse{0%,100%{transform:scale(.9);opacity:.9;}50%{transform:scale(1.1);opacity:1;}}
#intro-overlay .supernova-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,200,100,.6);animation:introRingExpand 3s ease-out infinite;}
#intro-overlay .supernova-ring:nth-child(2){animation-delay:1s;}
#intro-overlay .supernova-ring:nth-child(3){animation-delay:2s;}
@keyframes introRingExpand{0%{transform:scale(.3);opacity:1;}100%{transform:scale(1.5);opacity:0;}}
#intro-overlay .supernova-rays{position:absolute;inset:0;animation:introRaysRotate 30s linear infinite;}
@keyframes introRaysRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
#intro-overlay .ship{position:absolute;top:0;z-index:5;animation:introFlyUp linear infinite;}
#intro-overlay .ship canvas{display:block;width:100%;height:auto;position:relative;z-index:1;}
#intro-overlay .ship .exhaust{position:absolute;left:50%;top:86%;width:42%;height:130%;transform:translateX(-50%);transform-origin:top center;background:linear-gradient(180deg,#fff 0%,#ffe98a 18%,#ff9800 45%,#ff4400 78%,transparent 100%);border-radius:45% 45% 40% 40%;filter:blur(3px);opacity:.9;z-index:0;pointer-events:none;animation:introExhaust .18s ease-in-out infinite alternate;}
@keyframes introExhaust{0%{transform:translateX(-50%) scaleY(.8) scaleX(1.05);opacity:.75;}100%{transform:translateX(-50%) scaleY(1.25) scaleX(.78);opacity:1;}}
@keyframes introFlyUp{0%{transform:translateY(108vh);}100%{transform:translateY(-55vh);}}
#intro-overlay .ship-1{left:8%;width:clamp(56px,14vw,104px);animation-duration:7s;animation-delay:0s;}
#intro-overlay .ship-2{left:31%;width:clamp(60px,14vw,110px);animation-duration:9s;animation-delay:2.4s;}
#intro-overlay .ship-3{left:55%;width:clamp(56px,14vw,104px);animation-duration:8s;animation-delay:5s;}
#intro-overlay .ship-4{left:76%;width:clamp(60px,14vw,110px);animation-duration:10s;animation-delay:1.1s;}
#intro-overlay .asteroid{position:absolute;z-index:3;animation:introFloatAsteroid 20s ease-in-out infinite;}
@keyframes introFloatAsteroid{0%,100%{transform:translate(0,0) rotate(0deg);}25%{transform:translate(10px,-15px) rotate(5deg);}50%{transform:translate(-5px,-25px) rotate(-3deg);}75%{transform:translate(-15px,-10px) rotate(8deg);}}
#intro-overlay .laser{position:absolute;height:3px;background:linear-gradient(90deg,transparent,#ff4444,#ff8888,#fff);box-shadow:0 0 8px #ff4444,0 0 16px #ff0000;z-index:4;animation:introLaserShoot 2s ease-in-out infinite;transform-origin:left center;}
@keyframes introLaserShoot{0%{opacity:0;transform:scaleX(0);}30%,70%{opacity:1;transform:scaleX(1);}100%{opacity:0;transform:scaleX(0);}}
#intro-overlay .title-container{position:absolute;top:8%;left:50%;transform:translateX(-50%);text-align:center;z-index:10;width:100%;padding:0 10px;}
#intro-overlay .title{font-size:clamp(44px,13vw,110px);font-weight:900;letter-spacing:8px;background:linear-gradient(180deg,#fff 0%,#e8e8e8 20%,#88aacc 40%,#4466aa 60%,#2244aa 80%,#001133 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px #00d4ff) drop-shadow(0 0 40px #0088ff) drop-shadow(0 4px 0 #001133);animation:introTitleGlow 2s ease-in-out infinite;font-family:'Arial Black',sans-serif;text-shadow:none;}
@keyframes introTitleGlow{0%,100%{filter:drop-shadow(0 0 20px #00d4ff) drop-shadow(0 0 40px #0088ff) drop-shadow(0 4px 0 #001133);}50%{filter:drop-shadow(0 0 30px #00ffff) drop-shadow(0 0 60px #00aaff) drop-shadow(0 0 80px #0066ff) drop-shadow(0 4px 0 #001133);}}
#intro-overlay .subtitle{font-size:clamp(12px,2.6vw,22px);color:#e0e8ff;letter-spacing:6px;margin-top:10px;text-shadow:0 0 10px #00d4ff,0 2px 0 #000;font-weight:bold;}
#intro-overlay .saga-sub{font-size:clamp(10px,2vw,17px);color:#ffd766;letter-spacing:4px;margin-top:8px;text-shadow:0 0 10px #ff8800,0 2px 0 #000;font-weight:bold;}
#intro-overlay .start-btn{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);z-index:20;padding:16px 46px;font-size:clamp(18px,4.4vw,34px);font-weight:bold;letter-spacing:4px;color:#fff;background:linear-gradient(180deg,#00ffcc 0%,#00aaff 100%);border:3px solid #00ffff;border-radius:8px;cursor:pointer;font-family:'Arial Black',sans-serif;text-shadow:0 0 10px #fff,0 2px 0 #005577;box-shadow:0 0 30px rgba(0,255,255,.6),inset 0 0 20px rgba(255,255,255,.3);animation:introBtnPulse 1.5s ease-in-out infinite;transition:transform .15s,box-shadow .2s;-webkit-tap-highlight-color:transparent;}
#intro-overlay .start-btn:hover{transform:translateX(-50%) scale(1.06);box-shadow:0 0 50px rgba(0,255,255,.9),inset 0 0 30px rgba(255,255,255,.5);}
#intro-overlay .start-btn:active{transform:translateX(-50%) scale(.97);}
@keyframes introBtnPulse{0%,100%{box-shadow:0 0 30px rgba(0,255,255,.6),inset 0 0 20px rgba(255,255,255,.3);}50%{box-shadow:0 0 50px rgba(0,255,255,.9),0 0 80px rgba(0,200,255,.5),inset 0 0 30px rgba(255,255,255,.5);}}
#intro-overlay .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:8;}
#intro-overlay .spark{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff,0 0 12px #00d4ff;z-index:6;animation:introSparkFloat 8s linear infinite;}
@keyframes introSparkFloat{0%{transform:translate(0,0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translate(var(--dx),var(--dy));opacity:0;}}
#intro-overlay .audio-hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);z-index:22;font-family:'Courier New',monospace;font-size:clamp(10px,2.4vw,15px);font-weight:bold;letter-spacing:2px;color:#9fe8ff;text-shadow:0 0 8px #08f,0 2px 0 #000;pointer-events:none;animation:introHintBlink 1.5s ease-in-out infinite;}
@keyframes introHintBlink{0%,100%{opacity:.4;}50%{opacity:1;}}
#intro-overlay .audio-hint.hide{display:none;}
</style>
</head>
<body>
<div id="game-container"></div>
<button id="pause-btn" title="Pausa">❚❚</button>
<button id="bomb-btn" title="Bomba">💣<span class="bc" id="bomb-count">0</span></button>
<div id="pause-overlay" class="hidden">
  <div class="pause-title" id="pause-title">PAUSA</div>
  <button class="pause-item" id="pause-resume">▶ CONTINUAR</button>
  <button class="pause-item" id="pause-restart">↻ REINICIAR NIVEL</button>
  <button class="pause-item" id="pause-sound">🔊 SONIDO: SÍ</button>
  <button class="pause-item" id="pause-menu">⌂ MENÚ PRINCIPAL</button>
</div>
<div id="errbox" style="position:fixed;left:0;top:0;right:0;z-index:2000;background:#900;color:#fff;font:12px monospace;line-height:1.35;padding:6px;display:none;white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto;"></div>
<div id="intro-overlay">
  <div class="nebula"></div>
  <div class="stars" id="intro-stars"></div>
  <div class="supernova">
    <div class="supernova-core"></div>
    <div class="supernova-ring"></div>
    <div class="supernova-ring"></div>
    <div class="supernova-ring"></div>
    <svg class="supernova-rays" viewBox="0 0 400 400" style="position:absolute;inset:0;">
      <g stroke="#ffcc44" stroke-width="2" opacity="0.6">
        <line x1="200" y1="200" x2="200" y2="20"/><line x1="200" y1="200" x2="200" y2="380"/>
        <line x1="200" y1="200" x2="20" y2="200"/><line x1="200" y1="200" x2="380" y2="200"/>
        <line x1="200" y1="200" x2="70" y2="70"/><line x1="200" y1="200" x2="330" y2="330"/>
        <line x1="200" y1="200" x2="330" y2="70"/><line x1="200" y1="200" x2="70" y2="330"/>
      </g>
    </svg>
  </div>
  <div class="ship ship-1"><div class="exhaust"></div><canvas data-key="viper" width="44" height="62"></canvas></div>
  <div class="ship ship-2"><div class="exhaust"></div><canvas data-key="falcon" width="44" height="62"></canvas></div>
  <div class="ship ship-3"><div class="exhaust"></div><canvas data-key="phantom" width="44" height="62"></canvas></div>
  <div class="ship ship-4"><div class="exhaust"></div><canvas data-key="titan" width="44" height="62"></canvas></div>

// ===== HELPERS DE DIBUJO =====
const OUT = 0x050810;
function shade(c, f) {
  let r=(c>>16)&255, g=(c>>8)&255, b=c&255;
  r=Math.max(0,Math.min(255,(r*f)|0));
  g=Math.max(0,Math.min(255,(g*f)|0));
  b=Math.max(0,Math.min(255,(b*f)|0));
  return (r<<16)|(g<<8)|b;
}
function gPoly(g, pts, fill, stroke, sw) {
  if (fill!=null) { g.fillStyle(fill,1); g.fillPoints(pts,true); }
  if (stroke!=null) { g.lineStyle(sw||1,stroke,0.9); g.strokePoints(pts,true); }
}
function gPts(arr){ return arr.map(p=>({x:p[0],y:p[1]})); }
function enemyRadius(e){
  if (!e) return 16;
  if (e.bossR) return e.bossR;
  const d=ENEMY_TYPES[e.type]||BOSS_TYPES[e.type];
  return d?d.r:16;
}

// ===== FÁBRICA DE 60 JEFES ÚNICOS =====
function hsl2hex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(1,s)); l=Math.max(0,Math.min(1,l));
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  const to=v=>Math.round((v+m)*255);
  return (to(r)<<16)|(to(g)<<8)|to(b);
}

const BOSS_SIZE={ arrow:[128,106], saucer:[150,82], fortress:[150,92], organic:[126,112], star:[132,112], wide:[152,88], cruiser:[152,102], orb:[122,112], overlord:[220,142] };
function bossSpec(i){
  const final=(i>=59);
  const fam=final?'overlord':BOSS_FAM[i%8];
  const variant=final?0:Math.floor(i/8);
  const hue=(i*47)%360;
  const color=hsl2hex(hue,0.5+((i%3)*0.12),0.42+((i%3)*0.06));
  const dark=hsl2hex(hue,0.62,0.20);
  const accent=hsl2hex((hue+45)%360,0.92,0.6);
  const glow=hsl2hex((hue+180)%360,0.9,0.62);
  const base=BOSS_SIZE[fam]||[140,90];
  const w=base[0]+((i*5)%9)-4;
  const h=base[1]+((i*3)%9)-4;
  return { i, arch:fam, variant, name:BOSS_NAMES[i]||('JEFE '+(i+1)), color, dark, accent, glow, w, h,
    wings:(i*7+3)%6, limbs:(i*5+1)%5, crown:(i*11+2)%6, eyes:final?3:(2+(i%4)), turrets:2+(i%4), final };
}

// ===== HELPERS DE DIBUJO DE JEFES =====
function bossLimb(g,x1,y1,x2,y2,w,col){ g.lineStyle(w,col,1); g.lineBetween(x1,y1,x2,y2); }
function ell(g,x,y,rx,ry){ g.fillEllipse(x,y,rx*2,ry*2); }
function sell(g,x,y,rx,ry){ g.strokeEllipse(x,y,rx*2,ry*2); }
function bossEye(g,x,y,r,ac){ g.fillStyle(0x140a00,1); g.fillCircle(x,y,r); g.fillStyle(ac,1); g.fillCircle(x,y,r*0.62); g.fillStyle(0xffffff,0.9); g.fillCircle(x-r*0.28,y-r*0.28,r*0.28); }

// ===== 8 CHASIS (cada uno se deforma según su variante) =====
function hullArrow(g,s){
  const cx=s.w/2, v=s.variant, sh=0.24+(v%4)*0.03, spread=0.60+(v%2)*0.08;
  const pts=[[cx,s.h*0.05],[cx+s.w*sh,s.h*0.32],[s.w-4,s.h*spread],[cx+s.w*0.22,s.h-4],[cx-s.w*0.22,s.h-4],[4,s.h*spread],[cx-s.w*sh,s.h*0.32]];
  gPoly(g,gPts(pts),s.color,OUT,2.6);
  gPoly(g,gPts([[cx,s.h*0.14],[cx+s.w*sh*0.66,s.h*0.4],[cx+s.w*0.15,s.h-10],[cx-s.w*0.15,s.h-10],[cx-s.w*sh*0.66,s.h*0.4]]),shade(s.color,0.72),null);
}
function hullSaucer(g,s){
  const cx=s.w/2, cy=s.h*0.52, v=s.variant, rx=s.w*0.46, ry=s.h*(0.23+(v%3)*0.03);
  g.fillStyle(s.dark,1); ell(g,cx,cy+ry*0.5,rx*0.96,ry*0.85);
  g.fillStyle(s.color,1); ell(g,cx,cy,rx,ry); g.lineStyle(2.6,OUT,0.9); sell(g,cx,cy,rx,ry);
  g.fillStyle(shade(s.color,0.72),1); ell(g,cx,cy+ry*0.4,rx*0.88,ry*0.4);
  g.fillStyle(shade(s.color,1.28),1); ell(g,cx,cy-ry*(0.5+(v%2)*0.12),rx*0.42,ry*0.6);
  g.fillStyle(s.accent,0.45); ell(g,cx,cy-ry*(0.5+(v%2)*0.12),rx*0.3,ry*0.42);
}
function hullFortress(g,s){
  const cx=s.w/2, cy=s.h/2, v=s.variant, sh=0.30+(v%2)*0.06, bot=s.h*(0.9-(v%3)*0.03);
  const pts=[[cx,s.h*0.1],[cx+s.w*sh,s.h*0.1],[s.w-4,cy],[cx+s.w*sh,bot],[cx-s.w*sh,bot],[4,cy],[cx-s.w*sh,s.h*0.1]];
  gPoly(g,gPts(pts),s.color,OUT,2.8);
  gPoly(g,gPts([[cx,s.h*0.2],[cx+s.w*sh*0.7,s.h*0.2],[cx+s.w*sh*0.7,s.h*0.8],[cx-s.w*sh*0.7,s.h*0.8],[cx-s.w*sh*0.7,s.h*0.2]]),shade(s.color,0.72),null);
  for(const dir of [-1,1]){ const x=cx+dir*s.w*sh*0.8; g.fillStyle(s.dark,1); g.fillRect(x-5,s.h*0.06,10,s.h*0.2); }
}
function hullOrganic(g,s){
  const cx=s.w/2, cy=s.h/2, v=s.variant, lobes=4+(v%4), R=Math.min(s.w*0.44,s.h*0.44), pts=[];
  for(let k=0;k<28;k++){ const a=k*Math.PI/14; const r=R*(1+0.15*Math.cos(lobes*a)); pts.push([cx+Math.cos(a)*r*1.02, cy+Math.sin(a)*r*0.92]); }
  gPoly(g,gPts(pts),s.color,OUT,2.6);
  g.fillStyle(shade(s.color,0.72),1); g.fillCircle(cx,cy,R*0.5);
}
function hullStar(g,s){
  const cx=s.w/2, cy=s.h/2, v=s.variant, points=5+(v%6), R=Math.min(s.w*0.43,s.h*0.44), r=R*(0.34+(v%3)*0.05), pts=[];
  for(let k=0;k<points*2;k++){ const a=k*Math.PI/points-Math.PI/2; const rad=k%2?r:R; pts.push([cx+Math.cos(a)*rad*1.02, cy+Math.sin(a)*rad*0.95]); }
  gPoly(g,gPts(pts),s.color,OUT,2.4);
  g.fillStyle(shade(s.color,0.72),1); g.fillCircle(cx,cy,R*0.42);
}
function hullWide(g,s){
  const cx=s.w/2, cy=s.h*0.5, v=s.variant, bw=s.w*0.44, bh=s.h*(0.32+(v%3)*0.04);
  g.fillStyle(s.color,1); ell(g,cx,cy,bw,bh); g.lineStyle(2.6,OUT,0.9); sell(g,cx,cy,bw,bh);
  g.fillStyle(shade(s.color,0.72),1); ell(g,cx,cy+bh*0.4,bw*0.8,bh*0.5);
}
function hullCruiser(g,s){
  const cx=s.w/2, v=s.variant;
  const hull=[[cx,s.h*(0.05+(v%2)*0.03)],[s.w-8,s.h*0.4],[s.w-4,s.h*0.78],[cx+s.w*0.2,s.h-4],[cx-s.w*0.2,s.h-4],[4,s.h*0.78],[8,s.h*0.4]];
  gPoly(g,gPts(hull),s.color,OUT,2.6);
  gPoly(g,gPts([[cx,s.h*0.16],[cx+s.w*0.16,s.h*0.44],[cx+s.w*0.12,s.h-10],[cx-s.w*0.12,s.h-10],[cx-s.w*0.16,s.h*0.44]]),shade(s.color,0.72),null);
}
function hullOrb(g,s){
  const cx=s.w/2, cy=s.h/2, v=s.variant, R=Math.min(s.w*0.32,s.h*0.4)*(1+(v%3)*0.06);
  g.fillStyle(s.dark,1); g.fillCircle(cx,cy,R); g.fillStyle(s.color,1); g.fillCircle(cx,cy,R*0.9); g.lineStyle(2.6,OUT,0.9); g.strokeCircle(cx,cy,R);
  g.fillStyle(shade(s.color,1.3),0.5); g.fillCircle(cx-R*0.3,cy-R*0.3,R*0.34);
}

function drawBossLimbs(g,s){

function drawBossCrown(g,s){

function drawBossFace(g,s){

function drawBossDamage(g,s,dl){
  const cx=s.w/2, cy=s.h/2, w=s.w, h=s.h;
  if(dl>=1){ g.lineStyle(2,0x111122,0.9); g.lineBetween(cx-w*0.12,cy-h*0.16,cx+w*0.04,cy-h*0.2); g.lineBetween(cx+w*0.06,cy,cx+w*0.18,cy+h*0.1); }
  if(dl>=2){ g.lineStyle(2.2,0x101018,0.95); g.lineBetween(cx-w*0.28,cy-h*0.08,cx-w*0.2,cy-h*0.24); g.lineBetween(cx+w*0.28,cy-h*0.08,cx+w*0.22,cy-h*0.24); g.fillStyle(0xff3300,0.28); g.fillCircle(cx-w*0.26,cy+h*0.16,6); g.fillStyle(0x080811,0.5); g.fillRect(cx-w*0.32,cy+h*0.08,w*0.12,h*0.14); }
  if(dl>=3){ g.lineStyle(2.4,0x0b0b14,0.98); g.lineBetween(cx-w*0.3,cy+h*0.36,cx-w*0.42,cy+h*0.16); g.lineBetween(cx+w*0.3,cy+h*0.36,cx+w*0.42,cy+h*0.16); g.fillStyle(0x040409,0.7); g.fillRect(cx-w*0.08,cy-h*0.44,w*0.16,h*0.12); g.fillStyle(0xff2200,0.3); for(let k=0;k<3;k++){ g.fillCircle(cx+(k-1)*w*0.14,cy+h*0.18,4); } }
}

const HULL_DRAW={ arrow:hullArrow, saucer:hullSaucer, fortress:hullFortress, organic:hullOrganic, star:hullStar, wide:hullWide, cruiser:hullCruiser, orb:hullOrb };
function drawBossFromSpec(g,s,dl=0){
  const cx=s.w/2, cy=s.h/2;
  if(s.arch==='overlord'){ drawBossOverlord(g,s); drawBossDamage(g,s,dl); return; }
  drawBossWings(g,s);
  const hull=HULL_DRAW[s.arch]||hullArrow;
  const sc=(s.wings?0.8:1);
  const canT=typeof g.save==='function' && typeof g.translateCanvas==='function' && typeof g.scaleCanvas==='function' && typeof g.restore==='function';
  const body=function(){ hull(g,s); drawBossLimbs(g,s); drawBossCrown(g,s); drawBossFace(g,s); };
  if(sc<1 && canT){ g.save(); g.translateCanvas(cx,cy); g.scaleCanvas(sc,sc); g.translateCanvas(-cx,-cy); body(); g.restore(); }
  else body();
  drawBossDamage(g,s,dl);
}

// ===== AJUSTE GLOBAL: oleadas con huecos + jefe único por nivel =====
LEVELS.forEach((L,i)=>{
  const sp=BOSS_SPECS[i];
  L.boss=true;
  L.bossType='boss_'+i;
  L.bossName=sp.name;
  L.wave=Math.max(3,Math.min(6,3+Math.floor(i/14)));
  L.waveGap=Math.max(1300,3600-i*38);
  L.maxAlive=Math.max(4,Math.min(9,4+Math.floor(i/10)));
  L.spawn=Math.max(430,Math.min(1150,L.spawn));
  L.count=Math.max(L.wave+2,Math.round(14+i*1.1));
  L.maxEBullets=Math.max(9,Math.min(18,9+Math.floor(i/6)));
});

const AUDIO = (() => {
  let ctx=null, sfxGain=null, musicGain=null, enabled=true;
  let musicTimer=null, musicStep=0, musicCfg=null, currentTrack=-1;
  try { enabled = localStorage.getItem('snova_audio') !== 'off'; } catch(e){}
  function init(){
    if (ctx) return ctx;
    try {
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      sfxGain = ctx.createGain(); sfxGain.gain.value=0.35; sfxGain.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value=1.1;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value=-14; comp.knee.value=24; comp.ratio.value=5; comp.attack.value=0.003; comp.release.value=0.25;
      musicGain.connect(comp); comp.connect(ctx.destination);
      return ctx;
    } catch(e){ enabled=false; return null; }
  }
  function resume(){ if (ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type,vol,dest,slideTo){
    if (!enabled||!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain(), t=ctx.currentTime;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
    g.gain.setValueAtTime(vol||0.2,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(dest||sfxGain);
    o.start(t); o.stop(t+dur);
  }
  function noise(dur,vol,dest){
    if (!enabled||!ctx) return;
    const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=buf;
    const g=ctx.createGain(); const t=ctx.currentTime;
    g.gain.setValueAtTime(vol||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(g); g.connect(dest||sfxGain); s.start();
  }

    if (!enabled) return;
    init(); resume();

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  function buildTrack(key){
    let g, seed, root, degs;
    if (key<0){
      g=SPECIALS[String(key)]||SPECIALS['-1'];
      seed=(Math.abs(key)*1237+7)>>>0; root=g.root; degs=g.degs.slice();
    } else {
      g=GENRES[((key%GENRES.length)+GENRES.length)%GENRES.length];
      seed=((key*2654435761)>>>0)^0x9e3779b9;
      const r0=mulberry32(seed);
      root=33+Math.floor(r0()*12);
      degs=[]; for (let b=0;b<4;b++) degs.push(Math.floor(r0()*7));
    }
    const rnd=mulberry32(seed);
    const scale=SCALES[g.scales[Math.floor(rnd()*g.scales.length)]];
    const chordOf=(deg)=>{ const out=[]; for (let k=0;k<3;k++){ const x=deg+k; out.push(root+12+scale[x%7]+12*Math.floor(x/7)); } return out; };
    const chords=[0,1,2,3].map(b=>chordOf(degs[b]));
    const bassRoot=[0,1,2,3].map(b=>root+scale[degs[b]]);
    const pad=[0,1,2,3].map(b=>chordOf(degs[b]).map(m=>m+12));
    const lead=new Array(16).fill(null);
    const lp=g.leadProb!=null?g.leadProb:0.35;
    for (let s=0;s<16;s++){ if (rnd()<lp){ const d=Math.floor(rnd()*7); lead[s]=root+24+scale[d]+(rnd()<0.25?12:0); } }
    const bpm=g.bpm[0]+Math.floor(rnd()*(g.bpm[1]-g.bpm[0]+1));
    const stepMs=60/bpm/4*1000;
    let kick=g.kick, snare=g.snare||[], clap=g.clap||[], hat=g.hat||[], openhat=g.openhat||[], pat=g.bassPat, stab=g.stab||[];
    if (key>=0){
      const rr=mulberry32((seed^0x51ed270b)>>>0);
      const mut=(arr,prob)=>{ let a=arr.slice(); for (let s=0;s<16;s++){ if (rr()<prob){ a=a.indexOf(s)>=0?a.filter(x=>x!==s):a.concat(s); } } return a.sort((x,y)=>x-y); };
      kick=mut(kick,0.14); snare=mut(snare,0.12); clap=mut(clap,0.12); hat=mut(hat,0.18); openhat=mut(openhat,0.12); stab=mut(stab,0.16);
    }
    return { g, name:g.name, bpm, stepMs, chords, bassRoot, pad, lead, kick, snare, clap, hat, openhat, pat, stab };
  }

  function playStep(){
    if (!enabled||!ctx||!musicCfg) return;
    if (ctx.state!=='running') return;
    const c=musicCfg, g=c.g, t=ctx.currentTime+0.01;

    const NOTE=m=>440*Math.pow(2,(m-69)/12);
    if (c.kick.includes(step)) kickAt(t);
    if (c.snare.includes(step)) snareAt(t);
    if (c.clap.includes(step)) clapAt(t);
    if (c.hat.includes(step)) noiseAt(t,0.03,0.05,9000);
    if (c.openhat.includes(step)) noiseAt(t,0.14,0.1,7500);
    const bp=c.pat[step%c.pat.length];
    if (bp==='x') toneAt(t,NOTE(c.bassRoot[bar]),g.bassDur,g.bassWave,g.bassVol);
    else if (bp==='o') toneAt(t,NOTE(c.bassRoot[bar]+12),g.bassDur,g.bassWave,g.bassVol);
    if (c.stab.includes(step)) c.chords[bar].forEach(m=>toneAt(t,NOTE(m),g.stabDur,g.chordWave,g.stabVol*1.8));

function unlockAudio(){
  AUDIO.init(); AUDIO.resume();

}

// ===== USER ID / GOD MODE =====
const GOD_ID = 'sgborbolla';
let userId = localStorage.getItem('snova_uid') || '';
let godMode = false;
function isGodUser(){ return userId.trim().toLowerCase() === GOD_ID; }
function godChoice(){ try { return localStorage.getItem('snova_god')==='on'; } catch(e){ return false; } }
function refreshGodMode(){ godMode = isGodUser() && godChoice(); }
function refreshGodUI(){
  const row=document.getElementById('god-row');
  if (!row) return;
  if (isGodUser()){
    row.style.display='block';
    const t=document.getElementById('god-toggle');
    if (t) t.checked=godChoice();
  } else {
    row.style.display='none';
  }
}
function setGodChoice(v){
  try { localStorage.setItem('snova_god', v?'on':'off'); } catch(e){}
  refreshGodMode();
  if (v){ document.getElementById('user-id').disabled=true; }
}
function saveUserId(){
  const el=document.getElementById('user-id');
  const v=el.value.trim();
  if (!v) return;
  userId=v;
  localStorage.setItem('snova_uid',v);
  refreshGodMode();
  el.disabled=true;
  refreshGodUI();
  document.getElementById('status-msg').textContent = isGodUser() ? 'ID guardado: '+v : 'ID guardado: '+v;
}
function newUserId(){
  const el=document.getElementById('user-id');
  if (!el) return;
  el.value=''; el.disabled=false;
  userId=''; godMode=false;
  localStorage.removeItem('snova_uid');
  refreshGodUI();
  el.focus();
}
function delUserId(){
  if (!userId) return;
  localStorage.removeItem('snova_uid');
  userId=''; godMode=false;
  const el=document.getElementById('user-id');
  if (el){ el.value=''; el.disabled=false; }
  refreshGodUI();
  document.getElementById('status-msg').textContent='ID borrado';
}
refreshGodMode();

// ===== PROGRESO GUARDADO (continuar donde lo dejaste) =====
const SAVE_KEY='snova_save';
function getSavedProgress(){
  try {
    const s=localStorage.getItem(SAVE_KEY);
    if (!s) return null;
    const o=JSON.parse(s);
    if (!o || typeof o.levelIdx!=='number') return null;
    return o;
  } catch(e){ return null; }
}
function saveProgress(o){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch(e){} }
function clearProgress(){ try { localStorage.removeItem(SAVE_KEY); } catch(e){} }

// Niveles desbloqueados (el mayor alcanzado)
function getUnlocked(){
  try { const n=parseInt(localStorage.getItem('snova_unlocked')||'0',10); return isNaN(n)?0:n; } catch(e){ return 0; }
}
function setUnlocked(n){
  try { if (n>getUnlocked()) localStorage.setItem('snova_unlocked', String(n)); } catch(e){}
}

// ===== COOPERATIVO PeerJS (host-autoritativo, 2-6 jugadores) =====
const COOP = {
  peer: null,
  isHost: false,
  roomCode: '',
  hostConns: [],
  myConn: null,
  myId: null,
  worldSnapshot: null,
  remoteInputs: {},
  maxPlayers: 6,
  onNet: null,            // callback cliente -> datos (eventos del host)
  onClientJoin: null,     // callback host -> nuevo cliente
  onClientLeave: null,    // callback host -> cliente se va
  mode(){ return this.isHost ? 'host' : (this.myConn && this.myConn.open ? 'client' : 'solo'); },
  init(){
    const hostBtn=document.getElementById('host-btn');
    const joinBtn=document.getElementById('join-btn');
    hostBtn.onclick=()=>this.hostGame();
    joinBtn.onclick=()=>this.showJoin();
    // Selector de cantidad de jugadores (2 a 6)
    const grid=document.getElementById('maxp-grid');
    grid.innerHTML='';
    [2,3,4,5,6].forEach(n=>{
      const b=document.createElement('button');
      b.className='diff-btn'+(n===this.maxPlayers?' active':'');
      b.textContent=n;
      b.onclick=()=>{
        this.maxPlayers=n;
        grid.querySelectorAll('.diff-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        this.updatePlayerList();
      };
      grid.appendChild(b);
    });
  },
  hostGame(){
    if (this.peer) this.peer.destroy();
    this.roomCode='SN'+Math.random().toString(36).substr(2,5).toUpperCase();
    this.peer=new Peer('supernova-'+this.roomCode);
    this.isHost=true;
    this.myId='host';
    document.getElementById('room-code-display').textContent=t('roomIs')+this.roomCode;
    document.getElementById('coop-status').textContent=t('waitingPlayers');
    this.peer.on('open',id=>{
      document.getElementById('coop-status').textContent=t('roomReady');
    });
    this.peer.on('connection',conn=>{
      if (this.hostConns.length+1>=this.maxPlayers){ conn.close(); return; }
      this.hostConns.push(conn);
      conn.on('open',()=>{
        conn.send({t:'welcome',code:this.roomCode,id:conn.peer});
        document.getElementById('coop-status').textContent=t('roomReady');
        this.updatePlayerList();
        if (this.onClientJoin) this.onClientJoin(conn.peer);
      });
      conn.on('data',data=>{
        if (!data) return;
        if (data.t==='input') this.remoteInputs[conn.peer]=data;
      });
      conn.on('close',()=>{
        this.hostConns=this.hostConns.filter(c=>c!==conn);
        delete this.remoteInputs[conn.peer];
        this.updatePlayerList();
        if (this.onClientLeave) this.onClientLeave(conn.peer);
      });
    });
    this.peer.on('error',err=>{
      document.getElementById('coop-status').textContent=t('errorLbl')+err.type;
    });
  },
  showJoin(){
    const code=document.getElementById('join-code').value.trim().toUpperCase();
    if (!code){ document.getElementById('coop-status').textContent=t('enterCode'); return; }
    if (this.peer) this.peer.destroy();
    this.peer=new Peer();
    this.isHost=false;
    this.roomCode=code;
    document.getElementById('coop-status').textContent=t('connecting');
    this.peer.on('open',id=>{
      this.myId=id;
      this.myConn=this.peer.connect('supernova-'+code,{reliable:true});
      this.myConn.on('open',()=>{
        document.getElementById('coop-status').textContent=t('connected');
        document.getElementById('join-code').style.display='none';
      });
      this.myConn.on('data',data=>{
        if (!data) return;
        if (data.t==='world') this.worldSnapshot=data.s;
        else if (this.onNet) this.onNet(data);
      });
    });
    this.peer.on('error',err=>{
      document.getElementById('coop-status').textContent=t('errorLbl')+err.type;
    });
  },
  updatePlayerList(){
    const max=this.maxPlayers||6;
    document.getElementById('player-list').textContent=t('players')+': '+(this.hostConns.length+1)+'/'+max;
  },
  broadcastWorld(snap){
    if (!this.isHost) return;
    this.hostConns.forEach(c=>{
      if (c.open) try { c.send({t:'world',s:snap}); } catch(e){}
    });
  },
  broadcastEvent(obj){
    if (!this.isHost) return;
    this.hostConns.forEach(c=>{
      if (c.open) try { c.send({t:'evt',...obj}); } catch(e){}
    });
  },
  sendData(obj){
    if (this.isHost || !this.myConn || !this.myConn.open) return;
    try { this.myConn.send(obj); } catch(e){}
  },
  sendInput(inp){
    if (this.isHost||!this.myConn||!this.myConn.open) return;
    try { this.myConn.send({t:'input',...inp}); } catch(e){}
  },
  destroy(){
    if (this.peer){ this.peer.destroy(); this.peer=null; }
    this.hostConns=[];
    this.myConn=null;
    this.myId=null;
    this.worldSnapshot=null;
    this.remoteInputs={};
  }
};
