      });
    };

    const buildShips=()=>{
      const grid=el('ship-select-grid'); grid.innerHTML='';
      SHIPS.forEach((s,i)=>{
        const b=document.createElement('button');
        b.className='ship-btn'+(i===selectedShip?' active':'');
        b.style.animationDelay=(i*70)+'ms';
        const canvas=document.createElement('canvas');
        canvas.width=44; canvas.height=62;
        try { canvas.getContext('2d').drawImage(this.textures.get('ship_'+s.key).getSourceImage(),0,0); } catch(e){}
        b.appendChild(canvas);
        const label=document.createElement('div');
        label.style.fontSize='9px'; label.textContent=s.name;
        b.appendChild(label);
        b.onclick=()=>{
          grid.querySelectorAll('.ship-btn').forEach(x=>x.classList.remove('active'));
          b.classList.add('active'); selectedShip=i;
          b.classList.remove('picked'); void b.offsetWidth; b.classList.add('picked');
        };
        grid.appendChild(b);
      });
    };

    const refreshResume=()=>{
      const saved=getSavedProgress();
      const cbtn=el('continue-btn');
      const sbtn=el('start-btn');
      const info=el('resume-info');
      const godInfo = isGodUser() ? '' : '';
      if (saved){
        cbtn.style.display='inline-block';
        cbtn.textContent=t('contBtn')+' · '+t('level')+' '+(saved.levelIdx+1);
        sbtn.textContent='▶ '+t('newGame');
        info.textContent=tf('resumeInfo',{n:saved.levelIdx+1});
        cbtn.onclick=()=>{
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{
            diffIdx:(typeof saved.diffIdx==='number')?saved.diffIdx:selectedDiff,
            shipIdx:(typeof saved.shipIdx==='number')?saved.shipIdx:selectedShip,
            continueData:{ nextLevel:saved.levelIdx, score:saved.score||0, lives:saved.lives||3, bombs:saved.bombs||2,
              shotsFired:saved.shotsFired||0, shotsHit:saved.shotsHit||0, weaponKey:saved.weaponKey||'normal', powerLevel:saved.powerLevel||0 }
          });
        };
        sbtn.onclick=()=>{
          clearProgress();
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{ diffIdx:selectedDiff, shipIdx:selectedShip });
        };
      } else {
        cbtn.style.display='none';
        sbtn.textContent=t('start');
        info.textContent='';
        sbtn.onclick=()=>{
          AUDIO.init(); AUDIO.resume();
          overlay.classList.add('hidden');
          this.scene.start('Game',{ diffIdx:selectedDiff, shipIdx:selectedShip });
        };
      }
    };

    const startGame=(opts)=>{
      AUDIO.init(); AUDIO.resume();
      overlay.classList.add('hidden');
      this.scene.start('Game', opts);
    };

    const buildLevels=()=>{
      const section=el('level-section');
      const grid=el('level-grid');
      const unlocked=getUnlocked();
      if (unlocked<=0){ section.style.display='none'; return; }
      section.style.display='block';
      grid.innerHTML='';
      const top=Math.min(LEVELS.length-1, unlocked);
      for (let i=0;i<LEVELS.length;i++){
        const b=document.createElement('button');
        const locked=i>top;
        b.className='diff-btn'+(locked?'':'');
        b.textContent=locked?'🔒':String(i+1);
        b.style.animationDelay=(i*25)+'ms';
        b.style.minWidth='34px';
        if (locked){ b.disabled=true; b.style.opacity='0.35'; b.style.cursor='not-allowed'; }
        else {
          b.onclick=()=>{
            startGame({ diffIdx:selectedDiff, shipIdx:selectedShip,
              continueData:{ nextLevel:i, score:0, lives:3, bombs:2, shotsFired:0, shotsHit:0, weaponKey:'normal', powerLevel:0 } });
          };
        }
        grid.appendChild(b);
      }
    };

    const rebuild=()=>{ applyTexts(); buildLang(); buildDiff(); buildShips(); buildLevels(); refreshResume(); };

    rebuild();

    AUDIO.init(); AUDIO.startMusic(window.__splashDone?-6:-1);

    // Botón de silencio (audio + SFX)
    const mb=el('mute-btn');
    const paintMute=()=>{ const on=AUDIO.isEnabled(); mb.textContent=on?'🔊':'🔇'; mb.classList.toggle('muted',!on); };
    mb.onclick=()=>{ AUDIO.setEnabled(!AUDIO.isEnabled()); paintMute(); };
    paintMute();

    // Botón de créditos
    const credBtn=el('credits-btn');
    if (credBtn) credBtn.onclick=()=>{ AUDIO.init(); AUDIO.resume(); overlay.classList.add('hidden'); this.scene.start('Credits'); };

    COOP.init();
  }
}

// ===== JUEGO =====
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }
  init(data){
    this.diffIdx=data.diffIdx||1;
    this.shipIdx=data.shipIdx||0;
    this.diff=DIFFS[this.diffIdx];
    this.shipKey=SHIPS[this.shipIdx].key;
    this.shipConfig=SHIPS[this.shipIdx];
    const c=data.continueData;
    if (c){
      this.levelIdx=c.nextLevel||0;
      this.score=c.score||0;
      this.lives=c.lives||3;
      this.bombs=c.bombs||2;
      this.shotsFired=c.shotsFired||0;
      this.shotsHit=c.shotsHit||0;
      this.weaponKey=c.weaponKey||'normal';
      this.powerLevel=c.powerLevel||0;
    } else {
      this.levelIdx=0;
      this.score=0;
      this.lives=3;
      this.bombs=2;
      this.shotsFired=0;
      this.shotsHit=0;
      this.weaponKey='normal';
      this.powerLevel=0;
    }
    // Modo Dios: tu nave sale al máximo en todo
    if (godMode){
      this.powerLevel=4;
      this.weaponKey='lightning';
      this.lives=9;
      this.bombs=9;
    }
    this.levelKills=0;
    this.totalEnemies=0;
    this.paused=false;
    this.gameOver=false;
    this.fireRateBonus=0;
    this.netMode=COOP.mode();
    this.isClient=(this.netMode==='client');
    this.isNetHost=(this.netMode==='host');
    this.remotePlayers={};
    this.netTick=0;
  }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    this.loadLevel(this.levelIdx);

    // Controles táctiles con arrastre relativo (disparo automático)
    this.dragging=false;
    this.lastPointer={x:0,y:0};
    this.input.on('pointerdown',p=>{
      if (p.y<80) return; // evitar HUD
      if (this.entering||this.exiting) return;
      this.dragging=true;
      this.lastPointer.x=p.x;
      this.lastPointer.y=p.y;
    });
    this.input.on('pointermove',p=>{
      if (!this.dragging||!this.ship||this.entering||this.exiting) return;
      const dx=p.x-this.lastPointer.x;
      const dy=p.y-this.lastPointer.y;
      this.ship.x=Phaser.Math.Clamp(this.ship.x+dx,20,W-20);
      this.ship.y=Phaser.Math.Clamp(this.ship.y+dy,60,H-40);
      this.lastPointer.x=p.x;
      this.lastPointer.y=p.y;
    });
    this.input.on('pointerup',()=>{ this.dragging=false; });

    // Teclado
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE,B,P');

    this.input.keyboard.on('keydown-P',()=>{
      if (this.levelDone||this.levelPanelShown||this.gameOver) return;
      if (this.paused) this.closePauseMenu(true); else this.openPauseMenu();
    });

    // ===== PAUSA (botón táctil + menú) =====
    const pb=document.getElementById('pause-btn');
    const po=document.getElementById('pause-overlay');
    const pt=document.getElementById('pause-title');
    const pr=document.getElementById('pause-resume');
    const prs=document.getElementById('pause-restart');
    const psnd=document.getElementById('pause-sound');
    const pm=document.getElementById('pause-menu');
    if (pt) pt.textContent=t('pause');
    if (pr) pr.textContent=t('resume');
    if (prs) prs.textContent=t('restartLvl');
    if (pm) pm.textContent=t('toMenu');
    const paintSound=()=>{ if(psnd) psnd.textContent=AUDIO.isEnabled()?'🔊 '+t('soundOn'):'🔇 '+t('soundOff'); };
    paintSound();
    if (pb) pb.classList.add('show');
    if (pb) pb.onclick=()=>{ if (this.levelDone||this.levelPanelShown||this.gameOver) return; this.openPauseMenu(); };
    if (pr) pr.onclick=()=>this.closePauseMenu(true);
    if (prs) prs.onclick=()=>{
      this.closePauseMenu(false);
      this.paused=false; AUDIO.startMusic();
      this.loadLevel(this.levelIdx);
      if (pb) pb.classList.add('show');
    };
    if (psnd) psnd.onclick=()=>{ AUDIO.setEnabled(!AUDIO.isEnabled()); paintSound(); };
    if (pm) pm.onclick=()=>{
      this.closePauseMenu(false);
      this.paused=false;
      COOP.destroy();
      this.scene.start('Menu');
    };
    this.events.once('shutdown',()=>{ if(pb) pb.classList.remove('show'); if(po) po.classList.add('hidden'); });
    this.events.once('destroy',()=>{ if(pb) pb.classList.remove('show'); if(po) po.classList.add('hidden'); });

    // ===== BOTÓN DE BOMBA (táctil) =====
    const bb=document.getElementById('bomb-btn');
    if (bb){
      bb.classList.add('show');
      bb.onclick=()=>{ if (this.paused||this.gameOver||this.levelDone||this.levelPanelShown||this.entering||this.exiting) return; this.fireBomb(); };
    }
    this.events.once('shutdown',()=>{ if(bb) bb.classList.remove('show'); });
    this.events.once('destroy',()=>{ if(bb) bb.classList.remove('show'); });

    // Co-op: eventos de red
    COOP.onNet=null;
    COOP.onClientJoin=null;
    COOP.onClientLeave=null;
    if (this.isClient){
      COOP.onNet=(d)=>{
        if (!d || d.t!=='evt') return;
        if (d.e==='levelcomplete'){ this.scene.start('LevelComplete',{client:true, levelIdx:this.levelIdx, score:this.score, lives:this.lives, bombs:this.bombs, shotsFired:this.shotsFired, shotsHit:this.shotsHit, levelKills:this.levelKills, totalEnemies:this.totalEnemies, weaponKey:this.weaponKey, powerLevel:this.powerLevel, diffIdx:this.diffIdx, shipIdx:this.shipIdx}); }
        else if (d.e==='level'){ this.scene.start('Game',{ diffIdx:this.diffIdx, shipIdx:this.shipIdx, continueData:{ nextLevel:d.lvl||0, score:this.score, lives:this.lives, bombs:this.bombs, shotsFired:this.shotsFired, shotsHit:this.shotsHit, weaponKey:'normal', powerLevel:0 } }); }
        else if (d.e==='victory'){ this.scene.start('GameOver',{victory:true, score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, shipIdx:this.shipIdx, diffIdx:this.diffIdx}); }
        else if (d.e==='defeat'){ this.scene.start('GameOver',{defeat:true, score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, levelIdx:this.levelIdx, diffIdx:this.diffIdx, shipIdx:this.shipIdx, scoreAtLevelStart:this.score}); }
      };
    }
  }

  loadLevel(idx){
    this.levelIdx=idx;
    this.scoreAtLevelStart=this.score;
    const L=LEVELS[Math.min(idx,LEVELS.length-1)];
    this.levelConfig=L;
    this.cameras.main.setBackgroundColor(L.bg);
    AUDIO.startMusic(idx);
    this.levelKills=0;
    this.totalEnemies=L.count;
    this.spawnedEnemies=0;
    this.waveSize=L.wave||3;
    this.waveGap=L.waveGap||2500;
    this.maxAlive=L.maxAlive||5;
    this.maxEBullets=L.maxEBullets||12;
    this.spawnedInWave=0;
    this.levelDone=false;
    this.bossSpawned=false;
    this.bossWarned=false;
    this.entering=true;
    this.exiting=false;
    this.paused=false;
    if (this.levelUI){
      if (this.levelUI.timer) this.levelUI.timer.remove();
      if (this.levelUI.tw) this.levelUI.tw.stop();
      if (this.levelUI.panel) this.levelUI.panel.destroy();
      if (this.levelUI.cont) this.levelUI.cont.destroy();
      this.levelUI=null;
    }
    this.levelPanelShown=false;
    this.advancing=false;

    // Desbloquea este nivel para poder rejugarlo
    setUnlocked(idx);

    // Guarda el progreso para continuar aquí si cierran el juego
    saveProgress({
      levelIdx:idx, score:this.score, lives:this.lives, bombs:this.bombs,
      weaponKey:this.weaponKey, powerLevel:this.powerLevel,
      shotsFired:this.shotsFired, shotsHit:this.shotsHit,
      diffIdx:this.diffIdx, shipIdx:this.shipIdx, ts:Date.now()
    });

    if (this.enemies) this.enemies.clear(true,true);
    if (this.ebullets) this.ebullets.clear(true,true);
    if (this.items) this.items.clear(true,true);
    if (this.shipBullets) this.shipBullets.clear(true,true);
    if (this.flames) this.flames.clear(true,true);
    if (this.engineFlame) { this.engineFlame.destroy(); this.engineFlame=null; }
    if (this.exhaust) { this.exhaust.destroy(); this.exhaust=null; }
    if (this.decorObjs) this.decorObjs.forEach(o=>{ if (o && o.destroy) o.destroy(); });
    this.decorObjs=[];
    if (this.bossBar){ if (this.bossBar.bg) this.bossBar.bg.destroy(); if (this.bossBar.fg) this.bossBar.fg.destroy(); this.bossBar=null; }

    this.enemies=this.add.group();
    this.ebullets=this.add.group();
    this.items=this.add.group();
    this.shipBullets=this.add.group();
    this.flames=this.add.group();
    this.decorObjs=[];

    // Co-op: limpiar naves remotas y estructuras de red
    if (this.remotePlayers){ for (const id in this.remotePlayers){ const rp=this.remotePlayers[id]; if (rp.ship) rp.ship.destroy(); if (rp.flame) rp.flame.destroy(); if (rp.label) rp.label.destroy(); } }
    this.remotePlayers={};
    this.netEnemies=[]; this.netEBullets=[]; this.netPBullets=[]; this.netItems=[]; this.netPlayers=[];
    if (this.isNetHost && idx>0) COOP.broadcastEvent({e:'level', lvl:idx});

    // Estrellas
    if (this.stars) this.stars.forEach(s=>{ if (s && s.destroy) s.destroy(); });
    this.stars=[];
    for (let i=0;i<80;i++){
      const s=this.add.image(Phaser.Math.Between(0,W),Phaser.Math.Between(0,H),'star')
        .setAlpha(Phaser.Math.FloatBetween(0.3,1));
      s.setTint(L.sc);
      s.spd=Phaser.Math.Between(30,120);
      this.stars.push(s);
    }

    this.buildDecor(L.decor,L.sc);

    if (this.ship) this.ship.destroy();
    this.ship=this.add.image(W/2,H+95,'ship_'+this.shipKey).setDepth(10).setScale(1.15).setAlpha(0);
    // Entrada de la nave del jugador (vuela desde abajo)
    this.tweens.add({targets:this.ship, y:H-90, alpha:1, duration:750, ease:'Cubic.Out',
      onComplete:()=>{ this.entering=false; }});
    // Fuego de los motores (llama + partículas)
    this.engineFlame=this.add.image(this.ship.x,this.ship.y+30,'flame').setOrigin(0.5,0).setDepth(9).setBlendMode(Phaser.BlendModes.ADD).setScale(1.3,1.7);
    this.exhaust=this.add.particles(0,0,'spark',{
      follow:this.ship, followOffset:{x:0,y:30},
      speedY:{min:90,max:190}, speedX:{min:-30,max:30},
      scale:{start:1.3,end:0}, alpha:{start:0.9,end:0},
      lifespan:340, frequency:28, quantity:1,
      tint:[0xffee00,0xff9900,0xff4400], blendMode:'ADD'
    }).setDepth(9);
    this.shipSpeed=this.shipConfig.speed;
    this.baseFireRate=this.shipConfig.fireRate;

    // Timers de power-ups
    this.shieldActive=false;
    this.invincible=false;
    this.invincibleTimer=0;
    this.speedBoost=false;
    this.speedTimer=0;
    this.pierceShot=false;
    this.pierceTimer=0;
    this.scoreMultiplier=1;
    this.scoreMulTimer=0;
    this.magnetActive=false;
    this.magnetTimer=0;
    this.freezeActive=false;
    this.freezeTimer=0;
    this.droneActive=false;
    if (this.wingmen){ this.wingmen.forEach(w=>{ if (w && w.destroy) w.destroy(); }); }
    this.wingmen=[];
    this.wingmenTimer=0;
    this.lastHoming=0;
    this.lastFire=0;
    this.reflectorActive=false;
    this.reflectorTimer=0;
    this.fireRateTimer=0;

    this.spawnTimer=0;

    // HUD
    if (this.hudText) this.hudText.destroy();
    if (this.levelText) this.levelText.destroy();
    if (this.progressText) this.progressText.destroy();
    if (this.weaponText) this.weaponText.destroy();

    this.levelText=this.add.text(W/2,8,t('level')+' '+(this.levelIdx+1)+'/'+LEVELS.length+' · '+L.name,{fontSize:'11px',fontFamily:'monospace',color:'#00d4ff'}).setOrigin(0.5,0).setDepth(50);
    this.progressText=this.add.text(W/2,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#ffaa00'}).setOrigin(0.5,0).setDepth(50);
    this.weaponText=this.add.text(10,24,'',{fontSize:'10px',fontFamily:'monospace',color:'#88bbff'}).setDepth(50);
    this.hudText=this.add.text(8,H-40,'',{fontSize:'11px',fontFamily:'monospace',color:'#88ccdd',stroke:'#000',strokeThickness:2}).setDepth(100).setScrollFactor(0);

    this.updateWeaponUI();
    this.updateProgressUI();
    if (godMode) this.applyGodMode();
  }

  applyGodMode(){
    this.powerLevel=4;
    this.lives=9;
    this.bombs=9;
    this.shieldActive=true;
    this.pierceShot=true;
    this.magnetActive=true;
    this.freezeActive=true;
    this.reflectorActive=true;
    this.speedBoost=true;
    this.fireRateBonus=200;
    this.fireRateTimer=999999;
    this.spawnWingmen();
    this.wingmenTimer=99999999;
    this.updateWeaponUI();
  }

  updateWeaponUI(){
    const w=WEAPONS[this.weaponKey]||WEAPONS.normal;
    if (this.weaponText) this.weaponText.setText(w.name+' · '+t('pot')+' '+(this.powerLevel+1));
  }
  updateProgressUI(){
    if (!this.progressText) return;
    const rem=Math.max(0,this.totalEnemies-this.levelKills);
    let tx=t('enemies')+' '+rem+'/'+this.totalEnemies;
    if (this.levelConfig.boss) tx+=' · '+(this.bossSpawned?t('bossNow'):t('bossLater'));
    this.progressText.setText(tx);
  }

  buildDecor(type,sc){
    const add=(key,x,y,scale,alpha,tint,vy,vx)=>{
      const obj=this.add.image(x,y,key).setScale(scale).setAlpha(alpha).setTint(tint||0xffffff).setDepth(0);
      obj.dvy=vy!==undefined?vy:Phaser.Math.Between(10,30);
      obj.dvx=vx||0;
      this.decorObjs.push(obj);
      return obj;
    };
    const rnd=(a,b)=>Phaser.Math.Between(a,b);
    switch(type){
      case 'nebula':
        for (let i=0;i<4;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.5,2.5),0.12,sc,rnd(5,12),0);
        break;
      case 'asteroids':
        for (let i=0;i<6;i++) add('asteroid',rnd(20,W-20),rnd(-50,H),Phaser.Math.FloatBetween(0.4,1.2),0.8,sc,rnd(15,40),rnd(-5,5));
        break;
      case 'toxic':
        add('planet',W*0.25,rnd(80,160),1.5,1,0x55dd66,3,0);
        for (let i=0;i<5;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1,1.8),0.15,0x44ff88,rnd(6,14),0);
        break;
      case 'wreck':
        for (let i=0;i<7;i++){
          const o=add('wreck',rnd(0,W),rnd(0,H),rnd(0.6,1.2),0.85,0x9a9a9a,rnd(12,28),rnd(-6,6));
          o.rotation=rnd(0,63)/10;
        }
        break;
      case 'sun': {
        const s=add('planet',W/2,-40,2.8,1,0xffcc33,0,0);
        s.setDepth(-1);
        const glow=this.add.circle(W/2,-30,180,0xffaa00,0.10).setDepth(-2);
        this.decorObjs.push(glow); glow.dvy=0;
        for (let i=0;i<6;i++) add('spark',rnd(0,W),rnd(0,H),rnd(0.5,1),0.5,0xffdd44,rnd(30,70),rnd(-10,10));
        break;
      }
      case 'trench':
        for (let i=0;i<5;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.6,2.6),0.12,0x2244aa,rnd(5,12),0);
        for (let i=0;i<10;i++) add('spark',rnd(0,W),rnd(0,H),0.35,0.5,0x4466cc,rnd(15,35),0);
        break;
      case 'galaxies':
        for (let i=0;i<4;i++) add('cloud',rnd(0,W),rnd(0,H),rnd(1.6,2.6),0.10,[0x8f7fff,0xa06fff,0xd090ff,0x90c0ff][i%4],rnd(4,10),0);
        break;
      case 'alert': {
        const v=this.add.rectangle(W/2,H/2,W,H,0xff0000,0.06).setDepth(0);
        this.decorObjs.push(v); v.dvy=0;
        this.tweens.add({targets:v,alpha:0.14,duration:600,yoyo:true,repeat:-1});
        break;
      }
      case 'ringed': {
        const p=add('planet',W*0.7,rnd(90,170),1.5,1,sc,2,0);
        const ring=this.add.image(p.x,p.y+6,'ring').setScale(1.5).setAlpha(0.7).setDepth(1);
        ring.rotation=0.5;
        this.decorObjs.push(ring); ring.dvy=2; ring.dvx=0;
        break;
      }
      case 'collision':
        add('cloud',W*0.5,H*0.3,2.8,0.13,0xdd88ff,6,0);
        add('cloud',W*0.5,H*0.6,2.6,0.11,0x88bbff,5,0);
        break;
      case 'rift':
        for (let i=0;i<3;i++) add('rift',rnd(0,W),rnd(-100,H),rnd(0.8,1.5),0.7,0xffee00,rnd(20,40),rnd(-10,10));
        break;
      case 'fortress':
        for (let i=0;i<4;i++) add('fortress',rnd(0,W),rnd(-100,H),rnd(0.8,1.4),0.6,0xff88ff,rnd(10,25),0);
        break;
      case 'supernova': {
        const sn=add('supernova',W/2,H/2,3,0.8,0xffee88,0,0);
        this.tweens.add({targets:sn,scale:3.5,alpha:0.5,duration:2000,yoyo:true,repeat:-1});
        break;
      }
    }
  }

  spawnEnemy(){
    const L=this.levelConfig;
    const type=L.enemies[Phaser.Math.Between(0,L.enemies.length-1)];
    const def=ENEMY_TYPES[type]||ENEMY_TYPES.drone;
    const x=Phaser.Math.Between(40,W-40);
    const e=this.add.image(x,-40,'enemy_'+type).setDepth(5);
    e.type=type;
    e.hp=def.hp*this.diff.hpMul;
    e.maxHp=e.hp;
    e.speed=def.speed*this.diff.spdMul;
    e.setData('shootTimer',Phaser.Math.Between(500,2000));
    e.setData('phase',Math.random()*Math.PI*2);
    e.setData('dir',Math.random()<0.5?1:-1);
    if (type==='spinner') e.setData('spin',Math.random()*Math.PI*2);
    const fl=this.add.image(x,-40-16,'flame').setDepth(4).setBlendMode(Phaser.BlendModes.ADD).setScale(0.7).setFlipY(true);
    e.flameRef=fl; this.flames.add(fl);
    // Entrada animada del enemigo
    e.setScale(0.25).setAlpha(0.25);
    this.tweens.add({targets:e, scale:1, alpha:1, duration:330, ease:'Back.Out'});
    this.enemies.add(e);
    this.spawnedEnemies++;
  }

  ensureBossTexture(i){
    const base='enemy_boss_'+i;
    if (this.textures.exists(base+'_d0')) return base+'_d0';
    const sp=BOSS_SPECS[i]||bossSpec(i);
    const g=this.make.graphics({add:false});
    drawBossFromSpec(g,sp,0);
    g.generateTexture(base+'_d0', sp.w, sp.h); g.destroy();
    const g1=this.make.graphics({add:false});
    drawBossFromSpec(g1,sp,1);
    g1.generateTexture(base+'_d1', sp.w, sp.h); g1.destroy();
    const g2=this.make.graphics({add:false});
    drawBossFromSpec(g2,sp,2);
    g2.generateTexture(base+'_d2', sp.w, sp.h); g2.destroy();
    const g3=this.make.graphics({add:false});
    drawBossFromSpec(g3,sp,3);
    g3.generateTexture(base+'_d3', sp.w, sp.h); g3.destroy();
    return base+'_d0';
  }

  spawnBoss(){
    const type=this.levelConfig.bossType||'boss';
    const idx=this.levelIdx;
    const dyn=String(type).indexOf('boss_')===0;
    let key,rad,fire,hp,speed,score;
    if (dyn && BOSS_SPECS[idx]){
      const sp=BOSS_SPECS[idx];
      key=this.ensureBossTexture(idx);
      rad=Math.max(20,Math.min(sp.w,sp.h)*0.8);
      fire=sp.final?260:380-Math.min(240,idx*3);
      hp=(sp.final?900:220)+idx*40;
      speed=30-Math.min(14,idx*0.25);
      score=hp*12;
    } else {
      const def=BOSS_TYPES[type]||BOSS_TYPES.boss;
      key='enemy_'+type; rad=def.r; fire=def.fire; hp=def.hp; speed=def.speed; score=def.score;
    }
    const e=this.add.image(W/2,-160,key).setDepth(5);
    e.type=type;
    e.isBoss=true;
    if (dyn) e.bossIdx=idx;
    e.dmgStage=0;
    e.bossR=rad;
    e.fireInterval=fire;
    e.bossScore=score;
    e.hp=hp*this.diff.hpMul;
    e.maxHp=e.hp;
    e.speed=speed*this.diff.spdMul;
    e.setData('shootTimer',0);
    e.setData('dir',1);
    e.setData('phase',0);
    e.entering=true;
    e.setScale(0.6).setAlpha(0.4);
    const fl=this.add.image(W/2,-160-rad*0.7,'flame').setDepth(4).setBlendMode(Phaser.BlendModes.ADD).setScale(1.4,1.8).setFlipY(true);
    e.flameRef=fl; this.flames.add(fl);
    // Entrada del jefe (vuela desde arriba)
    this.tweens.add({targets:e, y:80, scale:1, alpha:1, duration:900, ease:'Cubic.Out',
      onComplete:()=>{ e.entering=false; }});
    this.enemies.add(e);
    this.bossSpawned=true;
    // barra de vida del jefe en la parte superior
    if (this.bossBar){ if (this.bossBar.bg) this.bossBar.bg.destroy(); if (this.bossBar.fg) this.bossBar.fg.destroy(); this.bossBar=null; }
    const barW=Math.min(W-40,320); this.bossBar={bg:this.add.rectangle(W/2,24,barW,10,0x000000,0.7).setDepth(95), fg:this.add.rectangle(W/2-barW/2+2,24,barW-4,6,0xff3300,0.9).setOrigin(0,0.5).setDepth(96), maxW:barW-4};
  }

  showBossWarning(onDone){
    const c=this.add.container(W/2,H/2).setDepth(80);
    const bar=this.add.rectangle(0,0,W,80,0xff0000,0.18);
    const t1=this.add.text(0,-18,'⚠ ¡JEFE A LA VISTA! ⚠',{fontSize:'20px',fontFamily:'monospace',color:'#ff3333',stroke:'#000',strokeThickness:3}).setOrigin(0.5);
    const nm=this.levelConfig.bossName||'';
    const t2=this.add.text(0,10,(nm?nm.toUpperCase():'PREPÁRATE PARA EL COMBATE'),{fontSize:nm?'13px':'11px',fontFamily:'monospace',color:nm?'#ffdd66':'#ffcccc'}).setOrigin(0.5);
    const t3=this.add.text(0,26,'PREPÁRATE PARA EL COMBATE',{fontSize:'10px',fontFamily:'monospace',color:'#ffcccc'}).setOrigin(0.5);
    c.add([bar,t1,t2,t3]);
    AUDIO.sfx('warning');
    vib([80,60,80]);
    this.tweens.add({targets:c, alpha:0.25, duration:180, yoyo:true, repeat:6,
      onComplete:()=>{ c.destroy(); if (onDone) onDone(); }});
  }

  updateBossBar(){
    let boss=null;
    this.enemies.getChildren().forEach(e=>{ if (e&&e.active&&e.isBoss) boss=e; });
    if (!boss||!this.bossBar){
      if (this.bossBar){ this.bossBar.bg.setVisible(false); this.bossBar.fg.setVisible(false); }
      return;
    }
    const bb=this.bossBar;
    bb.bg.setVisible(true); bb.fg.setVisible(true);
    const frac=Phaser.Math.Clamp(boss.hp/(boss.maxHp||boss.hp),0,1);
    const col=frac>0.5?0x33ff88:(frac>0.25?0xffaa22:0xff3344);
    bb.fg.setSize(bb.maxW*frac,6);
    bb.fg.setFillStyle(col,0.95);
    // daño visual: cambiar textura según la vida restante
    if (boss.bossIdx!=null){
      const stage=frac>0.75?0:(frac>0.5?1:(frac>0.25?2:3));
      if (stage!==boss.dmgStage){
        boss.dmgStage=stage;
        const key='enemy_boss_'+boss.bossIdx+'_d'+stage;
        if (this.textures.exists(key)) boss.setTexture(key);
      }
    }
  }

  fireBullet(){
    const now=this.time.now;
    const rate=Math.max(60,this.baseFireRate-this.fireRateBonus);
    if (now-this.lastFire<rate) return;
    this.lastFire=now;
    this.shotsFired++;

    const w=WEAPONS[this.weaponKey]||WEAPONS.normal;
    const spd=500;
    const addBullet=(bx,by,angle,speed)=>{
      const b=this.add.image(bx,by,w.tex).setDepth(8);
      b.speed=-speed;
      b.dmg=w.damage;
      b.angle=angle||0;
      b.weapon=this.weaponKey;
      b.pierce=this.pierceShot;
      b.setTint(w.color);
      this.shipBullets.add(b);
    };
    w.fire(this.ship.x,this.ship.y,spd,this.powerLevel,addBullet);

    // Modo Dios: abanico ancho que cubre gran parte de la pantalla
    if (godMode){
      const n=15, spread=150, offspd=spd*0.9;
      for (let i=0;i<n;i++){
        const ang=-spread/2+(n>1?spread/(n-1):0)*i;
        addBullet(this.ship.x,this.ship.y-10,ang,offspd);
      }
    }

    // Nivel máximo: misiles teledirigidos (con recarga propia)
    if (this.powerLevel>=4 && now-this.lastHoming>=420){
      this.lastHoming=now;
      [[-16,0.4],[16,-0.4]].forEach(([off,hx])=>{
        const b=this.add.image(this.ship.x+off,this.ship.y-4,'missile').setDepth(8);
        b.speed=360; b.dmg=Math.max(2,w.damage); b.homing=true; b.hx=hx; b.hy=-0.9;
        b.pierce=true; b.weapon='missile'; b.setTint(0xffaa33);
        this.shipBullets.add(b);
      });
    }

    const sfxName={normal:'shoot',laser:'laser',plasma:'plasma',lightning:'lightning',missile:'missile',spread:'shoot'}[this.weaponKey]||'shoot';
    AUDIO.sfx(sfxName);
  }

  fireBomb(){
    if (this.bombs<=0) return;
    this.bombs--;
    AUDIO.sfx('bomb');
    vib(200);
    this.ebullets.children.iterate(b=>{ if (b) b.destroy(); });
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      this.add.circle(e.x,e.y,20,0xffaa00,0.7).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
      e.hp-=15;
      if (e.hp<=0) this.killEnemy(e);
    });
    this.cameras.main.shake(300,0.015);
  }

  fireSuperBomb(){
    AUDIO.sfx('bomb');
    vib(400);
    this.ebullets.children.iterate(b=>{ if (b) b.destroy(); });
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      this.add.circle(e.x,e.y,30,0xff4400,0.8).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
      if (e.isBoss){ e.hp-=Math.max(120,(e.maxHp||600)*0.3); }
      else { e.hp=0; }
      if (e.hp<=0) this.killEnemy(e);
    });
    this.cameras.main.shake(500,0.025);
  }

  spawnWingmen(){
    if (this.wingmen && this.wingmen.length){ this.wingmenTimer=45000; return; }
    this.wingmen=[];
    [-1,1].forEach(side=>{
      const a=this.add.image(this.ship.x+side*42,this.ship.y+6,'ally').setDepth(9).setScale(0.8);
      a.side=side; a.fireCd=300+Math.random()*250;
      this.wingmen.push(a);
    });
    this.droneActive=true;
    this.wingmenTimer=45000;
  }

  collectItem(item){
    AUDIO.sfx('powerup');
    vib(50);
    const key=item.itemType;
    if (key==='item_power'){ this.powerLevel=Math.min(this.powerLevel+1,4); }
    else if (key==='item_firerate'){ this.fireRateBonus+=30; this.fireRateTimer=15000; }
    else if (key==='item_w_normal'){ this.weaponKey='normal'; }
    else if (key==='item_w_spread'){ this.weaponKey='spread'; }
    else if (key==='item_w_laser'){ this.weaponKey='laser'; }
    else if (key==='item_w_missile'){ this.weaponKey='missile'; }
    else if (key==='item_w_plasma'){ this.weaponKey='plasma'; }
    else if (key==='item_w_lightning'){ this.weaponKey='lightning'; }
    else if (key==='item_shield'){ this.shieldActive=true; }
    else if (key==='item_life'){ this.lives=Math.min(this.lives+1,9); }
    else if (key==='item_repair'){ this.shieldActive=true; this.score+=500*this.scoreMultiplier; }
    else if (key==='item_bomb'){ this.bombs=Math.min(this.bombs+1,9); }
    else if (key==='item_superbomb'){ this.fireSuperBomb(); }
    else if (key==='item_freeze'){ this.freezeActive=true; this.freezeTimer=8000; }
    else if (key==='item_magnet'){ this.magnetActive=true; this.magnetTimer=10000; }
    else if (key==='item_triple'){ this.weaponKey='spread'; this.powerLevel=Math.max(this.powerLevel,1); }
    else if (key==='item_invinc'){ this.invincible=true; this.invincibleTimer=6000; }
    else if (key==='item_speed'){ this.speedBoost=true; this.speedTimer=8000; }
    else if (key==='item_pierce'){ this.pierceShot=true; this.pierceTimer=10000; }
    else if (key==='item_x2'){ this.scoreMultiplier=2; this.scoreMulTimer=15000; }
    else if (key==='item_drone'){ this.spawnWingmen(); }
    else if (key==='item_reflect'){ this.reflectorActive=true; this.reflectorTimer=10000; }
    this.updateWeaponUI();
    item.destroy();
  }

  hitPlayer(){
    if (godMode) return;
    if (this.invincible||this.shieldActive) return;
    this.lives--;
    AUDIO.sfx('explosion');
    vib(300);
    this.cameras.main.shake(200,0.015);
    if (this.lives<=0){
      this.gameOver=true;
      AUDIO.stopMusic();
      if (this.isNetHost) COOP.broadcastEvent({e:'defeat'});
      this.time.delayedCall(800,()=>this.scene.start('GameOver',{
        score:this.score, shotsFired:this.shotsFired, shotsHit:this.shotsHit, lives:0,
        defeat:true, levelIdx:this.levelIdx, scoreAtLevelStart:this.scoreAtLevelStart||0,
        diffIdx:this.diffIdx, shipIdx:this.shipIdx
      }));
    } else {
      this.invincible=true;
      this.invincibleTimer=2000;
    }
  }

  checkLevelProgress(){
    if (this.levelDone) return;
    if (this.spawnedEnemies<this.totalEnemies) return;
    if (this.levelKills<this.totalEnemies) return;
    if (this.levelConfig.boss && !this.bossSpawned){
      if (!this.bossWarned){
        this.bossWarned=true;
        this.showBossWarning(()=>this.spawnBoss());
      }
      return;
    }
    if (this.enemies.countActive()>0) return;

    this.levelDone=true;
    this.exiting=true;
    this.dragging=false;
    AUDIO.stopMusic();
    AUDIO.sfx('levelup');
    if (this.isNetHost) COOP.broadcastEvent({e:'levelcomplete'});
    // Guarda el progreso del siguiente nivel (por si cierran durante el panel)
    saveProgress({
      levelIdx:Math.min(this.levelIdx+1,LEVELS.length-1), score:this.score, lives:this.lives, bombs:this.bombs,
      weaponKey:this.weaponKey, powerLevel:this.powerLevel,
      shotsFired:this.shotsFired, shotsHit:this.shotsHit,
      diffIdx:this.diffIdx, shipIdx:this.shipIdx, ts:Date.now()
    });
    if (this.engineFlame) this.engineFlame.visible=false;
    if (this.exhaust) this.exhaust.visible=false;
    // Salida de la nave del jugador (se aleja volando hacia arriba)
    this.tweens.add({targets:this.ship, y:-140, duration:850, ease:'Cubic.In', onComplete:()=>{
      // Transición EN LA MISMA ESCENA (sin reiniciar la escena) para evitar errores
      try { this.showLevelCompletePanel(); }
      catch(e){
        this.scene.start('LevelComplete',{
          levelIdx:this.levelIdx, score:this.score, lives:this.lives, bombs:this.bombs,
          shotsFired:this.shotsFired, shotsHit:this.shotsHit, levelKills:this.levelKills,
          totalEnemies:this.totalEnemies, weaponKey:this.weaponKey, powerLevel:this.powerLevel,
          diffIdx:this.diffIdx, shipIdx:this.shipIdx
        });
      }
    }});
  }

  // ===== PANEL DE NIVEL COMPLETADO (in-place) =====
  showLevelCompletePanel(){
    if (this.levelPanelShown) return;
    this.levelPanelShown=true;
    this.paused=true;
    AUDIO.startMusic(-2);

    const last=this.levelIdx>=LEVELS.length-1;
    const acc=this.shotsFired>0?Math.floor((this.shotsHit/this.shotsFired)*100):0;
    const panel=this.add.rectangle(W/2,H/2,W,H,0x000000,0.85).setDepth(90);
    const cont=this.add.container(W/2,H/2-40).setDepth(91);
    const mk=(dy,txt,color,size,bold)=>{
      const o=this.add.text(0,dy,txt,{fontSize:(size||14)+'px',fontFamily:'monospace',color:color,fontStyle:bold?'bold':'normal',stroke:'#000',strokeThickness:bold?4:2}).setOrigin(0.5);
      cont.add(o); return o;
    };
    mk(-130,t('level')+' '+(this.levelIdx+1)+' '+t('levelComplete'),'#ffdd44',22,true);
    mk(-80,t('enemies')+': '+this.levelKills+'/'+this.totalEnemies,'#ffffff');
    mk(-50,t('accuracy')+': '+acc+'%','#88bbff');
    mk(-20,t('points')+': '+Math.floor(this.score),'#00d4ff');
    mk(10,t('lives')+': '+this.lives+'   '+t('bombs')+': '+this.bombs,'#ff4466');
    const btn=this.add.text(0,90,'[ '+(last?t('victoryBtn'):t('nextLevel'))+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#44ff88',stroke:'#000',strokeThickness:3}).setOrigin(0.5);
    cont.add(btn);
    const tw=this.tweens.add({targets:btn,alpha:0.3,duration:500,yoyo:true,repeat:-1});
    const cd=this.add.text(0,125,'',{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5);
    cont.add(cd);

    this.levelUI={panel,cont,tw,btn,cd,timer:null};
    btn.setInteractive({useHandCursor:true});
    btn.on('pointerdown',()=>this.advanceLevel());

    // Auto-avance (10s) por si el jugador no toca el botón
    let count=10;
    cd.setText(tf('autoAdvance',{s:count}));
    this.levelUI.timer=this.time.addEvent({delay:1000,repeat:count-1,callback:()=>{
      count--;
      if (count<=0) this.advanceLevel();
      else if (cd && cd.active) cd.setText(tf('autoAdvance',{s:count}));
    }});
  }

  advanceLevel(){
    if (this.advancing) return;
    this.advancing=true;
    if (this.levelUI){
      if (this.levelUI.timer) this.levelUI.timer.remove();
      if (this.levelUI.tw) this.levelUI.tw.stop();
      if (this.levelUI.panel) this.levelUI.panel.destroy();
      if (this.levelUI.cont) this.levelUI.cont.destroy();
      this.levelUI=null;
    }
    this.paused=false;

    // Último nivel -> victoria
    if (this.levelIdx>=LEVELS.length-1){
      if (this.isNetHost) COOP.broadcastEvent({e:'victory'});
      COOP.destroy();
      clearProgress();
      this.scene.start('GameOver',{score:this.score, victory:true, shotsFired:this.shotsFired, shotsHit:this.shotsHit, shipIdx:this.shipIdx, diffIdx:this.diffIdx});
      return;
    }

    // Siguiente nivel EN LA MISMA ESCENA
    const next=this.levelIdx+1;
    try {
      this.loadLevel(next);   // resetea levelDone/panel/paused y recrea todo
    } catch(e){
      // Respaldo: reiniciar la escena si algo fallara
      this.scene.start('Game',{ diffIdx:this.diffIdx, shipIdx:this.shipIdx, continueData:{
        nextLevel:next, score:this.score, lives:this.lives, bombs:this.bombs,
        shotsFired:this.shotsFired, shotsHit:this.shotsHit, weaponKey:this.weaponKey, powerLevel:this.powerLevel } });
    }
    this.advancing=false;
  }

  // ===== MENÚ DE PAUSA (móvil) =====
  openPauseMenu(){
    if (this.paused) return;
    this.paused=true;
    try { this.scene.pause(); } catch(e){}
    AUDIO.startMusic(-7);
    const po=document.getElementById('pause-overlay'); if (po) po.classList.remove('hidden');
    const pb=document.getElementById('pause-btn'); if (pb) pb.classList.remove('show');
  }
  closePauseMenu(resume){
    const po=document.getElementById('pause-overlay'); if (po) po.classList.add('hidden');
    const pb=document.getElementById('pause-btn'); if (pb) pb.classList.add('show');
    if (resume){
      try { this.scene.resume(); } catch(e){}
      this.paused=false;
      AUDIO.startMusic(this.levelIdx);
    }
  }

  update(time,delta){
    if (this.paused||this.gameOver) return;
    if (!this.ship) return;

    // Movimiento teclado (bloqueado durante entrada/salida de la nave)
    if (!this.entering && !this.exiting){
      const spd=(this.speedBoost?this.shipSpeed*1.5:this.shipSpeed)*(delta/1000);
      let vx=0, vy=0;
      if (this.cursors.left.isDown||this.keys.A.isDown) vx=-1;
      else if (this.cursors.right.isDown||this.keys.D.isDown) vx=1;
      if (this.cursors.up.isDown||this.keys.W.isDown) vy=-1;
      else if (this.cursors.down.isDown||this.keys.S.isDown) vy=1;
      this.ship.x=Phaser.Math.Clamp(this.ship.x+vx*spd,20,W-20);
      this.ship.y=Phaser.Math.Clamp(this.ship.y+vy*spd,60,H-40);
    }

    // Fuego del motor del jugador (sigue a la nave y parpadea)
    if (this.engineFlame){
      this.engineFlame.x=this.ship.x;
      this.engineFlame.y=this.ship.y+30;
      const boost=this.speedBoost?1.25:1;
      this.engineFlame.setScale(1.2*boost+Math.sin(time/40)*0.25, 1.6*boost+Math.sin(time/30)*0.4);
      this.engineFlame.visible=(!this.paused && !this.gameOver && !this.exiting);
    }
    if (this.exhaust) this.exhaust.visible=(!this.paused && !this.gameOver && !this.exiting);

    // ===== CLIENTE: control local + enviar entrada + render del mundo del host =====
    if (this.isClient){
      const firing=(this.dragging || this.cursors.space.isDown || this.keys.SPACE.isDown)?1:0;
      this.netTick+=delta;
      if (this.netTick>=50){
        this.netTick=0;
        COOP.sendInput({x:Math.round(this.ship.x), y:Math.round(this.ship.y), key:this.shipKey, name:this.myName(), firing:firing});
      }
      if (!this.entering && !this.exiting && Phaser.Input.Keyboard.JustDown(this.keys.B)) COOP.sendInput({bomb:1, x:Math.round(this.ship.x), y:Math.round(this.ship.y)});
      this.renderNet(time);
      this.updateHUD();
      this.updateProgressUI();
      return;
    }

    // Disparo automático al arrastrar o con SPACE
    if (!this.entering && !this.exiting && (this.dragging || this.cursors.space.isDown || this.keys.SPACE.isDown)) this.fireBullet();
    if (!this.entering && !this.exiting && Phaser.Input.Keyboard.JustDown(this.keys.B)) this.fireBomb();

    // Timers
    if (this.invincibleTimer>0){ this.invincibleTimer-=delta; if (this.invincibleTimer<=0){ this.invincible=false; this.ship.setAlpha(1); } else this.ship.setAlpha(0.5+Math.sin(time/50)*0.3); }
    if (this.speedTimer>0){ this.speedTimer-=delta; if (this.speedTimer<=0) this.speedBoost=false; }
    if (this.pierceTimer>0){ this.pierceTimer-=delta; if (this.pierceTimer<=0) this.pierceShot=false; }
    if (this.scoreMulTimer>0){ this.scoreMulTimer-=delta; if (this.scoreMulTimer<=0) this.scoreMultiplier=1; }
    if (this.magnetTimer>0){ this.magnetTimer-=delta; if (this.magnetTimer<=0) this.magnetActive=false; }
    if (this.freezeTimer>0){ this.freezeTimer-=delta; if (this.freezeTimer<=0) this.freezeActive=false; }
    if (this.reflectorTimer>0){ this.reflectorTimer-=delta; if (this.reflectorTimer<=0) this.reflectorActive=false; }
    if (this.fireRateTimer>0){ this.fireRateTimer-=delta; if (this.fireRateTimer<=0) this.fireRateBonus=0; }

    // Modo Dios: mantener todo activo y las naves acompañantes siempre
    if (godMode){
      this.shieldActive=true;
      this.pierceShot=true;
      this.magnetActive=true;
      this.freezeActive=true;
      this.reflectorActive=true;
      this.speedBoost=true;
      this.fireRateBonus=200;
      if (this.powerLevel<4) this.powerLevel=4;
      if (this.lives<9) this.lives=9;
      if (this.wingmen && this.wingmen.length){
        this.droneActive=true;
        this.wingmenTimer=99999999;
      } else {
        this.spawnWingmen();
      }
    }

    // Estrellas
    this.stars.forEach(s=>{
      s.y+=s.spd*(delta/1000);
      if (s.y>H){ s.y=-5; s.x=Phaser.Math.Between(0,W); }
    });

    // Decor
    this.decorObjs.forEach(o=>{
      o.y+=(o.dvy||0)*(delta/1000);
      o.x+=(o.dvx||0)*(delta/1000);
      if (o.y>H+100) o.y=-100;
      if (o.x<-100) o.x=W+100;
      if (o.x>W+100) o.x=-100;
    });

    // Spawn por oleadas con huecos para respirar
    if (!this.bossSpawned && this.spawnedEnemies<this.totalEnemies){
      this.spawnTimer-=delta;
      if (this.spawnTimer<=0){
        const alive=this.enemies.countActive(true);
        if (alive<this.maxAlive){
          this.spawnEnemy();
          this.spawnedInWave=(this.spawnedInWave||0)+1;
          if (this.spawnedInWave>=this.waveSize || this.spawnedEnemies>=this.totalEnemies){
            this.spawnTimer=this.waveGap;
            this.spawnedInWave=0;
          } else {
            this.spawnTimer=this.levelConfig.spawn;
          }
        } else {
          this.spawnTimer=280;
        }
      }
    }

    // Enemigos
    if (!this._diag && this.time.now>2500){
      this._diag=true;
      try{
        const en=this.enemies.getChildren(); const e0=en[0];
        const info='DIAG lvl='+this.levelIdx+' god='+(typeof godMode!=='undefined'?godMode:'?')+' freeze='+this.freezeActive+' n='+en.length+' spawned='+this.spawnedEnemies+' total='+this.totalEnemies+' alive='+this.enemies.countActive(true)+(e0?(' | e0 x='+Math.round(e0.x)+' y='+Math.round(e0.y)+' vis='+e0.visible+' a='+e0.alpha+' sx='+e0.scaleX+' tex='+e0.texture.key):' | NO_ENEMIES');
        (new Image()).src='/__err?m='+encodeURIComponent(info)+'&_='+Date.now();
      }catch(err){}
    }
    this.enemies.getChildren().forEach(e=>{
      if (!e.active) return;
      const isBoss=!!e.isBoss;
      if (!e.entering && (!this.freezeActive || e.y < H*0.35)) e.y+=e.speed*delta/1000;
      const ph=e.getData('phase');
      if (e.type==='drone') e.x+=Math.sin(time/300+ph)*1.5;
      else if (e.type==='swarm') e.x+=Math.sin(time/140+ph)*2.6;
      else if (e.type==='spinner'){
        const sp=(e.getData('spin')||0)+delta/1000*2.2;
        e.setData('spin',sp);
        if (!this.freezeActive) { e.x+=Math.cos(sp)*1.6; e.angle+=2.6; }
      }
      else if (e.type==='kamikaze' && !e.entering && this.ship){
        const d=this.ship.x-e.x;
        e.x+=Math.max(-2.4,Math.min(2.4,d*0.02));
      }
      if (isBoss){
        if (e.entering){ /* volando hacia su posición */ }
        else if (e.y<80) e.y+=e.speed*delta/1000;
        else {
          const dir=e.getData('dir');
          e.x+=dir*60*delta/1000;
          if (e.x>W-40) e.setData('dir',-1);
          if (e.x<40) e.setData('dir',1);
        }
        let st=e.getData('shootTimer')+delta;
        const sd=(e.fireInterval||1400)*this.diff.efire;
        if (st>=sd){
          this.enemyFire(e);
          st=0;
        }
        e.setData('shootTimer',st);
      } else {
        const def=ENEMY_TYPES[e.type]||ENEMY_TYPES.drone;
        let st=e.getData('shootTimer')+delta;
        const sd=(def.fire+Math.random()*800)*this.diff.efire;
        if (def.fire>0 && st>=sd && e.y>0 && e.y<H-100){
          this.enemyFire(e);
          st=0;
        }
        e.setData('shootTimer',st);
      }
      if (e.flameRef){
        const off=isBoss?(e.bossR||30)*0.7:18;
        e.flameRef.x=e.x;
        e.flameRef.y=e.y-off;
        e.flameRef.setScale(0.6+Math.sin(time/40+ph)*0.15);
      }
      if (e.y>H+60){ if (e.flameRef) e.flameRef.destroy(); e.destroy(); this.levelKills++; }
    });

    // Barra de vida del jefe + daño visual progresivo
    this.updateBossBar();

    // Balas jugador
    this.shipBullets.getChildren().forEach(b=>{
      if (!b.active) return;
      const dt=delta/1000;
      if (b.homing){
        let best=null, bd=1e9;
        this.enemies.getChildren().forEach(e=>{ if(!e.active) return; const dx=e.x-b.x, dy=e.y-b.y, d=dx*dx+dy*dy; if(d<bd){ bd=d; best=e; } });
        if (best){
          const sp=Math.abs(b.speed);
          const ang=Math.atan2(best.y-b.y,best.x-b.x);
          const ca=Math.atan2(b.hy||-1,b.hx||0);
          let diff=ang-ca; while(diff>Math.PI) diff-=2*Math.PI; while(diff<-Math.PI) diff+=2*Math.PI;
          const na=ca+Math.max(-6*dt,Math.min(6*dt,diff));
          b.hx=Math.cos(na); b.hy=Math.sin(na);
          b.x+=b.hx*sp*dt; b.y+=b.hy*sp*dt;
          b.rotation=na+Math.PI/2;
        } else { b.y+=b.speed*dt; }
      } else {
        b.y+=b.speed*dt;
        if (b.angle) b.x+=Math.sin(b.angle*Math.PI/180)*Math.abs(b.speed)*dt;
      }
      if (b.y<-30||b.y>H+30||b.x<-40||b.x>W+40) b.destroy();
    });

    // Balas enemigas
    this.ebullets.getChildren().forEach(b=>{
      if (!b.active) return;
      b.y+=b.speed*(delta/1000);
      if (b.vx) b.x+=b.vx*(delta/1000);
      if (b.y>H+30||b.y<-30||b.x<-30||b.x>W+30) b.destroy();
    });

    // Items
    this.items.getChildren().forEach(it=>{
      if (!it.active) return;
      it.y+=80*(delta/1000);
      if (this.magnetActive){
        const d=Phaser.Math.Distance.Between(it.x,it.y,this.ship.x,this.ship.y);
        if (d<220){
          const a=Phaser.Math.Angle.Between(it.x,it.y,this.ship.x,this.ship.y);
          it.x+=Math.cos(a)*4; it.y+=Math.sin(a)*4;
        }
      }
      if (it.y>H+30) it.destroy();
    });

    // Colisiones balas-enemigos
    this.shipBullets.getChildren().forEach(b=>{
      if (!b||!b.active) return;
      this.enemies.getChildren().forEach(e=>{
        if (!e||!e.active) return;
        const dx=b.x-e.x, dy=b.y-e.y;
        const r=enemyRadius(e);
        if (dx*dx+dy*dy<r*r){
          e.hp-=b.dmg;
          this.shotsHit++;
          AUDIO.sfx('hit');
          this.add.circle(e.x,e.y,5,0xffff00,0.8).setBlendMode(Phaser.BlendModes.ADD).setDepth(6);
          if (!b.pierce) b.destroy();
          if (e.hp<=0) this.killEnemy(e);
        }
      });
    });

    // Colisiones balas enemigas-jugador
    this.ebullets.getChildren().forEach(b=>{
      if (!b||!b.active) return;
      const dx=b.x-this.ship.x, dy=b.y-this.ship.y;
      if (dx*dx+dy*dy<20*20){
        if (this.reflectorActive){
          b.speed=-b.speed;
          b.setTint(0x00ffff);
        } else {
          b.destroy();
          this.hitPlayer();
        }
      }
    });

    // Colisiones enemigos-jugador
    this.enemies.getChildren().forEach(e=>{
      if (!e||!e.active) return;
      const dx=e.x-this.ship.x, dy=e.y-this.ship.y;
      const r=enemyRadius(e.type);
      if (dx*dx+dy*dy<r*r){
        this.hitPlayer();
        this.killEnemy(e);
      }
    });

    // Colisiones items-jugador
    this.items.getChildren().forEach(it=>{
      if (!it||!it.active) return;
      const dx=it.x-this.ship.x, dy=it.y-this.ship.y;
      if (dx*dx+dy*dy<30*30) this.collectItem(it);
    });

    // Aliados laterales (2 naves que escoltan y disparan)
    if (this.droneActive && this.wingmen && this.wingmen.length){
      this.wingmenTimer-=delta;
      if (this.wingmenTimer<=0){
        this.wingmen.forEach(w=>{ if (w && w.active) w.destroy(); });
        this.wingmen=[]; this.droneActive=false;
      } else {
        this.wingmen.forEach(w=>{
          if (!w.active) return;
          const tx=this.ship.x + w.side*42, ty=this.ship.y+6;
          w.x+=(tx-w.x)*0.13; w.y+=(ty-w.y)*0.13;
          w.fireCd-=delta;
          if (w.fireCd<=0){
            w.fireCd=430;
            const b=this.add.image(w.x,w.y-16,'bullet').setDepth(8);
            b.speed=-460; b.dmg=1; b.angle=0; b.weapon='normal'; b.pierce=false; b.setTint(0x88ffcc);
            this.shipBullets.add(b);
          }
        });
      }
    }

    // HUD
    this.updateHUD();

    this.updateProgressUI();
    this.checkLevelProgress();

    // Co-op host: jugadores remotos + broadcast del mundo
    if (this.isNetHost){
      this.updateRemotePlayers(time,delta);
      this.netTick+=delta;
      if (this.netTick>=66){ this.netTick=0; COOP.broadcastWorld(this.buildSnapshot()); }
    }
  }

  myName(){
    if (typeof userId!=='undefined' && userId) return userId.slice(0,12);
    if (COOP.myId) return ('P'+COOP.myId.slice(-3)).toUpperCase();
    return 'P?';
  }

  updateHUD(){
    if (!this.hudText) return;
    this.hudText.setText(
      'PUNTOS: '+Math.floor(this.score)+'\n'+
      'VIDAS: '+'♥'.repeat(Math.max(0,this.lives))+'  BOMBAS: '+this.bombs
    );
    var bc=document.getElementById('bomb-count'); if (bc) bc.textContent=this.bombs;
    var bb=document.getElementById('bomb-btn'); if (bb) bb.classList.toggle('empty', this.bombs<=0);
  }

  buildSnapshot(){
    const enemies=this.enemies.getChildren().filter(e=>e.active).map(e=>[Math.round(e.x),Math.round(e.y),e.type]);
    const eb=this.ebullets.getChildren().filter(b=>b.active).map(b=>[Math.round(b.x),Math.round(b.y)]);
    const pb=this.shipBullets.getChildren().filter(b=>b.active).map(b=>[Math.round(b.x),Math.round(b.y)]);
    const it=this.items.getChildren().filter(o=>o.active).map(o=>[Math.round(o.x),Math.round(o.y),o.itemType]);
    const pl=[[COOP.myId||'host',Math.round(this.ship.x),Math.round(this.ship.y),this.shipKey,this.lives,this.myName()]];
    for (const id in this.remotePlayers){ const rp=this.remotePlayers[id]; pl.push([id,Math.round(rp.ship.x),Math.round(rp.ship.y),rp.key,this.lives,rp.name||'']); }
    return { le:enemies, eb, pb, it, pl, meta:{ lvl:this.levelIdx, kills:this.levelKills, total:this.totalEnemies, boss:this.bossSpawned?1:0, score:Math.floor(this.score), lives:this.lives } };
  }

  updateRemotePlayers(time,delta){
    const seen={};
    for (const id in COOP.remoteInputs){
      const d=COOP.remoteInputs[id];
      seen[id]=true;
      let rp=this.remotePlayers[id];
      if (!rp){
        const ship=this.add.image((typeof d.x==='number')?d.x:W/2,(typeof d.y==='number')?d.y:H-100,'ship_'+(d.key||'viper')).setDepth(10).setScale(0.62).setTint(0xaaffcc);
        const flame=this.add.image(ship.x,ship.y+20,'flame').setOrigin(0.5,0).setDepth(9).setBlendMode(Phaser.BlendModes.ADD).setScale(0.7,0.9);
        const name=(d.name||('P'+id.slice(-3))).toString().slice(0,12);
        const label=this.add.text(ship.x,ship.y-30,name,{fontSize:'9px',fontFamily:'monospace',color:'#aaffcc',stroke:'#002200',strokeThickness:3}).setOrigin(0.5).setDepth(12);
        rp=this.remotePlayers[id]={ship,flame,label,name,key:d.key||'viper',fireCd:0,firing:0};
      }
      if (d.name && rp.label && rp.label.text!==d.name.slice(0,12)){ rp.name=d.name.slice(0,12); rp.label.setText(rp.name); }
      const tx=(typeof d.x==='number')?d.x:rp.ship.x;
      const ty=(typeof d.y==='number')?d.y:rp.ship.y;
      rp.ship.x+=(tx-rp.ship.x)*Math.min(1,delta/1000*12);
      rp.ship.y+=(ty-rp.ship.y)*Math.min(1,delta/1000*12);
      rp.ship.x=Phaser.Math.Clamp(rp.ship.x,20,W-20);
      rp.ship.y=Phaser.Math.Clamp(rp.ship.y,60,H-40);
      rp.flame.x=rp.ship.x; rp.flame.y=rp.ship.y+20;
      rp.flame.setScale(0.6+Math.sin(time/40)*0.1,0.8+Math.sin(time/30)*0.15);
      rp.label.x=rp.ship.x; rp.label.y=rp.ship.y-30;
      rp.firing=d.firing?1:0;
      if (d.bomb){ this.remoteBomb(rp.ship.x,rp.ship.y); delete d.bomb; }
      rp.fireCd-=delta;
      if (rp.firing && rp.fireCd<=0){
        rp.fireCd=165;
        const b=this.add.image(rp.ship.x,rp.ship.y-18,'bullet').setDepth(8).setTint(0x88ffcc);
        b.speed=-500; b.dmg=1; b.weapon='normal'; b.pierce=false;
        this.shipBullets.add(b);
      }
    }
    for (const id in this.remotePlayers){
      if (!seen[id]){ const rp=this.remotePlayers[id]; if(rp.ship)rp.ship.destroy(); if(rp.flame)rp.flame.destroy(); if(rp.label)rp.label.destroy(); delete this.remotePlayers[id]; }
    }
  }

  remoteBomb(x,y){
    AUDIO.sfx('bomb'); vib(150);
    const c=this.add.circle(x,y,140,0xffaa00,0.5).setDepth(6);
    this.tweens.add({targets:c,scale:1.6,alpha:0,duration:350,onComplete:()=>c.destroy()});
    this.enemies.getChildren().slice().forEach(e=>{
      if (!e||!e.active) return;
      const dx=e.x-x, dy=e.y-y;
      if (dx*dx+dy*dy<160*160){ e.hp-=40; if (e.hp<=0) this.killEnemy(e); }
    });
  }

  renderNet(time){
    const s=COOP.worldSnapshot; if (!s) return;
    if (s.meta){
      if (typeof s.meta.score==='number') this.score=s.meta.score;
      if (typeof s.meta.lives==='number') this.lives=s.meta.lives;
      this.levelKills=s.meta.kills||0; this.totalEnemies=s.meta.total||0; this.bossSpawned=!!s.meta.boss;
      if (typeof s.meta.lvl==='number' && s.meta.lvl!==this.levelIdx){ this.loadLevel(s.meta.lvl); return; }
    }
    this.syncNet(this.netEnemies, s.le, (d)=>this.add.image(d[0],d[1],'enemy_'+d[2]).setDepth(5), (o,d)=>{ if (o.getData('kt')!==d[2]){ o.setTexture('enemy_'+d[2]); o.setData('kt',d[2]); } o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netEBullets, s.eb, (d)=>this.add.image(d[0],d[1],'ebullet').setDepth(7), (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netPBullets, s.pb, (d)=>this.add.image(d[0],d[1],'bullet').setDepth(8).setTint(0x88bbff), (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    this.syncNet(this.netItems, s.it, (d)=>{ const im=this.add.image(d[0],d[1],d[2]).setDepth(6); im.itemType=d[2]; return im; }, (o,d)=>{ o.x=d[0]; o.y=d[1]; });
    const others=(s.pl||[]).filter(p=>p[0]!==COOP.myId);
    this.syncNet(this.netPlayers, others, (p)=>{ const im=this.add.image(p[1],p[2],'ship_'+p[3]).setDepth(10).setScale(0.62).setTint(0xaaffcc); const lb=this.add.text(p[1],p[2]-30,(p[5]||'').slice(0,12),{fontSize:'9px',fontFamily:'monospace',color:'#aaffcc',stroke:'#002200',strokeThickness:3}).setOrigin(0.5).setDepth(12); im.lbl=lb; return im; }, (o,p)=>{ if (o.getData('kk')!==p[3]){ o.setTexture('ship_'+p[3]); o.setData('kk',p[3]); } o.x=p[1]; o.y=p[2]; if (o.lbl){ o.lbl.x=p[1]; o.lbl.y=p[2]-30; const nm=(p[5]||'').slice(0,12); if (o.lbl.text!==nm) o.lbl.setText(nm); } });
  }

  syncNet(list, arr, mk, up){
    arr=arr||[];
    while (list.length<arr.length){ try { list.push(mk(arr[list.length])); } catch(e){ list.push(null); } }
    while (list.length>arr.length){ const o=list.pop(); if (o){ if (o.lbl) o.lbl.destroy(); o.destroy(); } }
    for (let i=0;i<arr.length;i++){ if (list[i]) up(list[i],arr[i],i); }
  }

  enemyFire(e){
    const isBoss=!!e.isBoss;
    // Cap de proyectiles enemigos: deja huecos y evita saturar la pantalla
    if (this.ebullets.countActive(true) > (this.maxEBullets||14)) return;
    const sx=this.ship?this.ship.x:e.x;
    const mk=(x,y,vx,vy,tex)=>{
      const b=this.add.image(x,y,tex||'ebullet').setDepth(7);
      b.speed=vy||200*this.diff.spdMul;
      b.vx=vx||0;
      this.ebullets.add(b);
    };
    if (e.type==='sniper'){
      mk(e.x,e.y+16,(sx-e.x)*0.55,270*this.diff.spdMul);
    } else if (e.type==='bomber'){
      mk(e.x-8,e.y+18,(Math.random()-0.5)*120,190*this.diff.spdMul);
      mk(e.x+8,e.y+18,(Math.random()-0.5)*120,190*this.diff.spdMul);
      if (Math.random()<0.35){ const m=this.add.image(e.x,e.y+20,'mine').setDepth(7); m.speed=120*this.diff.spdMul; m.vx=0; this.ebullets.add(m); }
    } else if (e.type==='shielder'){
      for (let i=-1;i<=1;i+=2) mk(e.x+i*10,e.y+18,i*55,215*this.diff.spdMul);
    } else if (isBoss){
      const n=(this.levelIdx>=59)?3:2;
      for (let i=0;i<n;i++){ const a=(i-(n-1)/2)*0.3; mk(e.x+Math.sin(a)*22,e.y+24,Math.sin(a)*190,210*this.diff.spdMul); }
    } else {
      mk(e.x,e.y+20,(sx-e.x)*0.3,200*this.diff.spdMul);
    }
  }

  killEnemy(e){
    const isBoss=!!e.isBoss;
    const def=ENEMY_TYPES[e.type]||BOSS_TYPES[e.type];
    const base=e.bossScore||(def?def.score:10);
    const rad=e.bossR||16;
    this.score+=base*this.diff.scoreMul*this.scoreMultiplier;
    this.levelKills++;
    AUDIO.sfx('explosion');
    vib(isBoss?200:80);
    const radius=isBoss?(rad*0.9):15;
    const exp=this.add.circle(e.x,e.y,radius,0xffaa00,0.8).setDepth(6);
    this.tweens.add({targets:exp,scale:2,alpha:0,duration:isBoss?520:300,onComplete:()=>exp.destroy()});
    if (isBoss){
      for (let i=0;i<6;i++){
        const ex=this.add.circle(e.x+Phaser.Math.Between(-30,30),e.y+Phaser.Math.Between(-20,20),12,0xff6600,0.9).setDepth(6);
        this.tweens.add({targets:ex,scale:2.4,alpha:0,duration:400+Math.random()*300,delay:i*70,onComplete:()=>ex.destroy()});
      }
    }
    const dropChance=isBoss?1:0.28;
    if (Math.random()<dropChance){
      const n=isBoss?3:1;
      for (let i=0;i<n;i++){
        const chosen=rollItemKey();
        const it=this.add.image(e.x+Phaser.Math.Between(-22,22),e.y+Phaser.Math.Between(-16,16),chosen).setDepth(6);
        it.itemType=chosen;
        this.items.add(it);
      }
    }
    if (e.flameRef) e.flameRef.destroy();
    e.destroy();
  }
}

// ===== NIVEL COMPLETADO =====
class LevelCompleteScene extends Phaser.Scene {
  constructor(){ super('LevelComplete'); }
  init(data){ this.summary=data; this.advanced=false; }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    AUDIO.startMusic(-2);
    const d=this.summary;
    if (d && d.client){
      this.add.text(W/2,H/2,t('level')+' '+(d.levelIdx+1)+' '+t('levelComplete'),{fontSize:'18px',fontFamily:'monospace',color:'#ffdd44',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5).setDepth(91);
      this.add.text(W/2,H/2+40,t('waitingPlayers'),{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5).setDepth(91);
      return;
    }
    const acc=d.shotsFired>0?Math.floor((d.shotsHit/d.shotsFired)*100):0;
    this.add.rectangle(W/2,H/2,W,H,0x000000,0.9).setDepth(90);
    const cx=W/2, cy=H/2-40;
    const mk=(dy,txt,color,size,bold)=>this.add.text(cx,cy+dy,txt,{fontSize:(size||14)+'px',fontFamily:'monospace',color:color,fontStyle:bold?'bold':'normal',stroke:'#000',strokeThickness:bold?4:2}).setOrigin(0.5).setDepth(91);
    mk(-130,t('level')+' '+(d.levelIdx+1)+' '+t('levelComplete'),'#ffdd44',22,true);
    mk(-80,t('enemies')+': '+d.levelKills+'/'+d.totalEnemies,'#ffffff');
    mk(-50,t('accuracy')+': '+acc+'%','#88bbff');
    mk(-20,t('points')+': '+Math.floor(d.score),'#00d4ff');
    mk(10,t('lives')+': '+d.lives+'   '+t('bombs')+': '+d.bombs,'#ff4466');
    const last=d.levelIdx>=LEVELS.length-1;
    const b=this.add.text(cx,cy+90,'[ '+(last?t('victoryBtn'):t('nextLevel'))+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#44ff88',stroke:'#000',strokeThickness:3}).setOrigin(0.5).setDepth(91);
    this.tweens.add({targets:b,alpha:0.3,duration:500,yoyo:true,repeat:-1});
    b.setInteractive({useHandCursor:true});
    b.on('pointerdown',()=>this.advance());
    this.countdown=6;
    this.cdText=this.add.text(cx,cy+125,tf('autoAdvance',{s:this.countdown}),{fontSize:'11px',fontFamily:'monospace',color:'#668899'}).setOrigin(0.5).setDepth(91);
    this.cdTimer=this.time.addEvent({delay:1000,repeat:this.countdown-1,callback:()=>{
      this.countdown--;
      if (this.countdown<=0) this.advance();
      else if (this.cdText) this.cdText.setText(tf('autoAdvance',{s:this.countdown}));
    }});
  }
  advance(){
    if (this.advanced) return;
    this.advanced=true;
    if (this.cdTimer) this.cdTimer.remove();
    const d=this.summary;
    if (d.levelIdx>=LEVELS.length-1){
      if (COOP.mode()==='host') COOP.broadcastEvent({e:'victory'});
      COOP.destroy();
      clearProgress();
      this.scene.start('GameOver',{score:d.score, victory:true, shotsFired:d.shotsFired, shotsHit:d.shotsHit, shipIdx:d.shipIdx, diffIdx:d.diffIdx});
      return;
    }
    if (COOP.mode()!=='client'){
      this.scene.start('Game',{ diffIdx:d.diffIdx, shipIdx:d.shipIdx, continueData:{ score:d.score, lives:d.lives, bombs:d.bombs, shotsFired:d.shotsFired, shotsHit:d.shotsHit, weaponKey:d.weaponKey, powerLevel:d.powerLevel, nextLevel:d.levelIdx+1 } });
    }
  }
}

// ===== GAME OVER =====
class GameOverScene extends Phaser.Scene {
  constructor(){ super('GameOver'); }
  init(data){
    this.finalScore=data.score||0; this.shotsFired=data.shotsFired||0; this.shotsHit=data.shotsHit||0;
    this.victory=!!data.victory; this.defeat=!!data.defeat;
    this.levelIdx=data.levelIdx; this.diffIdx=data.diffIdx; this.shipIdx=data.shipIdx;
    this.scoreAtLevelStart=data.scoreAtLevelStart||0;
  }
  create(){
    this.cameras.main.setBackgroundColor(0x000000);
    AUDIO.startMusic(this.victory?-4:-3);
    if (this.victory) {
      // Outró: nave se aleja volando
      const ship=this.add.image(W/2,H/2,'ship_'+SHIPS[this.shipIdx||0].key).setScale(1.3).setDepth(80);
      this.add.particles(ship.x,ship.y,'spark',{
        follow:ship, followOffset:{x:0,y:10},
        speedY:{min:50,max:120}, speedX:{min:-20,max:20},
        scale:{start:1.2,end:0}, alpha:{start:0.8,end:0},
        lifespan:300, frequency:40, quantity:1, tint:[0xffee00,0xff9900], blendMode:'ADD'
      }).setDepth(79);
      this.tweens.add({targets:ship, y:-160, duration:1600, ease:'Cubic.In',
        onComplete:()=>this.showCredits()
      });
      return;
    }
    // Derrota o normal
    const cx=W/2, cy=H/2-60;
    this.add.text(cx,cy-40,this.defeat? t('gameOver') : t('gameOver'),{fontSize:'36px',fontFamily:'monospace',color:'#ff4444',fontStyle:'bold',stroke:'#000',strokeThickness:4}).setOrigin(0.5);
    this.add.text(cx,cy,t('points')+': '+Math.floor(this.finalScore),{fontSize:'22px',fontFamily:'monospace',color:'#ffaa00'}).setOrigin(0.5);
    const acc=this.shotsFired>0?Math.floor((this.shotsHit/this.shotsFired)*100):0;
    this.add.text(cx,cy+30,t('accuracy')+': '+acc+'%',{fontSize:'14px',fontFamily:'monospace',color:'#88bbff'}).setOrigin(0.5);
    if (this.defeat){
      const r=this.add.text(cx,cy+70,'[ '+t('retry')+' — '+t('level')+' '+(this.levelIdx+1)+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#44ff88',stroke:'#000',strokeThickness:3}).setOrigin(0.5);
      r.setInteractive({useHandCursor:true});
      r.on('pointerdown',()=>{
        const sd=this.scoreAtLevelStart||0;
        this.scene.start('Game',{ diffIdx:this.diffIdx||1, shipIdx:this.shipIdx||0,
          continueData:{ nextLevel:this.levelIdx||0, score:sd, lives:3, bombs:2, shotsFired:0, shotsHit:0, weaponKey:'normal', powerLevel:0 } });
      });
    }
    const m=this.add.text(cx,cy+110,'[ '+t('menu')+' ]',{fontSize:'16px',fontFamily:'monospace',color:'#00d4ff'}).setOrigin(0.5);
    m.setInteractive({useHandCursor:true});
    m.on('pointerdown',()=>{ COOP.destroy(); this.scene.start('Menu'); });
    const cr=this.add.text(cx,cy+140,'[ '+t('seeCredits')+' ]',{fontSize:'13px',fontFamily:'monospace',color:'#666'}).setOrigin(0.5);
    cr.setInteractive({useHandCursor:true});
    cr.on('pointerdown',()=>this.showCredits());
  }
  showCredits(){
    this.scene.start('Credits');
  }
}

// ===== INTRO / PANTALLA DE APERTURA =====
(function(){
 try{
  (function(){
    var hexc=function(n){return '#'+('000000'+((n>>>0)&0xffffff).toString(16)).slice(-6);};
    var rr=function(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
    var makeG=function(c){
      var close=function(pts){c.beginPath();for(var i=0;i<pts.length;i++){var q=pts[i];if(i)c.lineTo(q.x,q.y);else c.moveTo(q.x,q.y);}c.closePath();};
      return {
        fillStyle:function(col,a){c.fillStyle=hexc(col);c.globalAlpha=(a==null?1:a);},
        lineStyle:function(w,col,a){c.strokeStyle=hexc(col);c.lineWidth=w||1;c.globalAlpha=(a==null?1:a);},
        fillRect:function(x,y,w,h){c.fillRect(x,y,w,h);},
        strokeRect:function(x,y,w,h){c.strokeRect(x,y,w,h);},
        fillCircle:function(x,y,r){c.beginPath();c.arc(x,y,r,0,6.2832);c.fill();},
        fillEllipse:function(x,y,w,h){c.beginPath();c.ellipse(x,y,w/2,h/2,0,0,6.2832);c.fill();},
        fillRoundedRect:function(x,y,w,h,r){rr(c,x,y,w,h,r);c.fill();},
        fillPoints:function(pts){close(pts);c.fill();},
        strokePoints:function(pts){close(pts);c.stroke();},
        lineBetween:function(x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
      };
    };
    var cv=document.querySelectorAll('#intro-overlay .ship canvas');
    for(var i=0;i<cv.length;i++){
      var key=cv[i].getAttribute('data-key')||'viper';
      var sh=null; for(var j=0;j<SHIPS.length;j++){ if(SHIPS[j].key===key) sh=SHIPS[j]; }
      if(!sh) sh=SHIPS[0];
      var ctx=cv[i].getContext("2d");
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv[i].width,cv[i].height);
      drawPlayerShip(makeG(ctx),key,sh.color);
      var cc=hexc(sh.color);
      cv[i].style.filter='drop-shadow(0 0 8px '+cc+') drop-shadow(0 0 16px '+cc+'88)';
    }
  })();
  var sc=document.getElementById('intro-stars');
  if(sc){ for(var i=0;i<150;i++){ var s=document.createElement('div'); s.className='star'; var sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.animationDelay=Math.random()*3+'s'; s.style.animationDuration=(Math.random()*3+2)+'s'; sc.appendChild(s); } }
  var sk=document.getElementById('intro-sparks');
  if(sk){ for(var j=0;j<30;j++){ var p=document.createElement('div'); p.className='spark'; p.style.left=Math.random()*100+'%'; p.style.top=Math.random()*100+'%'; if(p.style.setProperty){ p.style.setProperty('--dx',(Math.random()*200-100)+'px'); p.style.setProperty('--dy',(Math.random()*200-100)+'px'); } p.style.animationDelay=Math.random()*8+'s'; p.style.animationDuration=(Math.random()*6+6)+'s'; sk.appendChild(p); } }
  var unlocked=false;
  function audioDiag(tag){ try{ var m='AUDIO_'+tag+' en='+(AUDIO.isEnabled()?1:0)+' ctx='+AUDIO.state()+' playing='+(AUDIO.isPlaying()?1:0)+' tr='+AUDIO.track(); (new Image()).src='/__err?m='+encodeURIComponent(m)+'&_='+Date.now(); }catch(e){} }
  function tryStartMusic(){ try{ AUDIO.init(); AUDIO.resume(); if(!AUDIO.isPlaying()) AUDIO.startMusic(-1); }catch(e){} }
  function hideHint(){ var h=document.getElementById('intro-audio-hint'); if(h) h.classList.add('hide'); }
  function unlockAudio(){ if(unlocked) return; unlocked=true; tryStartMusic(); try{ AUDIO.sfx('click'); }catch(e){} hideHint(); audioDiag('unlock'); setTimeout(function(){ try{ AUDIO.resume(); }catch(e){} audioDiag('after'); },600); }
  document.addEventListener('pointerdown',unlockAudio,{once:true});
  document.addEventListener('touchstart',unlockAudio,{once:true});
  document.addEventListener('click',unlockAudio,{once:true});
  document.addEventListener('keydown',unlockAudio,{once:true});
  var introOv=document.getElementById('intro-overlay');
  if(introOv){ introOv.addEventListener('pointerdown',unlockAudio); introOv.addEventListener('touchstart',unlockAudio); }
  // Mejor esfuerzo: intenta arrancar la música ya (quedará en espera hasta el primer toque)
  tryStartMusic();
  audioDiag('load');
  var sub=document.getElementById('intro-subtitle'); if(sub) sub.textContent=t('introSub');
  var ssub=document.getElementById('intro-saga-sub'); if(ssub) ssub.textContent=t('sagaSub');
  var btn=document.getElementById('intro-start');
  if(btn){ btn.addEventListener('click',function(){
    try{ unlockAudio(); AUDIO.sfx('click'); window.__splashDone=true; AUDIO.startMusic(-6); audioDiag('start'); }catch(e){ window.__splashDone=true; }
    var el=document.getElementById('intro-overlay');
    if(el){ el.classList.add('intro-hide'); setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },650); }
  }); }
 }catch(e){}
})();
